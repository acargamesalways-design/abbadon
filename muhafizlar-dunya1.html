function applyEnvironment(map){
  const p = ENV_PRESETS[map.timeOfDay] || ENV_PRESETS.day;
  if(R.scene.fog) R.scene.fog.color.set(p.fog);
  R.skyMat.uniforms.top.value.set(p.skyTop);
  R.skyMat.uniforms.bot.value.set(p.skyBot);
  R.sunMat.color.set(p.sunDisc); R.sunMat.opacity=p.sunOpacity;
  R.haloMat.opacity=p.haloOpacity;
  R.hemi.color.set(p.hemiSky); R.hemi.groundColor.set(p.hemiGround); R.hemi.intensity=p.hemiI;
  R.sunLight.color.set(p.sunColor); R.sunLight.intensity=p.sunI;
  R.fill.color.set(p.fillColor); R.fill.intensity=p.fillI;
  R.rim.color.set(p.rimColor); R.rim.intensity=p.rimI;
  R.ash.material.color.set(p.ashColor); R.ash.material.opacity=p.ashOpacity;

  /* gerçek gökyüzü fotoğrafı varsa (Kenney skybox) onu kullan, yoksa eski gradyan gökyüzüne düş */
  const skyKey = map.timeOfDay==='night' ? 'night' : (map.timeOfDay==='dusk' ? 'morning' : 'day');
  if(SKY_MAT_CACHE[skyKey]){
    R.sky.material = SKY_MAT_CACHE[skyKey];
    R.sun.visible = false; R.halo.visible = false;
  } else {
    R.sky.material = R.skyMat;
    R.sun.visible = true; R.halo.visible = true;
  }

  R.nightLights.forEach(l=>R.stage&&R.stage.remove(l));
  R.nightLights=[];
  if(map.timeOfDay==='night' || map.timeOfDay==='dusk'){
    const accents=map.timeOfDay==='night' ? [0xff5fa8,0x5fe8ff,0xffd166] : [0xff9a5a,0xffd166];
    for(let i=0;i<5;i++){
      const col=accents[i%accents.length];
      const l=new THREE.PointLight(col, 1.1, 6, 2);
      l.position.set(rnd(-9,9), rnd(0.6,1.6), rnd(-6,6));
      R.stage.add(l); R.nightLights.push(l);
    }
  }
}

function resizeR(){
  if(!R) return;
  const host=document.getElementById('battleScreen');
  const w=host.clientWidth||window.innerWidth, h=host.clientHeight||window.innerHeight;
  if(w<2||h<2) return;
  R.renderer.setSize(w,h,false);
  R.camera.aspect=w/h; R.camera.updateProjectionMatrix();
}
/* Kameranın en yatık açısı. 50°'nin altına inilmiyor çünkü daha yatık açılarda
   görüş alanı ufka doğru hızla açılıyor (26°'de zemin 127 birim öteye kadar
   görünüyordu) ve o kadar uzağı dekorla doldurmak hem imkânsız hem gereksiz.
   50°'de görüş ~15 birimde bitiyor, dolayısıyla dar bir dekor kuşağı yetiyor. */
const CAM_PITCH_MIN = 50*Math.PI/180;
/* verilen kamera mesafesinde görülen en uzak zemin noktasının hedeften uzaklığı */
function viewReach(dist, pitch){
  const half=(46*Math.PI/180)/2;
  const top=pitch-half;
  if(top<=0.01) return 999;
  return dist*(Math.sin(pitch)/Math.tan(top) - Math.cos(pitch));
}

/* gölge kamerasını ızgaraya oturt — sınırların dışı gölgesiz kalıp
   soluk lekeler halinde göründüğü için görüş alanını kapsaması şart */
function fitShadowCamera(){
  if(!R || !R.sunLight) return;
  const b = Math.max(COLS, ROWS)*T*0.5 + 10;
  const sc = R.sunLight.shadow.camera;
  sc.left=-b; sc.right=b; sc.top=b; sc.bottom=-b;
  sc.near=1; sc.far=90;
  sc.updateProjectionMatrix();
  if(R.sunLight.shadow.map){ R.sunLight.shadow.map.dispose(); R.sunLight.shadow.map=null; }
}

/* ızgara boyutuna göre kamerayı oturt — büyük haritalarda otomatik geri çekilir */
function fitCameraToGrid(){
  /* eskiden Math.max(...) — çok geniş ama alçak haritalarda (New York: 30x15)
     baskın oranı tek başına alıp gereğinden çok geri çekiyordu. Ortalama,
     her iki ekseni de dengeli hesaba katıyor. */
  const scale=Math.max((COLS/12 + ROWS/9)/2, 1);
  R.camYaw=0; R.camPitch=0.95;          /* varsayılan açı, alt sınırın biraz üstünde */
  R.camDist=15.5*scale;
  R.camMin=Math.max(6, 9*scale);         /* yakınlaşma serbest — camDist ile aynı
    oranda büyür, büyük haritalarda (New York gibi) orantısız yakınlaşıp
    binalara gömülme sorunu yok */
  R.camMax=R.camDist;                    /* uzaklaşma İLK KADRAJIN ÖTESİNE
    GEÇEMEZ — varsayılan görünüm zaten haritanın tamamını gösteriyor, daha
    fazla uzaklaşmaya gerek yok */
  /* en kötü durumda (en uzak + en yatık açı) görülebilen gerçek mesafe — zemin
     döşemesi BUNU asla eksik bırakmamalı, yoksa köşeye kaydırınca arkada boşluk
     (gökyüzü) görünür. Dekor nesnelerini (bina/ağaç) bu kadar uzağa dizmek
     performans israfı olduğu için onlar ayrı, 20 birimle sınırlı bir yarıçap
     (decorOuter) kullanıyor — sadece zemin gerçek mesafeye göre büyüyor. */
  R.groundReach = viewReach(R.camMax, CAM_PITCH_MIN) + 1.5;
  R.decorOuter = Math.min(20, R.groundReach);
  if(!R.camTarget) R.camTarget=new THREE.Vector3(0,0.3,0);
  R.camTarget.set(0,0.3,0);
  fitShadowCamera();
  /* sis kuşağın hemen ötesinde kapansın — arkasında ne olduğu görünmesin */
  /* sis yok — decorOuter artık sadece dekor kuşağının boyutunu belirliyor */
}

function updateCam(){
  const d=R.camDist, p=R.camPitch, y=R.camYaw;
  const t=R.camTarget || (R.camTarget=new THREE.Vector3(0,0.3,0));
  R.camera.position.set(
    t.x + Math.sin(y)*Math.cos(p)*d,
    Math.sin(p)*d,
    t.z + Math.cos(y)*Math.cos(p)*d
  );
  R.camera.lookAt(t.x, 0.3, t.z);
}

/* ---------------- input ----------------
   tek parmak  : kaydırma (pan)
   iki parmak  : döndürme (orta noktanın hareketi) + zoom (pinch)
   fare        : sol sürükle = pan, sağ sürükle veya Shift = döndür, tekerlek = zoom
   tek dokunuş : kare seçimi (9 piksel eşiğinin altındaki hareket) */
function setupInput(canvas){
  const ptrs=new Map();
  let moved=0, tapOk=false, lastMid=null, lastDist=0, rotateMode=false;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  /* kameranın bakış noktasını ızgara sınırları içinde tut */
  function clampTarget(){
    const t=R.camTarget;
    const mx=COLS*T*0.5, mz=ROWS*T*0.5;
    t.x=clamp(t.x,-mx,mx);
    t.z=clamp(t.z,-mz,mz);
  }
  /* ekran pikselini dünya birimine çevirerek "zemini tutup çekme" hissi ver */
  function panBy(dx,dy){
    if(!R.camTarget) R.camTarget=new THREE.Vector3(0,0.3,0);
    const h=canvas.clientHeight||750;
    const k=(2*R.camDist*Math.tan((46*Math.PI/180)/2))/h;
    const y=R.camYaw;
    const rx=Math.cos(y),  rz=-Math.sin(y);   /* kameranın sağ ekseni */
    const fx=-Math.sin(y), fz=-Math.cos(y);   /* zemine izdüşen ileri ekseni */
    R.camTarget.x += -rx*dx*k + fx*dy*k;
    R.camTarget.z += -rz*dx*k + fz*dy*k;
    clampTarget();
  }
  function zoomBy(delta){
    R.camDist=clamp(R.camDist+delta, R.camMin||9, R.camMax||24);
  }

  canvas.addEventListener('contextmenu',e=>e.preventDefault());

  canvas.addEventListener('pointerdown',e=>{
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){
      moved=0; tapOk=true;
      rotateMode = (e.button===2) || e.shiftKey;
    } else {
      tapOk=false; rotateMode=false;
    }
    lastMid=null; lastDist=0;
  });

  canvas.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)) return;
    const prev=ptrs.get(e.pointerId);
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

    if(ptrs.size===1){
      moved+=Math.abs(dx)+Math.abs(dy);
      if(rotateMode){
        R.camYaw -= dx*0.006;
        R.camPitch = clamp(R.camPitch + dy*0.004, CAM_PITCH_MIN, 1.25);
      } else {
        panBy(dx,dy);
      }
    } else if(ptrs.size>=2){
      tapOk=false;
      const a=[...ptrs.values()];
      const mid={x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2};
      const dist=Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
      if(lastMid){
        R.camYaw -= (mid.x-lastMid.x)*0.006;
        R.camPitch = clamp(R.camPitch + (mid.y-lastMid.y)*0.004, CAM_PITCH_MIN, 1.25);
      }
      if(lastDist) zoomBy(-(dist-lastDist)*0.03);
      lastMid=mid; lastDist=dist;
    }
  });

  const release=e=>{
    if(!ptrs.has(e.pointerId)) return;
    const wasLast = ptrs.size===1;
    ptrs.delete(e.pointerId);
    if(wasLast){
      if(tapOk && moved<9) onTap(e);
      tapOk=false; rotateMode=false;
    }
    lastMid=null; lastDist=0;
  };
  canvas.addEventListener('pointerup',release);
  canvas.addEventListener('pointercancel',e=>{ ptrs.delete(e.pointerId); tapOk=false; lastMid=null; lastDist=0; });

  canvas.addEventListener('wheel',e=>{ zoomBy(e.deltaY*0.012); e.preventDefault(); },{passive:false});
}
function onTap(e){
  if(!B||B.over) return;
  const rect=R.renderer.domElement.getBoundingClientRect();
  R.ndc.x=((e.clientX-rect.left)/rect.width)*2-1;
  R.ndc.y=-((e.clientY-rect.top)/rect.height)*2+1;
  R.ray.setFromCamera(R.ndc,R.camera);
  const hit=R.ray.intersectObjects(B.tiles);
  if(!hit.length){ clearSelection(); return; }
  const td=hit[0].object.userData;
  if(B.picking){
    if(td.path||td.unit||td.blocked){ toast('Buraya yerleştirilemez.'); return; }
    placeUnit(td, B.picking);
  } else if(td.unit){
    selectUnit(td.unit);
  } else clearSelection();
}

/* ---------------- scene construction ---------------- */
function clearStage(){
  if(R.stage) R.scene.remove(R.stage);
  R.stage=new THREE.Group(); R.scene.add(R.stage);
}
const MAT={};
const SHADOW_MAT=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.22,depthWrite:false});
function mat(color,rough,metal){
  const k=color+'_'+rough;
  if(!MAT[k]) MAT[k]=new THREE.MeshStandardMaterial({color,roughness:rough===undefined?0.92:rough,metalness:metal||0});
  return MAT[k];
}

/* Savaş içi patika — sadece Quaternius Path_Straight parçası kullanılıyor (tüm haritalarda,
   tema farkı yok). Bu parça yalnızca düz: varsayılan olarak Z ekseni boyunca uzanıyor
   (dünya boyutu ~0.5 x 1.0). Virajlarda tek bir eğik parça olmadığından, hücrede hem
   Z hem X yönünde birer kopya üst üste konup doğal bir "kavşak" hissi veriliyor —
   organik bir toprak/taş patika için bu, sert bir viraj yerine oldukça uygun duruyor. */
function dirEq(a,b){ return a[0]===b[0] && a[1]===b[1]; }
/* Savaş patikası. Path_Straight parçası 0.496 birim genişliğinde, kare ise 1.0 —
   tek parça kareyi doldurmadığı için yan yana İKİ parça konur (hafif bindirmeyle,
   böylece ne karo içinde ne de komşularla boşluk kalır).
   Yön, komşu sayısına göre seçilir: geniş koridorlarda doku koridor boyunca akar. */
function buildRoadPiece(pathCells, c, r, pal, cellSet){
  const set = cellSet || new Set(pathCells.map(p=>p.c+','+p.r));
  if(!set.has(c+','+r)) return null;

  const piece=()=>{
    if(MODEL_CACHE['path-straight']) return cloneModel('path-straight');
    const fb=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.05,T*0.98), mat(pal.road,0.92));
    fb.receiveShadow=true;
    return fb;
  };

  const up=set.has(c+','+(r-1)), down=set.has(c+','+(r+1));
  const left=set.has((c-1)+','+r), right=set.has((c+1)+','+r);
  const vert=(up?1:0)+(down?1:0), horiz=(left?1:0)+(right?1:0);
  /* eşitlikte yatayı tercih et; tamamen yalnız karo da yatay olsun */
  const alongZ = vert>horiz;

  const g=new THREE.Group();
  /* iki parça yan yana: karo içinde birbirleriyle örtüşür (delik yok), ama karo
     kenarında ~%10 kum şeridi bırakır — böylece paralel koridorlar tek bir taş
     kütle gibi değil, ayrı yollar gibi okunur. Uzunlamasına ise tam bindirme var,
     yani koridor boyunca kesintisiz akar. */
  for(const off of [-0.20, 0.20]){
    const p=piece();
    p.scale.z *= 1.03;
    if(alongZ){ p.rotation.y=0;          p.position.x=off; }
    else      { p.rotation.y=Math.PI/2;  p.position.z=off; }
    g.add(p);
  }
  g.traverse(o=>{ if(o.isMesh){ o.receiveShadow=true; o.castShadow=false; } });
  return g;
}

/* ---- KARADELİK (Abbadon geçidi) ----
   Olay ufku + eğik yığılma diski (Kenney noise sprite'ları katmanlı ve farklı
   hızlarda döner) + ışık bükülmesi halkası. Orta boy: spawn karosunda belirgin
   ama haritayı ezmiyor. */
function buildBlackHole(){
  const g=new THREE.Group();
  g.userData.disks=[];

  /* olay ufku — ışık yutan saf siyah küre */
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.30,24,20),
    new THREE.MeshBasicMaterial({color:0x000000}));
  g.add(core);

  /* foton halkası — ufkun hemen dışında ince parlak çember */
  const photon=new THREE.Mesh(new THREE.TorusGeometry(0.345,0.022,10,40),
    new THREE.MeshBasicMaterial({color:0xE0BBFF,transparent:true,opacity:0.95,
      blending:THREE.AdditiveBlending,depthWrite:false}));
  g.add(photon);
  g.userData.photon=photon;

  /* yığılma diski — 3 katman, farklı ölçek/hız/renk */
  const diskCfg=[
    {tex:'disk0', size:1.55, speed: 0.55, color:0x9d5fe0, op:0.85},
    {tex:'disk1', size:1.25, speed:-0.85, color:0xC98BFF, op:0.70},
    {tex:'disk2', size:1.85, speed: 0.32, color:0x6b2fa8, op:0.55},
  ];
  for(const cfg of diskCfg){
    const texture=FX_TEX[cfg.tex];
    const mat=texture
      ? new THREE.MeshBasicMaterial({map:texture,color:cfg.color,transparent:true,
          opacity:cfg.op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide})
      : new THREE.MeshBasicMaterial({color:cfg.color,transparent:true,opacity:cfg.op*0.4,
          blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
    const d=new THREE.Mesh(new THREE.PlaneGeometry(cfg.size,cfg.size), mat);
    /* diski yatıya yakın ama hafif eğik tut — hacim hissi verir */
    d.rotation.x=-Math.PI/2 + 0.42;
    d.userData.speed=cfg.speed;
    g.add(d);
    g.userData.disks.push(d);
  }

  /* dış hale — sisin içinde yumuşak mor parıltı */
  const halo=new THREE.Mesh(new THREE.SphereGeometry(0.62,20,16),
    new THREE.MeshBasicMaterial({color:PAL.abd,transparent:true,opacity:0.16,
      side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));
  g.add(halo);

  /* geçidin çevreye vurduğu ışık */
  const light=new THREE.PointLight(PAL.abdGlow, 2.2, 5.5, 2);
  g.add(light);
  g.userData.light=light;

  return g;
}

/* ---------------- STATİK GEOMETRİ BİRLEŞTİRME ----------------
   Ağaçlar, binalar, yollar, çimenler hiç hareket etmiyor. Aynı materyali
   paylaşanları tek bir geometride toplayınca çizim çağrısı sayısı ~40 kat düşüyor.
   Animasyonlu veya tıklanabilir nesneler userData.noMerge ile korunur. */
function mergeGeometryList(geoms){
  const first=geoms[0];
  const names=Object.keys(first.attributes).sort();
  let totalVerts=0, totalIdx=0;
  for(const g of geoms){
    totalVerts += g.attributes.position.count;
    totalIdx   += g.index ? g.index.count : g.attributes.position.count;
  }
  const out=new THREE.BufferGeometry();
  for(const name of names){
    const itemSize=first.attributes[name].itemSize;
    const arr=new Float32Array(totalVerts*itemSize);
    let off=0;
    for(const g of geoms){
      const a=g.attributes[name];
      arr.set(a.array.subarray(0, a.count*itemSize), off);
      off += a.count*itemSize;
    }
    out.setAttribute(name, new THREE.BufferAttribute(arr, itemSize));
  }
  const IdxArr = totalVerts>65535 ? Uint32Array : Uint16Array;
  const idx=new IdxArr(totalIdx);
  let io=0, vo=0;
  for(const g of geoms){
    if(g.index){
      const gi=g.index.array;
      for(let i=0;i<gi.length;i++) idx[io++]=gi[i]+vo;
    } else {
      const n=g.attributes.position.count;
      for(let i=0;i<n;i++) idx[io++]=i+vo;
    }
    vo += g.attributes.position.count;
  }
  out.setIndex(new THREE.BufferAttribute(idx,1));
  out.computeBoundingSphere();
  return out;
}

function mergeStaticScene(){
  if(!R || !R.stage) return null;
  const stats={before:0, after:0, buckets:0, skipped:0};
  try{
    R.stage.updateMatrixWorld(true);
    const isProtected=(o)=>{
      let n=o;
      while(n){ if(n.userData && n.userData.noMerge) return true; n=n.parent; }
      return false;
    };
    const buckets=new Map();
    R.stage.traverse(o=>{
      if(!o.isMesh) return;
      stats.before++;
      if(o.isSkinnedMesh || isProtected(o)){ stats.skipped++; return; }
      const g=o.geometry, m=o.material;
      if(!g || !g.attributes || !g.attributes.position || Array.isArray(m)){ stats.skipped++; return; }
      /* sadece düz Float32 attribute'lar birleştirilebilir */
      for(const k in g.attributes){
        const a=g.attributes[k];
        if(a.isInterleavedBufferAttribute || !(a.array instanceof Float32Array)){ stats.skipped++; return; }
      }
      const key=m.uuid+'|'+Object.keys(g.attributes).sort().join(',')+'|'+(o.castShadow?1:0)+(o.receiveShadow?1:0)+(o.renderOrder||0);
      if(!buckets.has(key)) buckets.set(key,{mat:m,cast:o.castShadow,recv:o.receiveShadow,order:o.renderOrder||0,list:[]});
      buckets.get(key).list.push(o);
    });

    const merged=[];
    buckets.forEach(b=>{
      if(b.list.length<2){ stats.skipped+=b.list.length; return; }
      const geoms=[];
      for(const o of b.list){
        const gc=o.geometry.clone();
        gc.applyMatrix4(o.matrixWorld);
        geoms.push(gc);
      }
      let mg;
      try{ mg=mergeGeometryList(geoms); }
      catch(err){ console.warn('birleştirme atlandı:',err); geoms.forEach(g=>g.dispose()); stats.skipped+=b.list.length; return; }
      geoms.forEach(g=>g.dispose());
      const mesh=new THREE.Mesh(mg, b.mat);
      mesh.castShadow=b.cast; mesh.receiveShadow=b.recv;
      if(b.order) mesh.renderOrder=b.order;
      mesh.userData.noMerge=true;
      merged.push(mesh);
      /* orijinalleri sahneden çıkar */
      for(const o of b.list){ if(o.parent) o.parent.remove(o); }
      stats.buckets++;
    });
    merged.forEach(m=>R.stage.add(m));

    let after=0;
    R.stage.traverse(o=>{ if(o.isMesh) after++; });
    stats.after=after;
    return stats;
  }catch(err){
    console.warn('statik birleştirme başarısız, sahne olduğu gibi bırakıldı:',err);
    return null;
  }
}

/* Simgenin fiziksel olarak kapladığı alanı kaydeder: üstündeki kareler kurulabilir
   olmaktan çıkar, ayrıca çevre halka yolu bu alanın içinden geçmez (yapının altından
   yol geçmesi yerine yol yapının etrafından kesilir). Her simge için otomatik çalışır. */
function registerLandmarkFootprint(obj){
  if(!obj) return;
  const box=new THREE.Box3().setFromObject(obj);
  B.landmarkBox=box;
  if(B.tiles) B.tiles.forEach(t=>{
    if(t.userData.path || t.userData.blocked) return;
    const tx=t.position.x, tz=t.position.z, m=T*0.35;
    if(box.min.x < tx+m && box.max.x > tx-m &&
       box.min.z < tz+m && box.max.z > tz-m){
      t.userData.blocked=true;
    }
  });
}

function buildStage(map){
  setGrid(map);
  clearStage();
  applyEnvironment(map);
  const wayList = map.ways ? map.ways : [map.way];
  const routeCells = wayList.map(w=>expandPath(w));
  const pathCells=[]; const seenCell=new Set();
  const addCell=(c,r)=>{
    const k=c+','+r;
    if(!seenCell.has(k)){ seenCell.add(k); pathCells.push({c,r}); }
  };
  /* map.mask verilmişse görünen yol onun deseninden çizilir (çizimle birebir aynı olur);
     düşmanlar yine sadece tanımlı rotalarda yürür. Maske yoksa rotaların birleşimi kullanılır. */
  if(map.mask){
    map.mask.forEach((line,r)=>{
      for(let c=0;c<line.length;c++) if(line[c]==='#') addCell(c,r);
    });
  }
  routeCells.forEach(cells=>cells.forEach(c=>addCell(c.c,c.r)));
  const pset=new Set(pathCells.map(p=>p.c+','+p.r));
  const pal=Object.assign({},PAL,map.palette||{});

  /* base ground */
  /* zemin düzlemi kuşağın biraz ötesine kadar — 70x70 gereksizdi, görüş
     zaten ~16 birimde bitiyor */
  /* sis olmadığı için zemin kenarının kadrajın dışına çıkmaması şart —
     en uç pan + en uzak zoom durumunu da kapsayacak kadar cömert tutuluyor.
     NOT: decorOuter değil groundReach kullanılıyor — decorOuter dekor
     nesneleri için performans amaçlı 20'de sınırlı, ama zemin o sınırdan
     etkilenmemeli yoksa büyük haritalarda (New York gibi) köşeye kaydırınca
     zemin bitip arkada boşluk görünür. */
  const decorR=(R&&R.groundReach)||(R&&R.decorOuter)||18;
  const panHalf=Math.max((COLS-1)/2,(ROWS-1)/2)+0.85;
  const gndSize=Math.ceil((decorR+panHalf)*2.15);
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(gndSize,gndSize), mat(pal.ground,0.96));
  gnd.rotation.x=-Math.PI/2; gnd.position.y=-0.09; gnd.receiveShadow=true;
  R.stage.add(gnd);

  /* soft grass patches for variation — her yamaya ayrı yükseklik ve polygonOffset
     ver ki hem zeminle hem birbirleriyle z-kavgasına girmesinler.
     NOT: eskiden opak ve tam ground2 renginde olduğu için üstten bakışta keskin
     kenarlı koyu "leke/karaltı" gibi duruyordu (kullanıcı geri bildirimi).
     Artık hem saydam hem de ground/ground2 arası hafif bir karışım kullanıyor —
     kontrast çok düştüğü için artık ayrı bir şekil değil, yumuşak bir doku
     farkı gibi okunuyor. */
  const patchColor=new THREE.Color(pal.ground).lerp(new THREE.Color(pal.ground2),0.55);
  for(let i=0;i<26;i++){
    const s=rnd(1.4,3.2);
    const pm=new THREE.MeshStandardMaterial({ color:patchColor, roughness:0.97,
      transparent:true, opacity:0.4, depthWrite:false });
    const patch=new THREE.Mesh(new THREE.CircleGeometry(s,10), pm);
    patch.rotation.x=-Math.PI/2;
    const pr=gndSize*0.42;
    patch.position.set(rnd(-pr,pr), -0.082 + i*0.0004, rnd(-pr,pr));
    R.stage.add(patch);
  }

  /* river — only where a city's identity actually calls for one (e.g. İstanbul's strait) */
  if(map.riverMode){
    buildRiver(pal, map.riverMode);
  } else if(B){
    B.waterFx=[];
  }
  /* hücre bazlı su (örn. İstanbul boğazı) — mask'ten bağımsız, belirli karolar üstüne
     mavi/su yüzeyi bindirir. Bu hücreler otomatik olarak bloklu sayılır (aşağıda).
     Gerçek Ocean/Bridge modelleri yüklüyse (map.waterCols + map.bridgeRows) onlar
     kullanılır; yoksa düz renkli karo suya düşülür. */
  if(map.waterCols && MODEL_CACHE[STRAIT_MODELS.ocean.model]){
    buildStrait(map, pal);
  } else if(map.water && map.water.length){
    buildWaterCells(map.water, pal);
  }

  /* tiles: gerçek yol modelleri path hücrelerinde render edilir; dokunma algılaması için
     her hücrede (yol olsun olmasın) görünmez bir düzlem her zaman ayrıca tutulur. */
  B.tiles=[];
  const hitGeo=new THREE.PlaneGeometry(T*0.96,T*0.96);
  const blocked=new Set([...(map.blocked||[]), ...(map.water||[])].map(a=>a[0]+','+a[1]));
  const overWaterCol=new Set(map.waterCols||[]);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const isPath=pset.has(c+','+r);
    const isBlk=blocked.has(c+','+r);
    const p=g2w(c,r);
    const hit=new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({transparent:true,opacity:0}));
    hit.rotation.x=-Math.PI/2;
    hit.position.set(p.x, isPath?0.03:0.02, p.z);
    hit.userData={c,r,path:isPath,blocked:isBlk,unit:null,noMerge:true};
    R.stage.add(hit); B.tiles.push(hit);
    /* boğaz sütunlarında (köprülerin geçtiği yer dahil) yol karosu basılmaz —
       oradaki tek görsel gerçek köprü modeli + altındaki su olsun */
    if(isPath && !overWaterCol.has(c)){
      const road=buildRoadPiece(pathCells,c,r,pal,pset);
      if(road){ road.position.set(p.x,-0.02,p.z); R.stage.add(road); }
    }
  }

  /* eski prosedürel bordür taşları kaldırıldı — artık Path_Straight modelinin kendi
     taş kenarları var, üstüne ek bir şey koymaya gerek yok */

  /* shelter at path end — şehrin simgesi bizzat üs binası.
     ÖNEMLİ: konum birleşim listesinden değil, gerçek bir ROTANIN sonundan alınır;
     birleşim listesi rotaların eklenme sırasına göre bambaşka bir karede biter. */
  const mainRoute = routeCells[0];
  const last=mainRoute[mainRoute.length-1], lw=g2w(last.c,last.r);
  const preLast = mainRoute[mainRoute.length-2] || last;
  /* Bakış yönü ana patikanın son adımından alınır — ızgarayla hizalı (90°'nin katı)
     olduğu için yapı patikaya düz bakar. Çapraz/açıortay denendi, hizasız durduğu
     için vazgeçildi. */
  const enterDir=(function(){
    const f=new THREE.Vector3().subVectors(lw, g2w(preLast.c,preLast.r));
    if(f.lengthSq()<0.0001) return new THREE.Vector3(0,0,1);
    /* en yakın eksene yasla, kırıntı sapmalar kalmasın */
    if(Math.abs(f.x)>=Math.abs(f.z)) f.set(Math.sign(f.x),0,0);
    else                             f.set(0,0,Math.sign(f.z));
    return f;
  })();

  const shGroup=new THREE.Group();
  shGroup.position.set(lw.x,0,lw.z);
  /* küçük bir sancak — "burası savunulan üs" göstergesi, simgenin hemen önünde */
  const flag=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.9,6), mat(0x4a463c,0.8));
  flag.position.set(0.32,0.45,0.32); shGroup.add(flag);
  const cloth=new THREE.Mesh(new THREE.PlaneGeometry(0.32,0.2), new THREE.MeshStandardMaterial({color:PAL.straw,roughness:0.9,side:THREE.DoubleSide}));
  cloth.position.set(0.48,0.72,0.32); shGroup.add(cloth);
  shGroup.userData.noMerge=true;
  R.stage.add(shGroup);
  B.shelterMesh=shGroup;

  /* şehrin simgesi = savunulan üs binası.
     Hazır 3D model varsa (LANDMARK_MODELS) kalkan karesine oturtulur; yoksa eski
     prosedürel çizime düşülür. Model kendi merkezinde olmadığı için bir taşıyıcı
     gruba alınıp içeride kaydırılıyor — böylece döndürme gerçek merkez etrafında
     oluyor (doğrudan position vermek, dönüşte modeli savururdu). */
  const lmCfg = LANDMARK_MODELS[map.landmark];
  const lmModel = lmCfg ? cloneModel(lmCfg.model) : null;
  if(lmModel){
    const s = lmCfg.targetH / lmCfg.nativeH;
    lmModel.position.set(lmCfg.offX, lmCfg.offY, lmCfg.offZ);
    const holder=new THREE.Group();
    holder.add(lmModel);
    holder.scale.setScalar(s);
    /* patikanın bitişinden biraz dışarı taşır — yolu tamamen gömmesin */
    const outward=(lmCfg.outward!==undefined)?lmCfg.outward:0.55;
    holder.position.set(lw.x + enterDir.x*outward, 0, lw.z + enterDir.z*outward);
    holder.rotation.y = Math.atan2(-enterDir.x, -enterDir.z);
    lmModel.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    holder.userData.noMerge=true;
    R.stage.add(holder);
    const lmShadow=new THREE.Mesh(new THREE.CircleGeometry(1.05*s,22),
      new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.22,depthWrite:false}));
    lmShadow.rotation.x=-Math.PI/2;
    lmShadow.position.set(holder.position.x, 0.003, holder.position.z);
    R.stage.add(lmShadow);
    holder.updateMatrixWorld(true);
    registerLandmarkFootprint(holder);
  } else {
    /* prosedürel simge: üsse yakın dursun, çapraz yönde haritanın dışına savrulmasın */
    const lg=buildLandmark(map, lw, enterDir, {offset:1.0, jitter:0, scale:0.72});
    if(lg){ lg.updateMatrixWorld(true); registerLandmarkFootprint(lg); }
  }
  /* Atmosferik ufuk dekoru — üs binasından bağımsız, harita bazında opsiyonel.
     Şu an sadece Mexico City'nin yanardağı kullanıyor. */
  if(map.bg==='volkan') buildVolcanoBackdrop(lw, enterDir);

  /* spawn gate(ler) — her farklı rota başlangıcına bir karadelik.
     Delhi gibi iki geçitli haritalarda birden fazla olur. */
  const gateSeen=new Set(); B.gates=[];
  routeCells.forEach(cells=>{
    const f=cells[0];
    const key=f.c+','+f.r;
    if(gateSeen.has(key)) return;
    gateSeen.add(key);
    const gw=g2w(f.c,f.r);
    const gt=buildBlackHole();
    gt.position.set(gw.x,0.62,gw.z);
    gt.userData.noMerge=true;
    R.stage.add(gt); B.gates.push(gt);
    /* her geçidin arkasına istila cephesi */
    const nx=cells[1]||f;
    const bk=new THREE.Vector3().subVectors(gw, g2w(nx.c,nx.r)).normalize();
    if(bk.lengthSq()<0.01) bk.set(0,0,1);
    buildInvasionFront(gw, bk);
  });
  B.gate=B.gates[0];   /* geriye dönük uyumluluk (animasyon ve parlama) */

  const first=mainRoute[0], second=mainRoute[1]||first, fw=g2w(first.c,first.r);
  const sw=g2w(second.c,second.r);
  const back=new THREE.Vector3().subVectors(fw,sw).normalize();
  if(back.lengthSq()<0.01) back.set(0,0,1);

  buildProps(map, pset);
  /* buildSkyline() artık çağrılmıyor: siluetler 25-33 birimdeydi, kamera açısı
     kısıtlandığı için o mesafe hiçbir zaman görünmüyor. Yerini kuşağın dış
     kenarındaki gökdelen duvarı aldı. */

  /* sahne kurulumu bitti — statik dekoru birleştirip çizim çağrısını düşür */
  const ms=mergeStaticScene();
  if(ms) console.log(`sahne birleştirildi: ${ms.before} mesh -> ${ms.after} (${ms.buckets} grup, ${ms.skipped} korunan)`);
}

/* hücre bazlı su — örn. İstanbul boğazı. Her hücre için mavi taban + hafif parıltılı
   üst katman konur (buildRiver'daki shimmer mantığıyla aynı, animasyon B.waterFx üzerinden
   ortak döngüde ilerler). Bu hücreler tile döngüsünde ayrıca blocked sayılır. */
/* Gerçek boğaz: tek parça dalgalı Ocean yüzeyi (map.waterCols aralığını, tüm ROWS
   boyunca kaplar) + map.bridgeRows'taki her satırda o aralığı enlemesine geçen
   Small Bridge modeli. Ocean niteliksel olarak kare bir okyanus meshi olduğu için
   üç eksende ayrı ölçekleniyor (bkz. STRAIT_MODELS yorumu). */
function buildStrait(map, pal){
  if(!R || !R.stage) return;
  const cols=map.waterCols, midCol=(cols[0]+cols[1])/2;
  const cx = g2w(midCol,0).x;              /* boğazın X merkezi (satırdan bağımsız) */
  const oc=STRAIT_MODELS.ocean;
  const oceanModel=cloneModel(oc.model);
  if(oceanModel){
    const targetSpanX = (Math.abs(cols[1]-cols[0])+1.2)*T;   /* su sütunları + az taşma */
    /* Z ekseninde sadece savaş ızgarasını değil, zemin/dekor kuşağının kapladığı
       tüm alanı kaplasın — böylece boğaz haritanın dışına, kamera görüş sınırına
       kadar akıyormuş gibi görünür (gndSize ile aynı mantık, buildStage'teki). */
    const decorR=(R&&R.decorOuter)||18;
    const panHalf=Math.max((COLS-1)/2,(ROWS-1)/2)+0.85;
    const targetSpanZ = Math.ceil((decorR+panHalf)*2.3);
    const sX=targetSpanX/oc.nativeSpanX, sZ=targetSpanZ/oc.nativeSpanZ, sY=oc.waveAmp/oc.nativeSpanY;
    oceanModel.position.set(oc.offX,oc.offY,oc.offZ);
    const holder=new THREE.Group();
    holder.add(oceanModel);
    holder.scale.set(sX,sY,sZ);
    holder.position.set(cx,-0.05,0);
    holder.userData.noMerge=true;
    oceanModel.traverse(o=>{ if(o.isMesh){ o.receiveShadow=true; o.castShadow=false; } });
    R.stage.add(holder);
  } else if(map.water){
    buildWaterCells(map.water, pal);   /* güvenlik ağı: model yoksa düz karo suya düş */
  }

  const br=STRAIT_MODELS.bridge;
  (map.bridgeRows||[]).forEach(r=>{
    const bModel=cloneModel(br.model);
    if(!bModel) return;
    const s=br.targetH/br.nativeH;
    bModel.position.set(br.offX,br.offY,br.offZ);
    const holder=new THREE.Group();
    holder.add(bModel);
    holder.scale.setScalar(s);
    holder.position.set(cx,0,g2w(0,r).z);
    holder.rotation.y=br.rotationY||0;
    bModel.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    holder.userData.noMerge=true;
    R.stage.add(holder);
  });
}

function buildWaterCells(cells, pal){
  if(!cells || !cells.length || !R || !R.stage) return;
  const group=new THREE.Group();
  const color = pal.water || PAL.water;
  const colorHi = pal.waterHi || PAL.waterHi;
  const geo=new THREE.PlaneGeometry(T*1.02,T*1.02);
  const baseMat=new THREE.MeshStandardMaterial({color,roughness:0.28,metalness:0.22});
  for(const cell of cells){
    const c=cell[0], r=cell[1];
    const p=g2w(c,r);
    const base=new THREE.Mesh(geo, baseMat);
    base.rotation.x=-Math.PI/2;
    base.position.set(p.x,-0.055,p.z);
    group.add(base);
    const shineMat=new THREE.MeshStandardMaterial({color:colorHi,roughness:0.18,transparent:true,opacity:0.4});
    const shine=new THREE.Mesh(geo, shineMat);
    shine.rotation.x=-Math.PI/2;
    shine.position.set(p.x,-0.05,p.z);
    shine.userData.noMerge=true;
    group.add(shine);
    if(B) B.waterFx.push({mat:shineMat, base:0.4, phase:rnd(0,6.28), speed:rnd(0.6,1.1)});
  }
  R.stage.add(group);
}

function buildRiver(pal, mode){
  const bank=new THREE.Group();
  if(B) B.waterFx=[];
  const color = pal ? pal.water : PAL.water;
  const colorHi = pal ? pal.waterHi : PAL.waterHi;
  const curve = mode==='strait'
    ? [[-2,-34],[-1.4,-14],[0,0],[1.2,16],[2,34]]   /* runs roughly north-south, splitting the map */
    : [[-32,-6],[-14,-3],[2,2],[18,6],[34,10]];
  for(let i=0;i<curve.length-1;i++){
    const a=curve[i], b=curve[i+1];
    const dx=b[0]-a[0], dz=b[1]-a[1];
    const len=Math.hypot(dx,dz);
    const width = mode==='strait' ? 2.6 : 3.4;
    const seg=new THREE.Mesh(new THREE.PlaneGeometry(len+0.6,width), new THREE.MeshStandardMaterial({color,roughness:0.3,metalness:0.2}));
    seg.rotation.x=-Math.PI/2;
    seg.rotation.z=-Math.atan2(dz,dx);
    seg.position.set((a[0]+b[0])/2, -0.07, (a[1]+b[1])/2);
    bank.add(seg);
    /* a few parallel shimmer strips, each animated at a different phase */
    for(let s=0;s<3;s++){
      const off=(s-1)*width*0.28;
      const shineMat=new THREE.MeshStandardMaterial({color:colorHi,roughness:0.2,transparent:true,opacity:0.4});
      const shine=new THREE.Mesh(new THREE.PlaneGeometry(len+0.6,width*0.12), shineMat);
      shine.rotation.copy(seg.rotation);
      shine.position.set(seg.position.x - Math.sin(seg.rotation.z)*off, -0.065, seg.position.z - Math.cos(seg.rotation.z)*off);
      shine.userData.noMerge=true;   /* opaklığı her karede değişiyor */
      bank.add(shine);
      if(B) B.waterFx.push({mat:shineMat, base:0.4, phase:rnd(0,6.28), speed:rnd(0.6,1.1)});
    }
    /* pale foam along both banks */
    for(const side of [-1,1]){
      const foam=new THREE.Mesh(new THREE.PlaneGeometry(len+0.6,0.12), new THREE.MeshStandardMaterial({color:0xdff2f0,roughness:0.4,transparent:true,opacity:0.35}));
      foam.rotation.copy(seg.rotation);
      const fo=side*width*0.48;
      foam.position.set(seg.position.x - Math.sin(seg.rotation.z)*fo, -0.062, seg.position.z - Math.cos(seg.rotation.z)*fo);
      bank.add(foam);
    }
  }
  if(mode==='strait'){
    /* the bridge deck crossing the strait at the centre */
    const deck=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.1,1.0), mat(0x6a6156,0.85));
    deck.position.set(0,0.05,0); deck.castShadow=true; deck.receiveShadow=true;
    bank.add(deck);
    for(const side of [-1,1]){
      const pylon=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,1.6,8), mat(0x4a463c,0.7));
      pylon.position.set(side*1.1,0.8,0); pylon.castShadow=true; bank.add(pylon);
      const cableGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(side*1.1,1.5,0),new THREE.Vector3(0,0.1,0)]);
      bank.add(new THREE.Line(cableGeo,new THREE.LineBasicMaterial({color:0x4a463c})));
      const cableGeo2=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(side*1.1,1.5,0),new THREE.Vector3(side*2.2,0.1,0)]);
      bank.add(new THREE.Line(cableGeo2,new THREE.LineBasicMaterial({color:0x4a463c})));
    }
  }
  R.stage.add(bank);
}

/* ---------------- SIGNATURE LANDMARKS ---------------- */
function strut(a,b,r,material){
  const dir=new THREE.Vector3().subVectors(b,a);
  const len=dir.length();
  if(len<0.0001) return new THREE.Object3D();
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,5), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  mesh.castShadow=true;
  return mesh;
}

/* Builds a proper four-legged lattice tower with curved profile, ring braces,
   X cross-bracing on every face, observation decks and an antenna. */
function latticeTower(o){
  const g=new THREE.Group();
  const m=mat(o.color,0.5,0.35);
  const accent=mat(o.accent||o.color,0.55,0.2);
  const levels=o.levels, prof=[];
  for(let i=0;i<=levels;i++){
    const t=i/levels;
    prof.push({ y:t*o.height, w:o.topW+(o.baseW-o.topW)*Math.pow(1-t,o.curve) });
  }
  const corners=w=>[[-w,-w],[w,-w],[w,w],[-w,w]];
  for(let i=0;i<levels;i++){
    const a=prof[i], b=prof[i+1];
    const ca=corners(a.w), cb=corners(b.w);
    const r=0.055*(1-i/levels)+0.016;
    for(let k=0;k<4;k++){
      g.add(strut(new THREE.Vector3(ca[k][0],a.y,ca[k][1]), new THREE.Vector3(cb[k][0],b.y,cb[k][1]), r, m));
    }
    for(let k=0;k<4;k++){
      const k2=(k+1)%4;
      g.add(strut(new THREE.Vector3(cb[k][0],b.y,cb[k][1]), new THREE.Vector3(cb[k2][0],b.y,cb[k2][1]), r*0.55, m));
      g.add(strut(new THREE.Vector3(ca[k][0],a.y,ca[k][1]), new THREE.Vector3(cb[k2][0],b.y,cb[k2][1]), r*0.35, m));
      g.add(strut(new THREE.Vector3(ca[k2][0],a.y,ca[k2][1]), new THREE.Vector3(cb[k][0],b.y,cb[k][1]), r*0.35, m));
    }
  }
  (o.decks||[]).forEach(t=>{
    const p=prof[Math.min(Math.round(t*levels),levels)];
    const deck=new THREE.Mesh(new THREE.BoxGeometry(p.w*2.9,0.09,p.w*2.9), accent);
    deck.position.y=p.y; deck.castShadow=true; g.add(deck);
    const rail=new THREE.Mesh(new THREE.BoxGeometry(p.w*2.95,0.11,p.w*2.95), new THREE.MeshStandardMaterial({color:o.accent||o.color,roughness:0.6,transparent:true,opacity:0.4}));
    rail.position.y=p.y+0.1; g.add(rail);
  });
  if(o.arches){
    for(let k=0;k<4;k++){
      const arch=new THREE.Mesh(new THREE.TorusGeometry(o.baseW*0.92,0.045,6,14,Math.PI), m);
      arch.position.set(0,o.height*0.16,0);
      arch.rotation.y=k*Math.PI/2;
      arch.position.x=Math.sin(k*Math.PI/2)*o.baseW;
      arch.position.z=Math.cos(k*Math.PI/2)*o.baseW;
      g.add(arch);
    }
  }
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.03,o.height*0.22,5), m);
  ant.position.y=o.height+o.height*0.11; g.add(ant);
  const beacon=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,8),
    new THREE.MeshStandardMaterial({color:0xff5a4a,emissive:0xff3a26,emissiveIntensity:1.6}));
  beacon.position.y=o.height+o.height*0.22; g.add(beacon);
  return g;
}

/* Ufukta duran yanardağ — üs binası DEĞİL, sadece atmosferik arka plan.
   Eskiden 'volkan' bir landmark tipiydi ve üs karesine oturması gerekirken kendi
   pozisyonunu 15 birim uzağa taşıyordu — bu da üs karesini boş bırakıyordu
   (kullanıcı geri bildirimi: "base binamız eksik"). Artık ayrı, bağımsız bir
   çağrı: map.bg==='volkan' olan haritalarda üs binasından BAĞIMSIZ olarak
   her zaman çizilir. */
function buildVolcanoBackdrop(nearPos, dir){
  const g=new THREE.Group();
  const rock=mat(0x4A3F36,0.96), rockHi=mat(0x5C5046,0.95);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(2.8,2.6,22,3), rock);
  cone.position.y=1.3; g.add(cone);
  const ridge=new THREE.Mesh(new THREE.ConeGeometry(2.82,2.6,22,3,true,0,Math.PI*0.7), rockHi);
  ridge.position.y=1.3; g.add(ridge);
  const snow=new THREE.Mesh(new THREE.ConeGeometry(1.0,0.55,22), mat(0xE8E4DA,0.9));
  snow.position.y=2.3; g.add(snow);
  const crater=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.35,0.3,18), mat(0x241C16,0.95));
  crater.position.y=2.55; g.add(crater);
  const lava=new THREE.Mesh(new THREE.CircleGeometry(0.5,18),
    new THREE.MeshStandardMaterial({color:0xFF6A2C,emissive:0xFF4A10,emissiveIntensity:1.5}));
  lava.rotation.x=-Math.PI/2; lava.position.y=2.7; g.add(lava);
  for(let i=0;i<5;i++){
    const puff=new THREE.Mesh(new THREE.SphereGeometry(rnd(0.35,0.7),8,8),
      new THREE.MeshStandardMaterial({color:0x3A322C,transparent:true,opacity:rnd(0.2,0.4),roughness:1,depthWrite:false}));
    puff.position.set(rnd(-0.5,0.5),2.9+i*0.55,rnd(-0.5,0.5));
    g.add(puff);
  }
  for(let i=0;i<4;i++){
    const a=rnd(0,6.28);
    const streak=new THREE.Mesh(new THREE.BoxGeometry(0.07,1.4,0.05),
      new THREE.MeshStandardMaterial({color:0xFF7A3D,emissive:0xFF4A10,emissiveIntensity:1.1}));
    streak.position.set(Math.sin(a)*1.1,1.6,Math.cos(a)*1.1);
    streak.rotation.z=Math.sin(a)*0.42; streak.rotation.x=-Math.cos(a)*0.42;
    g.add(streak);
  }
  g.position.set(nearPos.x+dir.x*15, 0, nearPos.z+dir.z*15);
  g.scale.setScalar(2.6);
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  R.stage.add(g);
  return g;
}

function buildLandmark(map, nearPos, dir, opts){
  const type=map.landmark;
  if(!type) return null;
  const g=new THREE.Group();
  const offset=(opts&&opts.offset!==undefined)?opts.offset:2.9;
  const jitter=(opts&&opts.jitter!==undefined)?opts.jitter:0.25;
  const px=nearPos.x+dir.x*offset+rnd(-jitter,jitter);
  const pz=nearPos.z+dir.z*offset+rnd(-jitter,jitter);

  if(type==='piramit'){
    const sand=mat(0xE2B778,0.9), sandDark=mat(0x9E6B3C,0.92);
    const mk=(s,h,x,z)=>{
      const base=new THREE.Mesh(new THREE.BoxGeometry(s*2.1,0.08,s*2.1), sandDark);
      base.position.set(x,0.04,z); base.receiveShadow=true; g.add(base);
      const p=new THREE.Mesh(new THREE.ConeGeometry(s,h,4), sand);
      p.rotation.y=Math.PI/4; p.position.set(x,h/2+0.08,z); p.castShadow=true; g.add(p);
      const shade=new THREE.Mesh(new THREE.ConeGeometry(s*0.999,h,4,1,false,0,Math.PI), sandDark);
      shade.rotation.y=Math.PI/4+Math.PI*0.75; shade.position.set(x,h/2+0.08,z); g.add(shade);
      const cap=new THREE.Mesh(new THREE.ConeGeometry(s*0.18,h*0.18,4), mat(0xF2E0A8,0.6,0.25));
      cap.rotation.y=Math.PI/4; cap.position.set(x,h*0.94,z); g.add(cap);
    };
    mk(1.5,1.9,0,0); mk(1.0,1.3,2.7,1.3); mk(0.62,0.8,4.3,2.5);
    /* sphinx-like guardian block */
    const body=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.34,0.44), sandDark);
    body.position.set(-1.9,0.17,1.5); body.castShadow=true; g.add(body);
    const head=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.36,0.32), sand);
    head.position.set(-1.44,0.5,1.5); head.castShadow=true; g.add(head);
    /* obelisks */
    for(const ox of [-2.6,-3.2]){
      const ob=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.09,1.2,4), sand);
      ob.position.set(ox,0.6,-0.9); ob.castShadow=true; g.add(ob);
      const tip=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.2,4), mat(0xF2E0A8,0.6,0.25));
      tip.position.set(ox,1.3,-0.9); g.add(tip);
    }
  }

  else if(type==='kemer'){
    const stone=mat(0xB5502E,0.85), stoneHi=mat(0xC9663F,0.85), trim=mat(0xE8D9B0,0.8);
    /* main gatehouse wall */
    for(const sx of [-1,1]){
      const pier=new THREE.Mesh(new THREE.BoxGeometry(0.55,2.1,0.6), stone);
      pier.position.set(sx*0.95,1.05,0); pier.castShadow=true; g.add(pier);
    }
    const lintel=new THREE.Mesh(new THREE.BoxGeometry(2.45,0.5,0.62), stone);
    lintel.position.y=2.35; lintel.castShadow=true; g.add(lintel);
    /* the arch opening */
    const arch=new THREE.Mesh(new THREE.TorusGeometry(0.68,0.13,8,18,Math.PI), stoneHi);
    arch.position.y=2.05; g.add(arch);
    const archIn=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.4,0.4), mat(0x2A1A12,0.95));
    archIn.position.y=0.7; g.add(archIn);
    /* crenellations */
    for(let i=-4;i<=4;i++){
      const cren=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.22,0.62), trim);
      cren.position.set(i*0.26,2.71,0); g.add(cren);
    }
    /* corner towers with domes */
    for(const sx of [-1,1]){
      const tw=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.32,2.4,12), stoneHi);
      tw.position.set(sx*1.5,1.2,0); tw.castShadow=true; g.add(tw);
      const balc=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.1,12), trim);
      balc.position.set(sx*1.5,2.42,0); g.add(balc);
      const dome=new THREE.Mesh(new THREE.SphereGeometry(0.3,14,10,0,Math.PI*2,0,Math.PI/2), mat(0xE8C158,0.5,0.3));
      dome.position.set(sx*1.5,2.47,0); dome.castShadow=true; g.add(dome);
      const fin=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.24,6), mat(0xE8C158,0.5,0.3));
      fin.position.set(sx*1.5,2.86,0); g.add(fin);
    }
  }

  else if(type==='eyfel'){
    g.add(latticeTower({ height:4.4, baseW:0.82, topW:0.045, levels:13, curve:2.3,
                         color:0x6B5B4A, accent:0x8A7A64, decks:[0.26,0.55,0.82], arches:true }));
  }

  else if(type==='kule'){
    g.add(latticeTower({ height:4.0, baseW:0.68, topW:0.04, levels:11, curve:1.9,
                         color:0xD8452F, accent:0xF2EDE2, decks:[0.34,0.62] }));
  }

  else if(type==='bigben'){
    const stone=mat(0xB8A276,0.9), stoneHi=mat(0xCDB98C,0.88), roof=mat(0x4A5A48,0.8);
    const base=new THREE.Mesh(new THREE.BoxGeometry(0.95,2.5,0.95), stone);
    base.position.y=1.25; base.castShadow=true; g.add(base);
    /* vertical pilasters for gothic texture */
    for(const [ax,az] of [[1,0],[-1,0],[0,1],[0,-1]]) for(const off of [-0.28,0,0.28]){
      const pil=new THREE.Mesh(new THREE.BoxGeometry(ax?0.07:0.14,2.4,az?0.07:0.14), stoneHi);
      pil.position.set(ax*0.49+(ax?0:off), 1.25, az*0.49+(az?0:off));
      g.add(pil);
    }
    /* clock stage */
    const stage=new THREE.Mesh(new THREE.BoxGeometry(1.06,0.85,1.06), stoneHi);
    stage.position.y=2.9; stage.castShadow=true; g.add(stage);
    for(let k=0;k<4;k++){
      const a=k*Math.PI/2;
      const faceG=new THREE.Group();
      const disc=new THREE.Mesh(new THREE.CircleGeometry(0.3,20),
        new THREE.MeshStandardMaterial({color:0xF6E9BF,emissive:0xE8C158,emissiveIntensity:0.75,roughness:0.4}));
      faceG.add(disc);
      const ring=new THREE.Mesh(new THREE.TorusGeometry(0.31,0.035,6,20), mat(0x8A7442,0.55,0.4));
      faceG.add(ring);
      const hh=new THREE.Mesh(new THREE.BoxGeometry(0.025,0.16,0.01), mat(0x2A2418,0.6));
      hh.position.set(0,0.07,0.012); faceG.add(hh);
      const mh=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.24,0.01), mat(0x2A2418,0.6));
      mh.position.set(0.07,-0.05,0.012); mh.rotation.z=1.1; faceG.add(mh);
      faceG.position.set(Math.sin(a)*0.535,2.9,Math.cos(a)*0.535);
      faceG.rotation.y=a;
      g.add(faceG);
    }
    /* parapet + steeple */
    const par=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.14,1.2), stone);
    par.position.y=3.4; g.add(par);
    for(const sx of [-1,1]) for(const sz of [-1,1]){
      const pin=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.38,4), roof);
      pin.position.set(sx*0.52,3.62,sz*0.52); g.add(pin);
    }
    const spire=new THREE.Mesh(new THREE.ConeGeometry(0.62,1.5,4), roof);
    spire.rotation.y=Math.PI/4; spire.position.y=4.2; spire.castShadow=true; g.add(spire);
    const fin=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.4,6), mat(0xE8C158,0.5,0.35));
    fin.position.y=5.1; g.add(fin);
  }

  else if(type==='melek'){
    /* Bağımsızlık Meleği (Angel de la Independencia) — yüksek, yivli mermer
       sütun üstünde altın kanatlı bir zafer meleği. Mexico City'nin en tanınan
       simgesi; üs binası olarak şehir simgesi karesine oturur (eskiden burada
       ufka kaçan bir yanardağ vardı, üs karesi boş kalıyordu — bkz.
       buildVolcanoBackdrop, yanardağ artık ondan bağımsız çiziliyor). */

/* ---- ÇEVRE SOKAKLARI ----
   Savaş alanı dışına, ızgaraya hizalı sokak ağı döşer. Binalar sonradan bu hücrelere
   denk gelmeyecek şekilde yerleştirilir, böylece sokaklar açık kalır. */
/* verilen "hangi yönlerde komşu var" bilgisine göre doğru yol parçasını ve
   dönüşünü bulan ortak çözücü — hem çevre sokakları hem savaş halkası kullanır */
const STREET_DIR_IDX={'-X':0,'+X':1,'-Z':2,'+Z':3};
function rotateStreetDir(d,q){
  const order=['-X','-Z','+X','+Z'];   /* rotY +90°: -X -> -Z -> +X -> +Z */
  return order[(order.indexOf(d)+q)%4];
}
function streetOpenOf(set,name){
  if(name===set.straight) return set.straightDir==='X'?['-X','+X']:['-Z','+Z'];
  if(name===set.bend) return set.bendDirs.slice();
  if(name===set.tee) return ['-X','+X','-Z','+Z'].filter(d=>d!==set.teeMissing);
  if(name===set.end) return [set.endDir||'+X'];
  return ['-X','+X','-Z','+Z'];
}
function resolveStreetPiece(set, need){
  const sameSet=(a,b)=>a.length===b.length && a.every(v=>b.indexOf(v)>=0);
  if(need.length>=4) return {name:set.cross, rotQ:0};
  /* tek komşulu hücre = çıkmaz uç. Düz parça kullanılırsa yol havada kesiliyormuş
     gibi duruyordu; road_end kapaklı uç parçası bunu düzgün kapatıyor.
     (Şehir simgesi halka yolu kestiğinde bu durum oluşuyor — Londra'da Big Ben
     çevresindeki bozukluğun sebebi buydu.) */
  if(need.length===1 && set.end){
    const base=streetOpenOf(set,set.end);
    for(let q=0;q<4;q++){
      if(rotateStreetDir(base[0],q)===need[0]) return {name:set.end, rotQ:q};
    }
  }
  const cand = need.length===3 ? [set.tee] : (need.length===2 ? [set.straight,set.bend] : [set.straight]);
  for(const c of cand){
    const base=streetOpenOf(set,c);
    for(let q=0;q<4;q++){
      const rotated=base.map(d=>rotateStreetDir(d,q));
      if(need.length<=1 ? rotated.indexOf(need[0]||'-X')>=0 : sameSet(rotated,need)){
        return {name:c, rotQ:q};
      }
    }
  }
  return {name:set.straight, rotQ:0};
}

/* NOT: buildOutskirtStreets() fonksiyonu buradan tamamen kaldırıldı — rastgele,
   bağlantısız sokak parçaları üretiyordu ve haritada anlamsız duruyordu.
   O bölge artık buildProps() içindeki AĞAÇ HALKASI'na ait. */
/* Savaş ızgarasını 1 kare boşlukla saran kapalı ÇİT çemberi.
   ÖNCEDEN: burada Kenney Modular Road Kit ile bir halka YOL kuruluyordu. Kit'in tek
   düz parçası (road_straightBarrier) bariyerlerini yolun eni boyunca taşıdığı için
   her karoda yolu kesen duvarlar oluşuyordu ve hiçbir dönüş/hizalama ayarı bunu
   düzeltmedi. Kullanıcı isteğiyle yol tamamen kaldırıldı, yerine Quaternius çit
   paneli kondu (fence-panel).
   Geometri: çit dikdörtgeninin köşeleri (±(COLS+1)/2, ±(ROWS+1)/2) noktalarında.
   Kenar uzunlukları tam sayı olduğu için her kenara birim uzunlukta panel tam
   oturuyor, köşelerde uçlar birbirine değiyor — boşluk/bindirme kalmıyor. */
function buildBattleRing(map){
  const occupied = new Set();

  /* dekorun çit hattına girmemesi için halka karelerini işaretle (yol döneminde de
     bu set aynı işi görüyordu) */
  const ringCells=[];
  for(let c=-1;c<=COLS;c++){ ringCells.push([c,-1]); ringCells.push([c,ROWS]); }
  for(let r=0;r<ROWS;r++){ ringCells.push([-1,r]); ringCells.push([COLS,r]); }
  ringCells.forEach(([c,r])=>{
    const wx=(c-(COLS-1)/2)*T, wz=(r-(ROWS-1)/2)*T;
    occupied.add(Math.round(wx)+','+Math.round(wz));
  });

  if(!MODEL_CACHE['fence-panel']) return occupied;

  /* şehir simgesinin oturduğu yerde çit kesilir — anıtın içinden çit geçmesin */
  const lb=B && B.landmarkBox;
  const blockedAt=(wx,wz)=>{
    if(!lb) return false;
    const m=T*0.42;
    return lb.min.x < wx+m && lb.max.x > wx-m && lb.min.z < wz+m && lb.max.z > wz-m;
  };

  const S=T/FENCE_LEN;                 /* bir panel tam bir karo boyu olsun */
  const halfX=(COLS+1)/2*T, halfZ=(ROWS+1)/2*T;

  /* Tek paylaşılan materyal: hem statik geometri birleştirmesi çalışsın hem de
     modelin kendi ayarı düzeltilsin. GLB'de metallic=0.4 geliyor; sahnede ortam
     haritası (envMap) olmadığı için metalik yüzey kapkara okunuyordu. */
  if(!R.fenceMat){
    R.fenceMat=new THREE.MeshStandardMaterial({color:0x3c4250,roughness:0.78,metalness:0.0});
  }

  const place=(wx,wz,rotY)=>{
    if(blockedAt(wx,wz)) return;
    const o=cloneModel('fence-panel');
    if(!o) return;
    o.scale.setScalar(S);
    o.position.set(wx,0,wz);
    o.rotation.y=rotY;
    /* çit ızgaranın dışında; gerçek gölge düşürürse yerleştirme kareleri kararıyor */
    o.traverse(m=>{ if(m.isMesh){ m.material=R.fenceMat; m.castShadow=false; m.receiveShadow=true; } });
    R.stage.add(o);
  };

  /* üst ve alt kenar — panel doğal olarak X boyunca uzanıyor, dönüş gerekmiyor */
  for(let i=0;i<COLS+1;i++){
    const wx=-halfX+(i+0.5)*T;
    place(wx,-halfZ,0);
    place(wx, halfZ,0);
  }
  /* sol ve sağ kenar — 90° döndürülüp Z boyunca dizilir */
  for(let i=0;i<ROWS+1;i++){
    const wz=-halfZ+(i+0.5)*T;
    place(-halfX,wz,Math.PI/2);
    place( halfX,wz,Math.PI/2);
  }

  return occupied;
}

function buildProps(map, pset){
  const kind=map.props;
  const theme = ENV_THEME[kind] || ENV_THEME.suburb;
  /* keep the whole placement plaza clear — decoration only lives past this buffer */
  const plazaX=(COLS-1)/2*T + 0.85, plazaZ=(ROWS-1)/2*T + 0.85;
  /* halka yarıçapları ızgara boyutuna göre kayar; 12x9'da eski değerlerle aynı çıkar */
  /* Dekor artık sonsuza uzanmıyor: kamera açısı 50°'nin altına inemediği için
     görüş ~15-19 birimde bitiyor, dekor da tam orada bitiyor. Eski uzak halka
     (18-34) ve ufuk siluetleri tamamen kaldırıldı — hiçbiri görünmüyordu. */
  const R1=Math.max(9.8, Math.hypot(plazaX,plazaZ)*1.22);   /* yakın çevre dış sınırı */
  /* R2 eskiden doğrudan decorOuter'a (kamera görüş sınırı, performans için 20'de
     sabit) eşitti. Büyük/geniş haritalarda (New York gibi) R1 bu sınırı geçince
     orta bina şeridi (TREE_OUTER..RWALL) kağıt inceliğinde kalıyor, 210 binanın
     çoğu yerleşemeden iptal oluyordu — boş alan buradan geliyordu. R2 artık R1'e
     göre de garanti bir pay bırakıyor; kamera zaten görebildiği kadarını gösterir,
     nesne SAYISI sabit olduğu için performans etkilenmiyor, sadece daha geniş bir
     alana düzgün yayılıyor. */
  const R2=Math.max((R && R.decorOuter) ? R.decorOuter : R1+7, R1+7);
  const RWALL=R2-2.2;                                        /* gökdelen duvarının başladığı yer */
  /* önce sokaklar döşenir; dönen hücreler bina/ağaç yerleşiminde boş bırakılır */
  const ringCells = buildBattleRing(map);
  /* NOT: burada eskiden rastgele, bağlantısız sokak parçaları döşeyen
     buildOutskirtStreets() çağrılıyordu. Kullanıcı geri bildirimiyle kaldırıldı —
     yönü/bağlantısı olmayan sokak parçaları havada kalmış gibi, mantıksız
     duruyordu. O alan artık AĞAÇ HALKASI'na ait; boş bırakılan hücreler
     doğrudan ağaç/çalı yerleşimiyle doluyor. */
  const streetCells = new Set();
  ringCells.forEach(k=>streetCells.add(k));
  const onStreet=(x,z)=>{
    if(!streetCells.size) return false;
    const cx=Math.round(x), cz=Math.round(z);
    /* noktanın bulunduğu karo sokaksa engelle */
    if(streetCells.has(cx+','+cz)) return true;
    /* komşu karo sokaksa, sadece kaldırıma taşan dar bir şerit engellensin */
    for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++){
      if(dx===0&&dz===0) continue;
      if(!streetCells.has((cx+dx)+','+(cz+dz))) continue;
      if(Math.abs(x-(cx+dx))<0.62 && Math.abs(z-(cz+dz))<0.62) return true;
    }
    return false;
  };
  /* Dekorun asla girmeyeceği iç alan artık ÇİT dikdörtgenine göre tanımlı.
     Eskiden burada dairesel bir yarıçap (plaza) kullanılıyordu; çit dikdörtgen
     olduğu için kısa kenarlarda (üst/alt) çitle ağaçlar arasında 4-7 birimlik
     boş bir bant kalıyordu (kullanıcı geri bildirimi). Dikdörtgen sınır bu boşluğu
     tamamen kapatır. */
  const FENCE_HX=(COLS+1)/2*T, FENCE_HZ=(ROWS+1)/2*T;
  const KEEP_X=FENCE_HX+0.85, KEEP_Z=FENCE_HZ+0.85;
  const insideKeep=(x,z)=>Math.abs(x)<KEEP_X && Math.abs(z)<KEEP_Z;

  const outskirt=(maxR)=>{
    let x,z,tries=0;
    do{ x=rnd(-maxR,maxR); z=rnd(-maxR,maxR); tries++; }
    while((insideKeep(x,z) || onStreet(x,z)) && tries<40);
    return [x,z];
  };
  /* Belirli bir halka aralığında nokta üret. rMin=0 verilirse çitin hemen
     dışından başlayan dolu bir "çerçeve" oluşur — dikdörtgen çit ile dairesel
     dış sınır arasındaki tüm alan eşit yoğunlukta dolar. */
  const ringPoint=(rMin,rMax)=>{
    for(let t=0;t<60;t++){
      const a=Math.random()*Math.PI*2;
      const d=Math.sqrt(rnd(rMin*rMin, rMax*rMax));
      const x=Math.cos(a)*d, z=Math.sin(a)*d;
      if(insideKeep(x,z)) continue;
      if(onStreet(x,z)) continue;
      return [x,z];
    }
    return null;
  };

  /* tek paylaşılan materyal — yüzlerce gölge dairesi tek çizim çağrısında birleşsin
     (her birine ayrı materyal verilirse birleştirme çalışmaz) */
  /* NOT: burası eskiden her dekor nesnesinin altına yumuşak bir gölge dairesi
     çiziyordu. Açık yeşil zeminde bu daireler nesneden bağımsız gri lekeler gibi
     okunuyordu ("karaltı" geri bildirimi). Tamamen kapatıldı — fonksiyon duruyor
     ki çağıran onlarca satırı tek tek silmeye gerek kalmasın. */
  const dropShadow=(x,z,r)=>{};
  const dropShadowUnused=(x,z,r)=>{
    const m=new THREE.Mesh(new THREE.CircleGeometry(r,12), SHADOW_MAT);
    m.rotation.x=-Math.PI/2; m.position.set(x,0.001,z);
    R.stage.add(m);
  };

  /* gerçek Kenney modeli yerleştirici — uzaktakiler gölge atmaz (performans) */
  /* Çevre dekorasyonu artık gerçek gölge DÜŞÜRMÜYOR.
     Sebep: savaş alanı kenarındaki binalar/ağaçlar ızgaranın üzerine uzun gölgeler
     atıp yerleştirme karelerinin bir kısmını karartıyordu; oyuncu hangi karenin
     seçilebilir olduğunu okuyamıyordu. Nesneler yere basmış görünsün diye
     altlarına yumuşak gölge dairesi konuyor. Kuleler, düşmanlar ve şehir simgesi
     gerçek gölge düşürmeye devam ediyor. */
  const noCast=(o)=>{ o.traverse(m=>{ if(m.isMesh){ m.castShadow=false; } }); return o; };
  const placeModel=(name,x,z,opts)=>{
    opts=opts||{};
    const o=cloneModel(name);
    if(!o) return null;
    const s=opts.scale!==undefined?opts.scale:1;
    o.scale.setScalar(s);
    o.position.set(x, opts.y||0, z);
    o.rotation.y = opts.rotY!==undefined?opts.rotY:rnd(0,Math.PI*2);
    const far = Math.hypot(x,z) > 11;
    noCast(o);
    if(far) o.traverse(m=>{ if(m.isMesh){ m.receiveShadow=false; } });
    R.stage.add(o);
    if(opts.shadow && !far) dropShadow(x,z,opts.shadow*s);
    return o;
  };
  const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];

  const addRubble=(x,z)=>{
    dropShadow(x,z,0.28);
    const g=new THREE.Group();
    for(let i=0;i<3;i++){
      const s=rnd(0.1,0.22);
      const m=new THREE.Mesh(new THREE.BoxGeometry(s,s*0.7,s), mat(PAL.concrete,0.98));
      m.position.set(rnd(-0.25,0.25), s*0.35, rnd(-0.25,0.25));
      m.rotation.set(rnd(0,1),rnd(0,3),rnd(0,1));
      m.castShadow=false; g.add(m);

    g.position.set(x,0,z); R.stage.add(g);
  };
  const addWreck=(x,z)=>{

    const body=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.2,0.34), mat(PAL.rust,0.95));
    body.position.y=0.14; body.castShadow=false; g.add(body);
    const cab=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.16,0.3), mat(0x4a463c,0.95));
    cab.position.set(-0.04,0.3,0); cab.castShadow=false; g.add(cab);
    g.position.set(x,0,z); g.rotation.y=rnd(0,6);
    R.stage.add(g);
  };
  /* --- ağaç / çalı / kaya: artık gerçek Nature Kit modelleri --- */
  const addTree=(x,z)=>{

      tr.position.y=0.42; g.add(tr);
      const b=new THREE.Mesh(new THREE.SphereGeometry(0.36,9,8), mat(PAL.leaf,0.88));
      b.position.y=0.95; g.add(b);

  const addBush=(x,z)=>{

  const addRock=(x,z)=>{

  const addFence=(x,z)=>{

  const addStatue=(x,z)=>{

  const addLamp=(x,z)=>{

    p.position.y=0.75; p.castShadow=false; g.add(p);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.04,0.05), mat(0x413d36,0.85));
    arm.position.set(0.15,1.48,0); g.add(arm);

  const addContainer=(x,z)=>{

      const m=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.42,0.5), mat(col,0.95));
      m.position.set(x, 0.21+i*0.44, z); m.rotation.y=rnd(-0.15,0.15);

  const addBarrier=(x,z)=>{

  const addPillar=(x,z)=>{

  const addStall=(x,z)=>{
    const pick=PARASOL_NAMES[Math.floor(Math.random()*PARASOL_NAMES.length)];
    const p=cloneModel(pick);
    if(p){

      p.position.set(x,0,z);
      p.rotation.y=rnd(0,6);
      R.stage.add(p);
      dropShadow(x,z,0.3*s);
      return;
    }
    const g=new THREE.Group();
    const col=[0xB5502E,0xC79A63,0x4a8f7a,0xE8C158][Math.floor(Math.random()*4)];
    const roof=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.05,0.5), mat(col,0.8));
    roof.position.y=0.62; g.add(roof);
    for(const sx of [-0.24,0.24]) for(const sz of [-0.2,0.2]){
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.6,5), mat(0x4a3a26,0.9));
      leg.position.set(sx,0.3,sz); g.add(leg);
    }
    const table=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.1,0.35), mat(0x8a7050,0.9));
    table.position.y=0.32; g.add(table);
    g.position.set(x,0,z); g.rotation.y=rnd(0,6); R.stage.add(g);
  };
  const BUILD_PALETTE=[0xE3D4B0,0xC9B896,0xB9A67E,0xD8C4A0,0xA8B0A0,0xC2AF8E];
  /* çevre binası — gerçek Kenney modeli; yüklenmemişse basit kutuya düşer */
  const addAwning=(x,z)=>{
    const pick=BUILDING_NAMES[Math.floor(Math.random()*BUILDING_NAMES.length)];
    const b=cloneModel(pick);
    if(b){
      const s=rnd(0.5,0.78);
      b.scale.setScalar(s);
      b.position.set(x,0,z);

      return;

    const g=new THREE.Group();
    const bodyCol=BUILD_PALETTE[Math.floor(Math.random()*BUILD_PALETTE.length)];
    const w=rnd(0.55,0.75), d=rnd(0.5,0.65), h=rnd(0.85,1.5);
    const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(bodyCol,0.85));
    body.position.y=h/2; body.receiveShadow=true; g.add(body);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.08,0.07,d+0.08), mat(0x5a5348,0.8));
    roof.position.y=h+0.035; g.add(roof);
    g.position.set(x,0,z); g.rotation.y=Math.round(rnd(0,3))*(Math.PI/2);
    R.stage.add(g);
    dropShadow(x,z,Math.max(w,d)*0.7);
  };
  const addBench=(x,z)=>{
    const g=new THREE.Group();
    const seat=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.05,0.16), mat(0x5a4a34,0.9));
    seat.position.y=0.22; g.add(seat);
    const back=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.2,0.03), mat(0x5a4a34,0.9));
    back.position.set(0,0.34,-0.07); g.add(back);
    g.position.set(x,0,z); g.rotation.y=rnd(0,6); R.stage.add(g);
  };
  const addSign=(x,z)=>{
    const g=new THREE.Group();
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.9,5), mat(0x2a2a2a,0.7));

    const panel=new THREE.Mesh(new THREE.PlaneGeometry(0.4,0.22), new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.9,side:THREE.DoubleSide}));
    panel.position.y=0.85; panel.rotation.y=rnd(0,6); g.add(panel);

  const addFireHydrant=(x,z)=>{
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,0.28,8), mat(0xB5502E,0.6));
    body.position.y=0.14; g.add(body);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8), mat(0xB5502E,0.6));
    cap.position.y=0.3; g.add(cap);
    g.position.set(x,0,z); R.stage.add(g);
  };
  const addCanalPost=(x,z)=>{
    const g=new THREE.Group();
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,0.5,6), mat(0x5a4a34,0.9));
    post.position.y=0.25; g.add(post);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8), new THREE.MeshStandardMaterial({color:0xffe6a3,emissive:0xffcf6b,emissiveIntensity:0.6}));
    lamp.position.y=0.54; g.add(lamp);
    g.position.set(x,0,z); R.stage.add(g);
  };

  const addSandbags=(x,z)=>{
    const g=new THREE.Group();
    const rows=Math.floor(rnd(3,6));
    for(let i=0;i<rows;i++){
      const bag=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,0.16,7), mat(0x8a7a52,0.95));
      bag.rotation.z=Math.PI/2;
      bag.position.set((i-rows/2)*0.15+rnd(-0.02,0.02),0.07,rnd(-0.02,0.02));
      bag.castShadow=false; g.add(bag);
    }
    for(let i=0;i<rows-1;i++){
      const bag=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,0.16,7), mat(0x7a6a46,0.95));
      bag.rotation.z=Math.PI/2;
      bag.position.set((i-rows/2)*0.15+0.075,0.16,rnd(-0.02,0.02));
      bag.castShadow=false; g.add(bag);

    g.position.set(x,0,z); g.rotation.y=rnd(0,6); R.stage.add(g);

  const addBarbedWire=(x,z)=>{
    const g=new THREE.Group();
    const postMat=mat(0x3a3630,0.7);
    const p1=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.025,0.32,5), postMat);
    p1.position.set(-0.32,0.16,0); g.add(p1);
    const p2=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.025,0.32,5), postMat);
    p2.position.set(0.32,0.16,0); g.add(p2);
    for(const y of [0.1,0.2,0.28]){

      const geo=new THREE.BufferGeometry().setFromPoints(pts);

  const addCrate=(x,z)=>{
    const g=new THREE.Group();
    const s=rnd(0.22,0.34);
    const crate=new THREE.Mesh(new THREE.BoxGeometry(s,s*0.85,s), mat(0x7a5a38,0.9));
    crate.position.y=s*0.42; crate.castShadow=false; g.add(crate);
    const strapMat=mat(0x4a3826,0.85);
    for(const rot of [0,Math.PI/2]){

    }
    if(Math.random()<0.5){
      const crate2=new THREE.Mesh(new THREE.BoxGeometry(s*0.8,s*0.7,s*0.8), mat(0x8a6a44,0.9));
      crate2.position.set(rnd(-0.1,0.1), s*0.85+s*0.35*0.7, rnd(-0.1,0.1));

  const addScorchMark=(x,z)=>{
    const r=rnd(0.35,0.7);
    const m=new THREE.Mesh(new THREE.CircleGeometry(r,12), new THREE.MeshBasicMaterial({color:0x1a1510,transparent:true,opacity:rnd(0.28,0.45),depthWrite:false}));
    m.rotation.x=-Math.PI/2; m.rotation.z=rnd(0,6); m.position.set(x,0.004,z);
    R.stage.add(m);
    for(let i=0;i<3;i++){

      cr.position.set(x+rnd(-r*0.5,r*0.5),0.03,z+rnd(-r*0.5,r*0.5));

  };
  const addGrassTuft=(x,z)=>{
    if(placeModel(Math.random()<0.5?'grass':'grass_large',x,z,{scale:rnd(0.7,1.2)})) return;
    const g=new THREE.Group();

      blade.position.set(rnd(-0.08,0.08),h/2,rnd(-0.08,0.08));

    g.position.set(x,0,z); R.stage.add(g);
  };
  const addPebbleCluster=(x,z)=>{
    if(placeModel(Math.random()<0.5?'rock_smallA':'rock_smallC',x,z,{scale:rnd(0.5,0.9)})) return;
    const g=new THREE.Group();
    const n=Math.floor(rnd(2,4));
    for(let i=0;i<n;i++){
      const s=rnd(0.03,0.07);
      const peb=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0), mat(0x8a8375,0.95));
      peb.position.set(rnd(-0.1,0.1),s*0.5,rnd(-0.1,0.1));

      g.add(peb);

    g.position.set(x,0,z); R.stage.add(g);
  };

  const sets = {
    suburb:    [addTree,addBush,addTree,addLamp,addBush,addTree,addRock,addWreck],
    industrial:[addTree,addContainer,addBush,addTree,addBarrier,addRock,addTree,addRubble],
    highway:   [addTree,addBush,addBarrier,addTree,addRock,addBush,addTree,addWreck],
    oldtown:   [addTree,addPillar,addBush,addTree,addRock,addBush,addTree,addRubble],
    desert:    [addRock,addPalm,addRubble,addAwning,addStall,addPalm,addRock,addPillar],
    southasia: [addStall,addAwning,addBush,addStall,addAwning,addLamp,addBush,addRubble],
    parisian:  [addTree,addAwning,addBench,addLamp,addTree,addAwning,addBush,addTree],
    london:    [addAwning,addLamp,addBench,addTree,addAwning,addBush,addLamp,addTree],
    plaza:     [addAwning,addBench,addRock,addStall,addPillar,addAwning,addBush,addStall],
    skyscraper:[addAwning,addContainer,addBarrier,addSign,addFireHydrant,addAwning,addRock,addContainer],
    tropical:  [addPalm,addBush,addCanalPost,addPalm,addAwning,addStall,addBush,addPalm],
    strait:    [addTree,addAwning,addBench,addLamp,addRock,addTree,addBush,addLamp],
    neon:      [addAwning,addSign,addLamp,addFireHydrant,addAwning,addSign,addBarrier,addLamp],
    metro:     [addAwning,addFireHydrant,addBench,addContainer,addBarrier,addAwning,addSign,addBench],
  };
  const cycle = sets[kind]||sets.suburb;
  /* ağaç halkasında bina modeli (addAwning) çıkmasın — aynı yuvaya ağaç konur,
     çeşitlilik/yoğunluk aynı kalır, sadece "önce ağaç" kuralı bozulmaz */
  const cycleNoBuild = cycle.map(fn=>fn===addAwning?addTree:fn);

  /* ---- Çitin hemen dışından başlayan AĞAÇ HALKASI ----
     Sadece ağaç/çalı/kaya + hafif sokak detayı (lamba, bank, çit, heykel).
     Bina yok — "önce ağaçlar" kuralı burada.
     TREE_INNER=0: iç sınırı artık yarıçap değil, insideKeep() dikdörtgeni
     belirliyor. Böylece çitle ağaçlar arasında kenar boyunca boşluk kalmıyor. */
  const TREE_INNER = 0;
  /* dış sınır: çitin uzun kenarından ~3.6 birim ötesi. Bina halkasına ve duvara
     yer kalsın diye RWALL'a göre ayrıca sınırlanır. */
  let TREE_OUTER = Math.min(KEEP_X+3.6, RWALL-1.2);
  if(TREE_OUTER < KEEP_X+1.0) TREE_OUTER = KEEP_X+1.0;

  const nearCount = kind==='highway' ? 150 : 190;
  for(let i=0;i<nearCount;i++){
    const p=ringPoint(TREE_INNER,TREE_OUTER); if(!p) continue;
    cycleNoBuild[i%cycleNoBuild.length](p[0],p[1]);
  }
  const nearTrees=Math.round(300*theme.treeDensity);
  for(let i=0;i<nearTrees;i++){
    const p=ringPoint(TREE_INNER,TREE_OUTER); if(!p) continue;
    (Math.random()<0.8?addTree:addBush)(p[0],p[1]);
  }
  for(let i=0;i<150;i++){
    const p=ringPoint(TREE_INNER,TREE_OUTER); if(!p) continue;
    (Math.random()<0.5?addBush:addRock)(p[0],p[1]);
  }
  if(theme.fences){
    for(let i=0;i<18;i++){ const p=ringPoint(0,KEEP_X+0.8); if(p) addFence(p[0],p[1]); }
  }
  if(theme.statues){
    for(let i=0;i<6;i++){ const p=ringPoint(0,KEEP_X+1.2); if(p) addStatue(p[0],p[1]); }
  }
  /* ağaç halkasına serpiştirilmiş sokak lambaları */
  for(let i=0;i<20;i++){
    const p=ringPoint(TREE_INNER,TREE_OUTER); if(p) addLamp(p[0],p[1]);
  }

  /* ---- Ağaç halkasının dışından görüş sınırına kadar BİNA HALKASI ----
     Sadece bina/gökdelen — "sonra binalar" kuralı burada. Dışa doğru
     yoğunluk artıp DUVAR bandında (RWALL..R2) en yüksek/en sık hâle gelir. */
  const midBuild=Math.round(210*theme.buildDensity);
  for(let i=0;i<midBuild;i++){
    const p=ringPoint(TREE_OUTER,RWALL); if(!p) continue;
    const name=pick(Math.random()<0.3?SKYSCRAPER_NAMES:BUILDING_NAMES);
    placeModel(name,p[0],p[1],{scale:rnd(0.8,1.55),rotY:Math.round(rnd(0,3))*(Math.PI/2)});
  }
  for(let i=0;i<24;i++){
    const p=ringPoint(TREE_OUTER+0.5,RWALL-0.4); if(p) addLamp(p[0],p[1]);
  }

  /* ---- DUVAR: kuşağın dış kenarında yüksek gökdelen çemberi ----
     Görüşün bittiği yeri kapatır; arkasında boş zemin görünmesin diye
     sık ve yüksek dizilir. Sis de tam burada kapanıyor. */
  const wallCount=Math.round(46*Math.max(0.8,theme.buildDensity));
  for(let i=0;i<wallCount;i++){
    const a=(i/wallCount)*Math.PI*2 + rnd(-0.05,0.05);
    const d=RWALL+rnd(0.2,2.0);
    const x=Math.cos(a)*d, z=Math.sin(a)*d;
    const name=pick(Math.random()<0.6?SKYSCRAPER_NAMES:BUILDING_NAMES);
    const nativeH=BUILDING_HEIGHT[name]||2;
    const o=cloneModel(name);
    if(!o) continue;
    const targetH=rnd(4.5,9.5);
    const foot=rnd(1.1,2.0);
    o.scale.set(foot, targetH/nativeH, foot*rnd(0.8,1.2));
    o.position.set(x,0,z);
    o.rotation.y=a+Math.PI/2+rnd(-0.15,0.15);
    o.traverse(m=>{ if(m.isMesh){ m.castShadow=false; m.receiveShadow=false; } });
    R.stage.add(o);
  }
  /* duvarın önüne birkaç ağaç kümesi (yumuşatma) — asıl ağaçlar artık iç halkada */
  const wallTrees=Math.round(14*theme.treeDensity);
  for(let i=0;i<wallTrees;i++){
    const a=Math.random()*Math.PI*2;
    const d=RWALL+rnd(-0.6,1.0);
    const t=cloneModel(pick(theme.trees));
    if(!t) continue;
    t.scale.setScalar(rnd(1.4,2.4));
    t.position.set(Math.cos(a)*d,0,Math.sin(a)*d);
    t.rotation.y=rnd(0,Math.PI*2);
    t.traverse(m=>{ if(m.isMesh){ m.castShadow=false; m.receiveShadow=false; } });
    R.stage.add(t);
  }

  /* ---- zemin dolgusu: çim/taş/savaş izleri ----
     NOT: addScorchMark (koyu daire + üstünde 3 çakıl) bu setten çıkarıldı —
     haritanın her yerinde tekrar eden koyu "karaltı" lekeleri oluşturuyordu
     (kullanıcı geri bildirimi). */
  const lush=['suburb','highway','parisian','london','tropical','strait','oldtown'].includes(kind);
  const warKit=[addSandbags,addBarbedWire,addCrate];
  for(let i=0;i<240;i++){
    const [x,z]=outskirt(R1+1.7);
    const roll=Math.random();
    if(lush && roll<0.45) addGrassTuft(x,z);
    else if(roll<0.65) addPebbleCluster(x,z);
    else if(roll<0.85) warKit[Math.floor(Math.random()*warKit.length)](x,z);
  }
  for(let i=0;i<150;i++){
    const p=ringPoint(R1+1.7,RWALL); if(!p) continue;
    (Math.random()<0.55&&lush ? addGrassTuft : addPebbleCluster)(p[0],p[1]);
  }
}

const SKYLINE_MATS={};
function buildSkyline(backDir){
  const g=new THREE.Group();
  const invAngle = backDir ? Math.atan2(backDir.x,backDir.z) : null;
  const allNames=[...BUILDING_NAMES, ...SKYSCRAPER_NAMES];
  for(let i=0;i<46;i++){
    const a=(i/46)*Math.PI*2 + rnd(-0.05,0.05);
    const d=rnd(25,33);
    const targetH=rnd(2.6,8.5);
    const name = allNames.length ? allNames[Math.floor(Math.random()*allNames.length)] : null;
    let angDiff = invAngle!==null ? Math.abs(((a-invAngle+Math.PI)%(Math.PI*2))-Math.PI) : Math.PI;
    const inFront = angDiff < 0.9;
    if(name && MODEL_CACHE[name]){
      const b=cloneModel(name);
      const nativeH=BUILDING_HEIGHT[name]||2.2;
      const footScale=rnd(0.55,1.0);
      b.scale.set(footScale, targetH/nativeH, footScale);
      b.position.set(Math.sin(a)*d, -0.1, Math.cos(a)*d);
      b.rotation.y=a+rnd(-0.4,0.4);
      /* önde kalan binaları karartıp siluet hissi ver, geride kalanlar mesafeye göre soluklaşsın */
      const tint = inFront ? 0x2a2620 : (d>17 ? 0xaab0c0 : 0xffffff);
      /* renk tonunu birkaç kovaya yuvarla ve materyali paylaş — her mesh'e ayrı
         materyal klonlanırsa birleştirme çalışmaz, 46 ayrı çizim çağrısı kalır */
      b.traverse(o=>{
        if(o.isMesh){
          const key=o.material.uuid+'_'+tint;
          let mm=SKYLINE_MATS[key];
          if(!mm){
            mm=o.material.clone();
            mm.color = new THREE.Color(tint).multiply(o.material.color);
            if(inFront){ mm.emissive=new THREE.Color(0x000000); }
            SKYLINE_MATS[key]=mm;
          }
          o.material=mm;
          /* ufuk siluetleri gölge düşürmez — hem gereksiz hem savaş alanını karartır */
          o.castShadow=false; o.receiveShadow=false;
        }
      });
      g.add(b);
      if(inFront && Math.random()<0.5){
        const smoke=new THREE.Mesh(new THREE.SphereGeometry(rnd(0.8,1.6),7,7),
          new THREE.MeshStandardMaterial({color:PAL.smoke,transparent:true,opacity:rnd(0.15,0.3),roughness:1,depthWrite:false}));
        smoke.position.set(b.position.x+rnd(-0.5,0.5), targetH+rnd(0.8,2.2), b.position.z+rnd(-0.5,0.5));
        g.add(smoke);
      }
    } else {
      /* GLB henüz yüklenmediyse eski kutu-siluet yöntemine düş */
      const w=rnd(1.2,3.0);
      const col = inFront ? 0x231f1c : (d>17 ? PAL.buildingFar : PAL.building);
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,targetH,w*rnd(0.7,1.2)), mat(col,0.99));
      m.position.set(Math.sin(a)*d, targetH/2-0.1, Math.cos(a)*d);
      m.rotation.y=a+rnd(-0.4,0.4);
      g.add(m);
    }
  }
  R.stage.add(g);
}

/* ---------------- Abbadon elit birimler (detaylı modeller) ---------------- */
const ABDX_RAW={ shadow:0x3A3836, dark:0x6E6A66, mid:0x8C8884, light:0xB9B4AE, accent:0xD8D2C8 };
const ABDX_MATCACHE={};
function ABDX_mat(c){ if(!ABDX_MATCACHE[c]) ABDX_MATCACHE[c]=new THREE.MeshStandardMaterial({color:c,roughness:0.85,metalness:0.05}); return ABDX_MATCACHE[c]; }
function ABDX_put(parent,geo,col,pos,rot,scl){
  const o=new THREE.Mesh(geo,ABDX_mat(col));
  if(pos) o.position.set(pos[0],pos[1],pos[2]);
  if(rot) o.rotation.set(rot[0],rot[1],rot[2]);
  if(scl) Array.isArray(scl)?o.scale.set(scl[0],scl[1],scl[2]):o.scale.setScalar(scl);
  o.castShadow=true; o.receiveShadow=true;
  parent.add(o); return o;
}
const ABDX_SPH=(r,a,b)=>new THREE.SphereGeometry(r,a||14,b||12);
const ABDX_CYL=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||9);
const ABDX_BOX=(a,b,c)=>new THREE.BoxGeometry(a,b,c);
const ABDX_CON=(r,h,s)=>new THREE.ConeGeometry(r,h,s||8);

/* ---------- 1. PİYADE ---------- */
function makeBiped(){
  const g=new THREE.Group();
  for(const s of [-1,1]){
    ABDX_put(g,ABDX_CYL(0.13,0.1,0.75),ABDX_RAW.shadow,[s*0.18,0.4,0]);
    ABDX_put(g,ABDX_BOX(0.2,0.12,0.34),ABDX_RAW.shadow,[s*0.18,0.06,0.06]);
  }
  ABDX_put(g,ABDX_CYL(0.3,0.36,0.72,10),ABDX_RAW.dark,[0,1.12,0]);
  ABDX_put(g,ABDX_BOX(0.44,0.4,0.16),ABDX_RAW.mid,[0,1.2,0.28]);
  ABDX_put(g,ABDX_SPH(0.11),ABDX_RAW.accent,[0,1.2,0.36]);
  for(const s of [-1,1]){
    ABDX_put(g,ABDX_SPH(0.2),ABDX_RAW.mid,[s*0.38,1.42,0]);
    ABDX_put(g,ABDX_CYL(0.09,0.07,0.66),ABDX_RAW.shadow,[s*0.44,1.05,0],[0,0,s*0.16]);
    ABDX_put(g,ABDX_CON(0.09,0.3,7),ABDX_RAW.light,[s*0.5,0.64,0],[Math.PI,0,0]);
  }
  ABDX_put(g,ABDX_CYL(0.1,0.12,0.16),ABDX_RAW.shadow,[0,1.56,0]);
  ABDX_put(g,ABDX_SPH(0.24),ABDX_RAW.dark,[0,1.78,0],null,[0.95,1.1,1]);
  ABDX_put(g,ABDX_BOX(0.34,0.09,0.1),ABDX_RAW.accent,[0,1.8,0.2]);
  /* NOT: bu iki diken eskiden [s*0.16,2.02,-0.02]'deydi ve kafa küresinin
     (merkez [0,1.78,0], yarıçap 0.24, ölçek 0.95/1.1/1) YÜZEYİNİN ALTINA
     gömülüyordu — ölçünce diken tabanının küre yüzeyinden %21 içeride kaldığı
     çıktı. İki yüzey neredeyse çakışınca üstten bakışta titrek/çizgili bir
     bozulma (z-fighting) oluşuyordu; kullanıcı geri bildirimindeki "kafadaki
     görüntü bozukluğu" buydu. Konum kürenin dışına, güvenli payla taşındı. */
  for(const s of [-1,1]) ABDX_put(g,ABDX_CON(0.06,0.42,7),ABDX_RAW.shadow,[s*0.24,2.03,-0.02],[0,0,s*0.34]);
  return g;
}

/* ---------- 2. KUŞATMA YÜRÜTÜCÜSÜ ---------- */
function makeWalker(){
  const g=new THREE.Group();
  ABDX_put(g,ABDX_SPH(0.5,16),ABDX_RAW.dark,[0,1.15,0],null,[1.35,0.8,1.05]);
  ABDX_put(g,ABDX_BOX(0.9,0.16,0.3),ABDX_RAW.mid,[0,1.48,0]);
  ABDX_put(g,ABDX_SPH(0.17),ABDX_RAW.accent,[0.58,1.2,0]);
  ABDX_put(g,ABDX_CYL(0.1,0.13,0.8,10),ABDX_RAW.shadow,[0.5,1.46,0.22],[0,0,-Math.PI/2]);
  ABDX_put(g,ABDX_SPH(0.1),ABDX_RAW.accent,[0.92,1.46,0.22]);
  [0.7,2.1,4.2,5.6].forEach(a=>{
    const x=Math.cos(a)*0.5, z=Math.sin(a)*0.42;
    ABDX_put(g,ABDX_CYL(0.07,0.055,0.66,7),ABDX_RAW.shadow,[x*1.5,1.1,z*1.5],[Math.sign(z)*0.35,0,-Math.sign(x)*0.55]);

}

/* ---------- 3. GERGEDAN SÜVARİSİ ---------- */

  ABDX_put(r,ABDX_BOX(0.26,0.22,0.1),ABDX_RAW.mid,[0,0.4,0.16]);

  for(const s of [-1,1]) ABDX_put(r,ABDX_SPH(0.11),ABDX_RAW.mid,[s*0.21,0.5,0]);

  ABDX_put(r,ABDX_BOX(0.2,0.055,0.07),ABDX_RAW.accent,[0,0.69,0.12]);

}

/* ---------- 4. EZİCİ (minotor) ---------- */
function makeMinotaur(){
  const g=new THREE.Group();
  /* bacaklar — kısa, kalın, dışa açık */
  for(const s of [-1,1]){
    ABDX_put(g,ABDX_SPH(0.26,14,12),ABDX_RAW.dark,[s*0.3,0.62,0],null,[1.0,1.35,1.0]);      /* uyluk kası */
    ABDX_put(g,ABDX_CYL(0.2,0.16,0.55,10),ABDX_RAW.shadow,[s*0.32,0.3,0.02]);
    ABDX_put(g,ABDX_SPH(0.19,12,10),ABDX_RAW.dark,[s*0.32,0.36,-0.06],null,[0.9,0.8,0.9]);  /* baldır */
    ABDX_put(g,ABDX_BOX(0.34,0.14,0.5),ABDX_RAW.shadow,[s*0.32,0.07,0.06]);
    for(let t=0;t<3;t++) ABDX_put(g,ABDX_CON(0.05,0.13,5),ABDX_RAW.light,[s*0.32+(t-1)*0.1,0.05,0.3],[-1.5,0,0]);
  }
  /* leğen + gövde: öne eğik, üst gövde çok geniş */
  ABDX_put(g,ABDX_SPH(0.34,14,12),ABDX_RAW.dark,[0,0.95,0],null,[1.25,0.85,1.0]);
  ABDX_put(g,ABDX_SPH(0.52,16,14),ABDX_RAW.dark,[0,1.5,0.06],null,[1.4,1.15,0.95]);         /* göğüs kafesi */
  for(const s of [-1,1]) ABDX_put(g,ABDX_SPH(0.28,12,10),ABDX_RAW.mid,[s*0.3,1.62,0.4],null,[1.0,0.85,0.6]); /* pektoral */
  /* karın plakaları */

/* hafif boyama — sahne aydınlatmasına ek ışık/kabuk katmadan (performans için) */
function applyAbbadonPaintLite(root, scale){
  root.traverse(o=>{
    if(!o.isMesh) return;
    const src=o.material;
    const lum = src&&src.color ? (src.color.r*0.3+src.color.g*0.59+src.color.b*0.11) : 0.5;
    let mm;
    if(lum>0.72)      mm=new THREE.MeshStandardMaterial({color:0xD9B6FF,emissive:PAL.abdGlow,emissiveIntensity:1.6,roughness:0.3,metalness:0.1});
    else if(lum>0.62) mm=new THREE.MeshStandardMaterial({color:0x3A3146,roughness:0.55,metalness:0.4});
    else if(lum>0.45) mm=new THREE.MeshStandardMaterial({color:0x2C2636,roughness:0.68,metalness:0.28});
    else if(lum>0.25) mm=new THREE.MeshStandardMaterial({color:0x2C2636,roughness:0.75,metalness:0.2});
    else              mm=new THREE.MeshStandardMaterial({color:0x1E1B26,roughness:0.85,metalness:0.14});
    /* kendi üstüne gölge alma kapalı — bkz. applySkeletonPaint'teki açıklama:
       gölge haritası texel'i bu boyuttaki karakterler için çok kaba olduğundan
       yuvarlak yüzeylerde titrek gölge aknesi oluşuyordu. */
    o.material=mm; o.castShadow=true; o.receiveShadow=false;
  });
  if(scale) root.scale.setScalar(scale);
  return root;
}

/* Abbadon sınıfı — sadece bizim tasarladığımız 7 karakter. Şimdilik başka hiçbir düşman
   (zihin kontrolündeki kurt/kartal/ayı, akıncı, ağır piyade vb.) dalgalarda kullanılmıyor. */
const ABBADON_CLASS = ['piyade','kule','gergedan','ezici','kahin','tank','komutan'];

/* ---------------- unit / enemy models ---------------- */
function buildEnemyMesh(def){
  const g=new THREE.Group();
  const dark=mat(0x232026,0.85), glow=new THREE.MeshStandardMaterial({color:PAL.abdGlow,emissive:PAL.abd,emissiveIntensity:1.3,roughness:0.4});
  const s=def.size;

  /* öncelik: animasyonlu iskelet karakteri */
  const cc=ENEMY_CHARS[def.key];
  if(cc && CHAR_CACHE[cc.char]){
    const model=cloneSkinned(CHAR_CACHE[cc.char]);
    applySkeletonPaint(model, cc.tint);
    model.scale.setScalar(cc.h / CHAR_REF_H);
    g.add(model);
    /* yürüyüş animasyonu; klip yoksa sessizce statik kalır */
    const clip = ANIM_CLIPS[cc.clip] || ANIM_CLIPS['Walking_A'];
    if(clip){
      const mixer=new THREE.AnimationMixer(model);
      const action=mixer.clipAction(clip);
      action.play();
      g.userData.mixer=mixer;
      g.userData.action=action;
      g.userData.clipDur=clip.duration||1;
    }
    g.userData.skelRoot=model;
