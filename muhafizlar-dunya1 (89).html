<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Evrenin Muhafızları — Dünya I: Kül Mevsimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0E0A22; --bg-1:#1B1140; --bg-2:#2A1558;
  --card:#251A4A; --card-hi:#2E2060; --well:rgba(255,255,255,.07); --edge:rgba(255,255,255,.10);
  --ink:#FFFFFF; --ink-2:#C6BCE8; --ink-3:#8B7FB8;

  --void:#A855F7; --void-2:#D48CFF; --void-wash:rgba(168,85,247,.16); --void-deep:#5B21A6;
  --ember:#FF6A3D; --ember-2:#FFB13D; --ember-wash:rgba(255,106,61,.16); --ember-deep:#C2410C;
  --mint:#2DD4BF; --mint-2:#5EEAD4; --mint-deep:#0F766E;
  --gold:#FFD166; --gold-2:#FFE29A;
  --night:#0A0716; --night-2:#140E2A;
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
body{
  background:var(--night); color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif;
  display:flex; justify-content:center;
  font-size:15px;
}
h1,h2,h3,h4{font-family:'Archivo',system-ui,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:0;}
.num{font-variant-numeric:tabular-nums;}
#app{width:100%;max-width:1100px;height:100vh;height:100dvh;position:relative;overflow:hidden;}

.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.screen.on{display:flex;}

@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.stagger>*{animation:rise .5s cubic-bezier(.2,.7,.3,1) both;}
.stagger>*:nth-child(1){animation-delay:.02s;}
.stagger>*:nth-child(2){animation-delay:.08s;}
.stagger>*:nth-child(3){animation-delay:.14s;}
.stagger>*:nth-child(4){animation-delay:.2s;}
.stagger>*:nth-child(5){animation-delay:.26s;}
.stagger>*:nth-child(6){animation-delay:.32s;}
@media (prefers-reduced-motion:reduce){.stagger>*{animation:none;}}

/* ---------- buttons ---------- */
.btn{
  font-family:'Archivo',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:-.01em;
  color:#fff;background:var(--card-hi);border:1px solid var(--edge);border-radius:var(--r);
  padding:13px 20px;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
  transition:transform .08s,box-shadow .08s,background .15s,opacity .15s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.btn:disabled{opacity:.34;box-shadow:none;cursor:not-allowed;}
.btn.ember{background:linear-gradient(135deg,var(--ember),var(--ember-2));border:none;box-shadow:0 3px 0 var(--ember-deep),0 6px 18px rgba(255,106,61,.35);color:#2B0E00;}
.btn.ember:active{box-shadow:0 1px 0 var(--ember-deep);}
.btn.void{background:linear-gradient(135deg,var(--void),var(--void-2));border:none;box-shadow:0 3px 0 var(--void-deep),0 6px 18px rgba(168,85,247,.35);}
.btn.void:active{box-shadow:0 1px 0 var(--void-deep);}
.btn.quiet{background:var(--well);color:#fff;box-shadow:none;border:1px solid var(--edge);}
.btn.quiet:active{transform:translateY(1px);}
.btn.lg{padding:16px 26px;font-size:15px;border-radius:var(--r-lg);}
.btn.sm{padding:9px 13px;font-size:11.5px;border-radius:var(--r-sm);}
.btn.wide{width:100%;}

/* ---------- story ---------- */
#storyScreen{
  align-items:center;justify-content:center;padding:28px 22px;
  background:
    radial-gradient(70% 45% at 15% -6%, rgba(168,85,247,.55) 0%, transparent 60%),
    radial-gradient(65% 40% at 100% 8%, rgba(255,106,61,.32) 0%, transparent 58%),
    radial-gradient(80% 55% at 85% 108%, rgba(45,212,191,.22) 0%, transparent 60%),
    linear-gradient(180deg,var(--bg-1),var(--night) 70%);
}
.story-wrap{max-width:470px;width:100%;}
.eyebrow{
  font-family:'Archivo',sans-serif;font-weight:700;font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--void-2);
  display:flex;align-items:center;gap:9px;margin-bottom:18px;
}
.eyebrow::before{content:'';width:26px;height:2px;background:var(--void-2);border-radius:2px;}
.story-title{font-size:clamp(28px,7.5vw,40px);color:#fff;font-weight:900;margin-bottom:20px;}
.story-body p{font-size:15px;line-height:1.72;color:rgba(255,255,255,.78);margin:0 0 13px;}
.story-body b{color:var(--ember-2);font-weight:700;}
.story-dim{font-size:13px;color:rgba(255,255,255,.4);font-style:italic;margin:18px 0 24px;}

/* ---------- map screen ---------- */
#mapScreen{
  background:
    radial-gradient(60% 38% at 8% 0%, rgba(168,85,247,.38) 0%, transparent 62%),
    radial-gradient(55% 34% at 100% 0%, rgba(255,177,61,.24) 0%, transparent 60%),
    radial-gradient(70% 46% at 50% 115%, rgba(45,212,191,.18) 0%, transparent 62%),
    linear-gradient(180deg,var(--bg-1) 0%, var(--bg-0) 55%);
  padding:0 0 34px;
}
.mhead{padding:22px 18px 14px;}
.tagrow{display:flex;gap:7px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.chip{
  font-family:'Archivo',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 11px;border-radius:999px;background:var(--well);color:var(--ink-2);border:1px solid var(--edge);
}
.chip.v{background:var(--void-wash);color:var(--void-2);border-color:rgba(168,85,247,.35);}
.chip.e{background:var(--ember-wash);color:var(--ember-2);border-color:rgba(255,106,61,.35);}
.mhead h1{font-size:clamp(26px,7vw,34px);font-weight:900;margin-bottom:14px;color:#fff;}
.progline{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.ptrack{flex:1;height:8px;background:var(--well);border-radius:999px;overflow:hidden;border:1px solid var(--edge);}
.ptrack i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));border-radius:999px;transition:width .5s;box-shadow:0 0 10px rgba(255,177,61,.55);}
.pnum{font-size:12px;font-weight:700;color:var(--ink-2);}
.wallet{display:flex;gap:9px;}
.wchip{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--edge);
  border-radius:999px;padding:8px 15px 8px 11px;font-weight:800;font-size:14px;color:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.25);
}
.ico{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
.ico.coin{background:linear-gradient(140deg,var(--gold-2),var(--gold) 55%,#B5761A);box-shadow:0 0 8px rgba(255,209,102,.55);}
.ico.shard{border-radius:3px;background:linear-gradient(140deg,var(--void-2),var(--void));transform:rotate(45deg);width:13px;height:13px;box-shadow:0 0 8px rgba(168,85,247,.55);}

.seg{display:flex;gap:4px;margin:0 18px 16px;background:var(--well);padding:4px;border-radius:999px;border:1px solid var(--edge);}
.seg button{
  flex:1;border:none;background:transparent;cursor:pointer;padding:11px 8px;border-radius:999px;
  font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;color:var(--ink-2);transition:.18s;
}
.seg button.on{background:linear-gradient(135deg,var(--ember),var(--ember-2));color:#2B0E00;box-shadow:0 4px 14px rgba(255,106,61,.4);}

.pane{padding:0 18px;display:flex;flex-direction:column;gap:11px;}

.card{background:linear-gradient(165deg,var(--card-hi),var(--card));border:1px solid var(--edge);border-radius:var(--r-lg);box-shadow:0 8px 24px rgba(0,0,0,.3);}

.meter{display:flex;gap:3px;margin-bottom:9px;}
.meter i{flex:1;height:5px;border-radius:999px;background:var(--well);max-width:26px;}
.meter i.f{background:linear-gradient(90deg,var(--ember),var(--gold));}
.meter i.f.v{background:linear-gradient(90deg,var(--void),var(--void-2));}
.pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill-t{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:var(--well);color:var(--ink-2);border:1px solid var(--edge);}
.pill-t.v{background:var(--void-wash);color:var(--void-2);border-color:rgba(168,85,247,.35);}
.rank{display:flex;gap:4px;flex-shrink:0;padding-top:4px;}
.rank i{width:9px;height:9px;border-radius:3px;background:var(--well);}
.rank i.on{background:linear-gradient(135deg,var(--gold),var(--ember));box-shadow:0 0 6px rgba(255,177,61,.6);}
.pipbar{display:flex;gap:3px;flex-wrap:wrap;margin:1px 0 2px;}
.pipbar i{width:100%;max-width:14px;flex:1 1 auto;height:7px;min-width:8px;border-radius:2px;background:var(--well);}
.pipbar i.on{background:linear-gradient(135deg,var(--gold),var(--ember));box-shadow:0 0 5px rgba(255,177,61,.55);}
.tiertag{font-size:10.5px;font-weight:700;color:var(--void-2);letter-spacing:.04em;}
.maxtag{font-size:11px;font-weight:800;color:var(--gold);background:rgba(255,177,61,.14);padding:5px 10px;border-radius:999px;align-self:center;letter-spacing:.06em;}

.unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px;}
.unitcard{padding:14px;display:flex;flex-direction:column;gap:9px;}
.unitcard.is-locked{opacity:.46;}
.uhead{display:flex;gap:10px;align-items:center;}
.swatch{width:34px;height:34px;border-radius:11px;flex-shrink:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 12px rgba(0,0,0,.3);}
.swatch.icon,.sw.icon{object-fit:contain;background:rgba(0,0,0,.22);padding:3px;box-sizing:border-box;}
.uhead h4{font-size:14px;line-height:1.15;color:#fff;}
.lvl{font-size:11px;font-weight:700;color:var(--ink-3);}
.unitcard p{font-size:12px;line-height:1.5;color:var(--ink-2);margin:0;flex:1;}
.urow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.statgrp{display:flex;flex-wrap:wrap;gap:3px 10px;}
.stat{font-size:12px;font-weight:800;color:var(--gold-2);}

.endcta{margin:24px 18px 0;}

/* ---------- world select (single planet + stars) ---------- */
#worldScreen{background:#000;padding:0;}
.starfield{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.25;}50%{opacity:1;}}

.cw-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:18px 18px 0;}

.planet-stage{
  position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:20px 8px;min-height:0;
}
.arrow-btn{
  background:transparent;border:none;cursor:pointer;padding:10px;flex-shrink:0;
  opacity:.85;transition:opacity .15s,transform .1s;
}
.arrow-btn:active{transform:scale(.88);opacity:1;}
.arrow-btn svg{width:38px;height:26px;display:block;}
@media(min-width:520px){.arrow-btn svg{width:48px;height:32px;}}

.planet-viewport{
  display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  width:min(72vw,300px);
}
.planet-name{
  font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(22px,6vw,30px);
  color:#fff;letter-spacing:-.02em;text-shadow:0 0 22px rgba(255,255,255,.25);
}
#planetCanvas{width:min(60vw,240px);height:min(60vw,240px);filter:drop-shadow(0 18px 40px rgba(0,0,0,.6));}
.planet-sub{
  font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;
  color:var(--ink-2);background:var(--well);border:1px solid var(--edge);
  padding:8px 16px;border-radius:999px;text-align:center;
}
.planet-sub.locked{color:var(--ink-3);}

/* ---------- arka plan karadeliği (dünya seçim ekranı) ---------- */
.bh-bg{
  position:absolute;pointer-events:none;z-index:1;
  width:min(58vw,260px);height:min(58vw,260px);
  right:-8%;top:6%;opacity:.55;
}
.bh-bg .bh-core{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:34%;height:34%;border-radius:50%;background:#000;
  box-shadow:0 0 0 2px rgba(224,187,255,.75), 0 0 26px 6px rgba(157,95,224,.55);
}
.bh-bg .bh-disk{
  position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;
  background-position:center;mix-blend-mode:screen;
  animation:bhspin linear infinite;
}
@keyframes bhspin{from{transform:rotate(0deg) scaleY(.34);}to{transform:rotate(360deg) scaleY(.34);}}
@keyframes bhspinR{from{transform:rotate(360deg) scaleY(.34);}to{transform:rotate(0deg) scaleY(.34);}}
.world-sprite{
  width:min(60vw,240px);height:min(60vw,240px);object-fit:contain;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.6));display:block;
}

/* ---------- world select (cosmos) ---------- */
#worldScreen{
  background:
    radial-gradient(50% 32% at 20% 8%, rgba(168,85,247,.4) 0%, transparent 60%),
    radial-gradient(46% 30% at 90% 4%, rgba(255,177,61,.24) 0%, transparent 58%),
    radial-gradient(60% 40% at 50% 118%, rgba(45,212,191,.2) 0%, transparent 62%),
    linear-gradient(180deg,var(--bg-1) 0%, var(--bg-0) 55%);
  padding:0 0 34px;
}
.backpill{
  font-family:'Archivo',sans-serif;font-weight:700;font-size:11px;color:var(--ink-2);
  background:var(--well);border:1px solid var(--edge);border-radius:999px;padding:6px 12px;cursor:pointer;
}
.backpill:active{transform:scale(.95);}

/* ---------- city path ---------- */
/* Oyun yatay (landscape) telefonda oynanıyor — bu yüzden şehir hattı aşağı
   değil SAĞA doğru kayıyor. path-wrap kendi içinde yatay scroll container,
   her path-node (rozet+kart) yan yana bir sütun. Dikey "kıvrılma" hissi
   translateY ile korunuyor (eskiden translateX'ti, dikey yığın içindi). */
.path-wrap{
  position:relative; display:flex; flex-direction:row; align-items:flex-start;
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
  margin:0 -18px; padding:52px 18px 14px;
}
.path-connector{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:1;}
.path-node{position:relative;display:flex;flex-direction:column;align-items:center;
  flex:0 0 auto;width:224px;margin-right:14px;scroll-snap-align:center;
  transform:translateY(var(--off));}
.path-node:last-child{margin-right:0;}
.node-badge{
  position:relative;width:58px;height:58px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Archivo',sans-serif;font-weight:900;font-size:19px;color:#fff;
  background:linear-gradient(150deg,var(--card-hi),var(--card));border:1px solid var(--edge);
  box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:2;cursor:pointer;
}
.city-icon{
  position:absolute;left:50%;bottom:2px;width:86px;height:auto;
  transform:translateX(-50%);pointer-events:none;z-index:4;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));
}
.node-status{
  position:absolute;top:-4px;right:-4px;z-index:5;width:22px;height:22px;border-radius:50%;
  background:var(--night-2);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;
  font-size:12px;box-shadow:0 3px 8px rgba(0,0,0,.4);
}
.path-node.is-done .node-badge{background:linear-gradient(150deg,var(--ember),var(--gold));color:#2B0E00;border:none;box-shadow:0 8px 22px rgba(255,177,61,.4);}
.node-badge.is-boss{background:linear-gradient(150deg,var(--void),var(--void-2));border:none;box-shadow:0 8px 22px rgba(168,85,247,.4);}
.path-node.is-locked .node-badge{opacity:.45;cursor:not-allowed;box-shadow:none;}
.node-pulse{
  position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--ember-2);
  animation:pulse-ring 1.8s ease-out infinite;
}
@keyframes pulse-ring{0%{transform:scale(.85);opacity:.9;}100%{transform:scale(1.35);opacity:0;}}
.node-card{
  margin-top:10px;width:206px;padding:13px 14px;border-radius:var(--r-lg);
  background:linear-gradient(165deg,var(--card-hi),var(--card));border:1px solid var(--edge);
  box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer;
}
.path-node.is-locked .node-card{opacity:.4;cursor:not-allowed;}
.node-card h3{font-size:15px;color:#fff;margin-bottom:6px;}
.node-card p{font-size:12.5px;line-height:1.5;color:var(--ink-2);margin:8px 0 10px;}
.node-card .rank{margin-bottom:0;}

/* ---------- Cepheler: eski/yıpranmış harita kağıdı teması (b66) ----------
   Sadece #mapScreen içinde geçerli — geri kalan ekranlar (kartlar, butonlar)
   etkilenmesin diye tüm kurallar #mapScreen ile veya yalnızca bu ekrana özgü
   sınıf adlarıyla (node-*, path-*) sınırlandı. */
#mapScreen{
  --parch-0:#c9b183; --parch-1:#dcc697; --parch-2:#e8d6a8; --parch-3:#f1e3bd;
  --parch-ink:#3a2a17; --parch-ink-2:#6b4d2c; --parch-ink-3:#8a6a42;
  --parch-edge:rgba(58,42,23,.4); --parch-seal:#7a2020; --parch-seal-2:#a83a2a;
  --parch-gold:#96721f; --parch-gold-2:#c79a3f;
  background:linear-gradient(180deg,var(--parch-1) 0%,var(--parch-0) 100%);
}
#mapScreen .mhead h1{
  font-family:'Special Elite',monospace; font-weight:400; letter-spacing:.01em;
  color:var(--parch-ink); text-shadow:0 1px 0 rgba(255,255,255,.25);
}
#mapScreen .backpill{
  background:var(--parch-2); color:var(--parch-ink-2); border:1px solid var(--parch-edge);
  font-family:'Special Elite',monospace; font-weight:400;
}
#mapScreen .chip{
  background:var(--parch-2); color:var(--parch-ink-2); border:1px solid var(--parch-edge);
}
#mapScreen .chip.v{ background:rgba(122,32,32,.14); color:var(--parch-seal-2); border-color:rgba(122,32,32,.35); }
#mapScreen .ptrack{ background:var(--parch-2); border:1px solid var(--parch-edge); }
#mapScreen .ptrack i{ background:linear-gradient(90deg,var(--parch-gold),var(--parch-gold-2)); box-shadow:none; }
#mapScreen .pnum{ color:var(--parch-ink-2); }
#mapScreen .wchip{ background:var(--parch-2); border:1px solid var(--parch-edge); color:var(--parch-ink); }
#mapScreen .seg{ background:var(--parch-1); border:1px solid var(--parch-edge); }
#mapScreen .seg button{ color:var(--parch-ink-2); font-family:'Special Elite',monospace; font-weight:400; font-size:12.5px; }
#mapScreen .seg button.on{ background:linear-gradient(135deg,var(--parch-seal),var(--parch-seal-2)); color:var(--parch-3); box-shadow:0 4px 12px rgba(122,32,32,.4); }

/* dolambaçlı ip/mürekkep rotası — drawPathConnector artık bu rengi kullanıyor */
#mapScreen .path-connector path{ filter:drop-shadow(0 1px 0 rgba(255,255,255,.2)); }

#mapScreen .node-badge{
  background:radial-gradient(circle at 34% 28%, var(--parch-3), var(--parch-1) 72%);
  border:2px solid var(--parch-ink-3); box-shadow:0 4px 10px rgba(58,42,23,.35), inset 0 0 0 3px var(--parch-2);
}
#mapScreen .path-node.is-done .node-badge{
  background:radial-gradient(circle at 34% 28%, var(--parch-gold-2), var(--parch-gold) 75%);
  border-color:var(--parch-ink); box-shadow:0 4px 14px rgba(150,114,31,.5), inset 0 0 0 3px rgba(255,255,255,.25);
}
#mapScreen .node-badge.is-boss{
  background:radial-gradient(circle at 34% 28%, var(--parch-seal-2), var(--parch-seal) 75%);
  border-color:#2a1810; box-shadow:0 4px 14px rgba(122,32,32,.5), inset 0 0 0 3px rgba(255,255,255,.18);
}
#mapScreen .path-node.is-locked .node-badge{ filter:grayscale(.5); }
#mapScreen .node-status{ background:var(--parch-3); border:1px solid var(--parch-edge); color:var(--parch-ink); }
#mapScreen .node-pulse{ border-color:var(--parch-gold-2); }

/* kart: yırtık/kırışık kenar hissi için hafif çentikli clip-path + el yazısı gibi
   hafif dönüklük — çift numaralı düğümler ters yöne, tek numaralılar düz yöne
   eğik (nth-child ile), sanki masaya rastgele bırakılmış kağıt parçaları gibi. */
#mapScreen .node-card{
  background:
    repeating-linear-gradient(115deg, rgba(58,42,23,.035) 0 2px, transparent 2px 5px),

/* ---------------- YAPI SÜRÜMÜ ----------------
   Bu etiket ana menüde başlığın yanında görünür ve konsola yazılır.

let COLS=12, ROWS=9;
const T=1.0;
function setGrid(map){
  COLS = (map && map.cols) || 12;
  ROWS = (map && map.rows) || 9;
}
function g2w(c,r){ return new THREE.Vector3((c-(COLS-1)/2)*T, 0, (r-(ROWS-1)/2)*T); }

function expandPath(way){
  const cells=[];
  for(let i=0;i<way.length;i++){
    const [c,r]=way[i];
    if(i===0){ cells.push({c,r}); continue; }
    let [pc,pr]=way[i-1];
    while(pc!==c||pr!==r){
      if(pc<c)pc++; else if(pc>c)pc--;
      else if(pr<r)pr++; else if(pr>r)pr--;
      cells.push({c:pc,r:pr});
    }
  }
  return cells;
}

const LANDMARK_MODELS = {

function b64ToBuf(b64){
  const bin=atob(b64); const len=bin.length; const bytes=new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}

/* ---------------- SES SİSTEMİ ----------------
   Web Audio API — kısa efektler AudioBuffer olarak önceden decode edilip
   önbelleğe alınır (SFX_CACHE), her çalışta yeni bir BufferSourceNode ile
   çalınır (aynı anda 10 düşman ölse bile üst üste binmeden çalar) ve hafif
   rastgele pitch ile tekdüzelik kırılır. Müzik ayrı bir <audio> elemanıyla
   (uzun dosyalar için Web Audio decode'a gerek yok, native loop yeterli).
   Kayıtlar meta.muted/meta.sfxVol/meta.musicVol içinde kalıcı. */
const SFX_CACHE={};
let _actx=null;
function ensureAudioCtx(){
  if(_actx) return _actx;
  try{ _actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ _actx=null; }
  return _actx;
}
function unlockAudio(){
  const ctx=ensureAudioCtx();
  if(ctx && ctx.state==='suspended') ctx.resume().catch(()=>{});
}
document.addEventListener('pointerdown', unlockAudio, {once:false});

function isMuted(){ return !!(meta && meta.muted); }
function sfxVolume(){ return (meta && typeof meta.sfxVol==='number') ? meta.sfxVol : 0.8; }
function musicVolume(){ return (meta && typeof meta.musicVol==='number') ? meta.musicVol : 0.6; }

function loadSfx(key){
  return new Promise(res=>{
    try{
      const b64=ASSET_B64 && ASSET_B64.sfx && ASSET_B64.sfx[key];
      const ctx=ensureAudioCtx();
      if(!b64 || !ctx){ res(); return; }
      ctx.decodeAudioData(b64ToBuf(b64), buf=>{ SFX_CACHE[key]=buf; res(); },
        err=>{ console.warn('sfx decode hatası:',key,err); res(); });
    }catch(err){ console.warn('sfx yükleme hatası:',key,err); res(); }
  });
}
/* key bulunamazsa (henüz o ses dosyası eklenmediyse) sessizce hiçbir şey
   yapmaz — bu sayede oyun kodunda TÜM silah sınıfları/olaylar için aynı
   çağrıyı serbestçe kullanabiliriz, dosya geldikçe otomatik devreye girer. */
function playSfx(key, opts){
  if(isMuted()) return;
  const buf=SFX_CACHE[key];
  const ctx=_actx;
  if(!buf || !ctx) return;
  opts=opts||{};
  const src=ctx.createBufferSource();
  src.buffer=buf;
  src.playbackRate.value=(opts.pitch||1)*(0.94+Math.random()*0.12);
  const gain=ctx.createGain();
  gain.gain.value=sfxVolume()*(opts.volume!==undefined?opts.volume:1);
  src.connect(gain).connect(ctx.destination);
  try{ src.start(0); }catch(e){}
}

let _musicEl=null, _musicKey=null;
function playMusic(key, opts){
  opts=opts||{};
  if(_musicKey===key && _musicEl && !_musicEl.paused) return;
  stopMusic();
  const b64=ASSET_B64 && ASSET_B64.music && ASSET_B64.music[key];
  if(!b64) return;
  _musicEl=new Audio('data:audio/mp3;base64,'+b64);
  _musicEl.loop=opts.loop!==false;
  _musicEl.volume=isMuted()?0:musicVolume()*(opts.volume!==undefined?opts.volume:1);
  _musicKey=key;
  _musicEl.play().catch(()=>{}); /* kullanıcı henüz hiçbir yere dokunmadıysa tarayıcı reddedebilir, sorun değil */
}
function stopMusic(){
  if(_musicEl){ _musicEl.pause(); _musicEl=null; }
  _musicKey=null;
}
function syncAudioVolumes(){
  if(_musicEl) _musicEl.volume=isMuted()?0:musicVolume();
}
function toggleMute(){
  meta.muted=!isMuted();
  syncAudioVolumes();
  saveMeta();
  return meta.muted;
}

const FX_TEX = {};
function loadFxTexture(name){

function preloadKenneyAssets(bar){
  const weaponModelNames = ['weapon-base'];
  for(const k in WEAPON_CLASSES){ WEAPON_CLASSES[k].tiers.forEach(t=>weaponModelNames.push(t.model)); }
  const names=[...BUILDING_NAMES, ...SKYSCRAPER_NAMES, ...PROP_NAMES,
               ...NATURE_NAMES, ...LOWDETAIL_NAMES, ...STREET_NAMES, 'path-straight',
               STRAIT_MODELS.bridge.model, STRAIT_MODELS.ocean.model,
               ...weaponModelNames,
               ...Object.keys(LANDMARK_MODELS).map(k=>LANDMARK_MODELS[k].model)];
  const skyNames=['day','night','morning'];
  const fxNames=['disk0','disk1','disk2'];
  /* sfx/music listesi ASSET_B64'ten dinamik okunur — yeni bir ses dosyası
     eklendiğinde bu fonksiyona dokunmaya gerek kalmaz, otomatik yüklenir. */
  const sfxNames = (ASSET_B64 && ASSET_B64.sfx) ? Object.keys(ASSET_B64.sfx) : [];
  const musicNames = (ASSET_B64 && ASSET_B64.music) ? Object.keys(ASSET_B64.music) : [];
  const total=names.length+skyNames.length+fxNames.length+MONSTER_LIST.length+SOLDIER_LIST.length+sfxNames.length;
  let done=0;
  const tick=()=>{ done++; if(bar) bar.style.width=Math.round(done/total*100)+'%'; };
  const all=Promise.all([
    ...names.map(n=>loadModel(n).then(tick)),
    ...skyNames.map(n=>loadSky(n).then(tick)),
    ...fxNames.map(n=>loadFxTexture(n).then(tick)),
    ...MONSTER_LIST.map(n=>loadMonster(n).then(tick)),
    ...SOLDIER_LIST.map(n=>loadSoldier(n).then(tick)),
    ...sfxNames.map(n=>loadSfx(n).then(tick)),
  ]);
  /* müzik dosyaları decode edilmez (native <audio> ile çalınır), sadece
     var olduklarını doğrulamak yeterli — ağır olabilecekleri için ayrı,
     ilerleme çubuğunu bekletmeyen bir yükleme. */
  window._musicKeysReady = musicNames;
  /* güvenlik ağı: takılırsa 20sn sonra oyun mevcut yüklenen asetlerle devam etsin.
     Süre biraz uzatıldı çünkü canavar modelleri de burada çözülüyor. */
  const timeout=new Promise(res=>setTimeout(res,20000));
  return Promise.race([all, timeout]);
}
function cloneModel(name){
  const src=MODEL_CACHE[name];
  if(!src) return null;
  const c=src.clone(true);
  c.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  return c;
}

const MONSTER_LIST = ['PinkBlob','GreenBlob','Frog','Birb','Mushnub','Ghost','Bunny',

   sade KARA ailesi Walk kullanır, HAVA ailesi Flying_Idle kullanır. */
const MONSTER_MOVE_CLIP = {

/* Dinozor paketi (Quaternius Animated Dinosaur Bundle) klip adlarını
   'Armature|Tür_Klip' şeklinde dışa aktarıyor (örn. 'Armature|TRex_Walk').
   '|' varsa son parçayı alıp bilinen klip son eklerinden birine (Walk/Run/
   Idle/Attack/Jump/Death) normalize ediyoruz. '|' İÇERMEYEN eski canavar
   klipleri (örn. 'Flying_Idle') bu mantığa hiç girmediği için dokunulmaz. */
const CLIP_SUFFIXES=['Walk','Run','Idle','Attack','Jump','Death'];
function normalizeClipName(raw){
  if(!raw.includes('|')) return raw;
  let s=raw.split('|').pop();
  const suf=CLIP_SUFFIXES.find(x=>s===x||s.endsWith('_'+x));
  return suf || s;
}
const MONSTER_CACHE = {};  /* isim -> { scene, anims:{klipAdı:AnimationClip}, height } */
function loadMonster(name){
  return new Promise(res=>{
    try{
      const b64 = ASSET_B64 && ASSET_B64.monsters && ASSET_B64.monsters[name];
      if(!b64 || !window.THREE || !THREE.GLTFLoader){ res(); return; }
      new THREE.GLTFLoader().parse(b64ToBuf(b64), '',
        gltf=>{
          const anims={};
          (gltf.animations||[]).forEach(c=>{ anims[normalizeClipName(c.name)]=c; });
          /* ölçek normalizasyonu için model yüksekliğini bir kere ölç — canavarlar
             (slime'dan ejderhaya) çok farklı ham boyutlarda geliyor, ENEMIES.size
             bu ölçülen yüksekliğe göre orantılanacak. */
          const box=new THREE.Box3().setFromObject(gltf.scene);
          const height=Math.max(0.01, box.max.y-box.min.y);
          MONSTER_CACHE[name]={ scene:gltf.scene, anims, height };
          res();
        },
        err=>{ console.warn('canavar yüklenemedi:',name,err); res(); });
    }catch(err){ console.warn('canavar parse hatası:',name,err); res(); }
  });
}
/* İskeletli modeli klonlar — three.js'in .clone() metodu iskeleti paylaştırır,
   bu da aynı türden birden fazla düşman aynı anda aynı pozu alır demek. Kemik
   hiyerarşisi yeniden kurulup her kopyaya kendi iskeleti bağlanıyor. */
function cloneSkinnedGLTF(source){
  const cloneLookup=new Map();
  const clone=source.clone(true);
  const srcNodes=[], dstNodes=[];
  source.traverse(n=>srcNodes.push(n));
  clone.traverse(n=>dstNodes.push(n));
  for(let i=0;i<srcNodes.length;i++) cloneLookup.set(srcNodes[i], dstNodes[i]);
  clone.traverse(node=>{
    if(!node.isSkinnedMesh) return;
    const srcMesh = srcNodes[dstNodes.indexOf(node)];
    if(!srcMesh || !srcMesh.skeleton) return;
    const srcBones = srcMesh.skeleton.bones;
    node.skeleton = srcMesh.skeleton.clone();
    node.skeleton.bones = srcBones.map(b=>{
      const c = cloneLookup.get(b);
      if(!c) console.warn('kemik eşleşmedi:', b && b.name);
      return c || b;
    });
    node.bind(node.skeleton, node.bindMatrix);
  });
  clone.traverse(o=>{ if(o.isMesh||o.isSkinnedMesh){ o.castShadow=true; o.receiveShadow=false; } });
  return clone;
}

const MAX_MULT = 6;      /* tier1/pip0 -> son kademe/pip10 arası toplam güç çarpanı (tüm sınıflarda ortak) */
const PIP_SHARE = 0.4;   /* bir kademe içindeki toplam artışın ne kadarı pip'lerle kazanılır, kalanı kademe atlarken tek seferde gelir */

function weaponTier(k){ return (meta.levels[k] && meta.levels[k].tier) || 1; }
function weaponPip(k){ return (meta.levels[k] && meta.levels[k].pip) || 0; }
/* T = toplam kademe GEÇİŞİ sayısı (N kademe için N-1). Sadj, pip'lerin son
   kademede de PIP_SHARE payını alabilmesi için düzeltilmiş toplam — bu sayede
   kademe sayısı ne olursa olsun (2 ile 10 arası) tier=N/pip=10 noktasında
   çarpan HER ZAMAN tam olarak MAX_MULT'a eşit olur (ne az ne fazla). */
function weaponStepMult(k){
  const T=WEAPON_CLASSES[k].tiers.length-1;
  const Sadj=T+PIP_SHARE;
  return T>0 ? Math.pow(MAX_MULT, 1/Sadj) : 1;
}
function weaponMultiplier(k){
  const tier=weaponTier(k), pip=weaponPip(k), step=weaponStepMult(k);
  const progress=(tier-1)+PIP_SHARE*(pip/10);
  return Math.pow(step, progress);
}
function weaponMaxed(k){ return weaponTier(k)>=WEAPON_CLASSES[k].tiers.length && weaponPip(k)>=10; }
/* pip başına maliyet: kademe arttıkça pahalılaşır, sınıfın taban yerleştirme
   maliyetinden türetilir (savaş içi yerleştirme maliyeti sabit kalır, bu ayrı) */
function upgradeCost(k){
  const tier=weaponTier(k);
  return Math.round(WEAPON_CLASSES[k].base.cost * Math.pow(1.22, tier-1) * 1.4);
}
function upgradeWeapon(k){
  if(weaponMaxed(k)) return false;
  const cls=WEAPON_CLASSES[k];
  const cur=meta.levels[k] || (meta.levels[k]={tier:1,pip:0});
  cur.pip++;
  if(cur.pip>=10){
    if(cur.tier<cls.tiers.length){ cur.tier++; cur.pip=0; }
    else cur.pip=10;   /* son kademedeyse bar dolu görünsün, taşmasın */
  }
  return true;
}
function weaponTierData(k){ return WEAPON_CLASSES[k].tiers[weaponTier(k)-1]; }
/* mevcut kademenin küçük resmi — önce canlı render dener (bkz. renderUnitIcon,
   b51), model henüz yüklenmediyse eski Blender-render PNG'ye (assets.js) düşer,
   o da yoksa null döner ve çağıran taraf renkli daireye düşer. */
function weaponIconSrc(k){
  const live=renderUnitIcon(k);
  if(live) return live;
  const model=weaponTierData(k).model;
  const b64=(typeof ASSET_B64!=='undefined' && ASSET_B64.icons) ? ASSET_B64.icons[model] : null;
  return b64 ? 'data:image/png;base64,'+b64 : null;
}

/* ---------------- 3D PLANET PREVIEW ---------------- */
let P=null;
function drawBlob(ctx,cx,cy,r,irregularity){
  ctx.beginPath();
  const pts=Math.floor(rnd(9,13));
  for(let i=0;i<=pts;i++){
    const a=(i/pts)*Math.PI*2;
    const rr=r*(1+Math.sin(a*3+cx)*0.12)*(1+(Math.random()-0.5)*irregularity);
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr*0.62;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function makePlanetTexture(world){
  const W=768,H=384;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');

  /* ocean base with subtle depth gradient */
  const og=ctx.createLinearGradient(0,0,0,H);
  og.addColorStop(0,world.ocean); og.addColorStop(0.5,world.oceanDeep); og.addColorStop(1,world.ocean);
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);

  /* continents — drawn 3x (wrap-safe) so the seam matches */
  const continents=[];
  const num=Math.floor(rnd(4,6));
  for(let i=0;i<num;i++){
    continents.push({ cx:rnd(0,W), cy:rnd(H*0.18,H*0.82), r:rnd(H*0.13,H*0.26) });
  }
  /* kıta sahanlığı — karanın çevresinde sığ, açık mavi kuşak */
  ctx.globalAlpha=0.55;
  for(const off of [-W,0,W]){
    continents.forEach(k=>{
      ctx.fillStyle=world.river;
      drawBlob(ctx,k.cx+off,k.cy,k.r*1.16,0.35);
      ctx.fill();
    });
  }
  ctx.globalAlpha=1;
  for(const off of [-W,0,W]){
    continents.forEach(k=>{
      ctx.fillStyle=world.land;
      drawBlob(ctx,k.cx+off,k.cy,k.r,0.35);
      ctx.fill();
      /* kıyı girintileri için kırık kenar hissi: kenara birkaç küçük yarımada/körfez */
      for(let s=0;s<4;s++){
        const a=rnd(0,Math.PI*2), rr=k.r*rnd(0.22,0.42);
        ctx.fillStyle = s%2 ? world.land : world.ocean;
        drawBlob(ctx,k.cx+off+Math.cos(a)*k.r*0.85, k.cy+Math.sin(a)*k.r*0.72, rr, 0.5);
        ctx.fill();
      }
      /* drier/lighter patches inside each landmass */
      ctx.fillStyle=world.landDry;
      drawBlob(ctx,k.cx+off+k.r*0.2,k.cy-k.r*0.1,k.r*0.42,0.4);
      ctx.fill();
      /* dağ sırtları — hafif koyu şeritler */
      ctx.globalAlpha=0.22; ctx.fillStyle='#000000';
      drawBlob(ctx,k.cx+off-k.r*0.25,k.cy+k.r*0.18,k.r*0.3,0.55);
      ctx.fill();
      ctx.globalAlpha=1;
    });
  }

  /* polar ice caps */
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.fillRect(0,0,W,H*0.045);
  ctx.fillRect(0,H*0.955,W,H*0.045);

  /* rivers threading through the continents */
  ctx.strokeStyle=world.river; ctx.lineCap='round';
  for(const off of [-W,0,W]){
    continents.forEach(k=>{
      if(Math.random()<0.55) return;
      ctx.lineWidth=rnd(1.2,2.2);
      ctx.globalAlpha=0.8;
      let x=k.cx+off+rnd(-k.r*0.3,k.r*0.3), y=k.cy+rnd(-k.r*0.3,k.r*0.3);
      ctx.beginPath(); ctx.moveTo(x,y);
      const segs=Math.floor(rnd(3,5));
      for(let s=0;s<segs;s++){ x+=rnd(-k.r*0.4,k.r*0.4); y+=rnd(-k.r*0.25,k.r*0.25); ctx.lineTo(x,y); }
      ctx.stroke();
    });
  }
  ctx.globalAlpha=1;

  /* bulut katmanı — iki farklı yoğunlukta, sarma güvenli */
  for(const off of [-W,0,W]){
    ctx.globalAlpha=0.13; ctx.fillStyle='#ffffff';
    for(let i=0;i<14;i++){
      const cx=rnd(0,W)+off, cy=rnd(H*0.06,H*0.94);
      drawBlob(ctx,cx,cy,rnd(30,66),0.55);
      ctx.fill();
    }
    ctx.globalAlpha=0.09;
    for(let i=0;i<10;i++){
      const cx=rnd(0,W)+off, cy=rnd(H*0.1,H*0.9);
      drawBlob(ctx,cx,cy,rnd(60,110),0.6);
      ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=THREE.RepeatWrapping;
  return tex;
}
function initPlanetView(){
  const canvas=document.getElementById('planetCanvas');
  if(!canvas) return;
  if(P && P.renderer.domElement===canvas) return;
  if(P){
    P.renderer.setAnimationLoop(null);
    P.renderer.dispose();
    window.removeEventListener('resize',P.resize);
  }
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(38,1,0.1,10);
  camera.position.set(0,0,3.1);
  const amb=new THREE.AmbientLight(0xffffff,0.55); scene.add(amb);
  const sun=new THREE.DirectionalLight(0xfff3d8,1.15); sun.position.set(-3,2,3); scene.add(sun);
  const rim=new THREE.DirectionalLight(0x8fd8ff,0.35); rim.position.set(3,-1,-2); scene.add(rim);

  const geo=new THREE.SphereGeometry(1,48,48);
  const mesh=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({roughness:0.85,metalness:0.05}));
  scene.add(mesh);
  const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.06,32,32),
    new THREE.MeshBasicMaterial({color:0x8fd8ff,transparent:true,opacity:0.12,side:THREE.BackSide}));
  scene.add(atmo);

  const prevTex = P ? P.lastTex : null;
  P={renderer,scene,camera,mesh,clock:new THREE.Clock(),lastTex:prevTex};
  if(prevTex) mesh.material.map=prevTex;
  const resize=()=>{
    const s=Math.min(canvas.clientWidth,canvas.clientHeight)||240;
    renderer.setSize(s,s,false);
  };
  window.addEventListener('resize',resize);
  P.resize=resize;
  resize();
  renderer.setAnimationLoop(()=>{
    const dt=P.clock.getDelta();
    if(document.getElementById('worldScreen').classList.contains('on')){
      mesh.rotation.y+=dt*0.25;
      renderer.render(scene,camera);
    }
  });
}
function updatePlanetTexture(world){
  if(!P) return;
  const tex=makePlanetTexture(world);
  P.lastTex=tex;
  P.mesh.material.map=tex;
  P.mesh.material.color.set(world.unlocked?0xffffff:0x6a6a6a);
  P.mesh.material.needsUpdate=true;
}

function buildStarfield(host, n){
  const wrap=document.createElement('div'); wrap.className='starfield';
  for(let i=0;i<n;i++){
    const s=document.createElement('div'); s.className='star';
    s.style.left=rnd(0,100)+'%'; s.style.top=rnd(0,100)+'%';
    const size=rnd(1,2.4);
    s.style.width=size+'px'; s.style.height=size+'px';
    s.style.animationDelay=rnd(0,4).toFixed(2)+'s';
    s.style.animationDuration=rnd(2.5,5).toFixed(2)+'s';
    wrap.appendChild(s);
  }
  host.appendChild(wrap);
}

/* dünya seçim ekranının arkasında duran karadelik — Abbadon'un geldiği yer */
function buildBackgroundBlackHole(host){
  const fx = (typeof ASSET_B64!=='undefined' && ASSET_B64.fx) ? ASSET_B64.fx : null;
  if(!fx) return;
  const wrap=document.createElement('div');
  wrap.className='bh-bg';
  const layers=[
    {tex:'disk0', dur:38, rev:false, tint:'rgba(157,95,224,.9)'},
    {tex:'disk1', dur:26, rev:true,  tint:'rgba(201,139,255,.8)'},
    {tex:'disk2', dur:52, rev:false, tint:'rgba(107,47,168,.8)'},
  ];
  for(const l of layers){
    if(!fx[l.tex]) continue;
    const d=document.createElement('div');
    d.className='bh-disk';
    d.style.backgroundImage=`url(data:image/png;base64,${fx[l.tex]})`;
    d.style.animationName = l.rev?'bhspinR':'bhspin';
    d.style.animationDuration=l.dur+'s';
    d.style.filter=`drop-shadow(0 0 10px ${l.tint})`;
    wrap.appendChild(d);
  }
  const core=document.createElement('div');
  core.className='bh-core';
  wrap.appendChild(core);
  host.appendChild(wrap);
}

  const stage=el(`<div class="planet-stage">
    <button class="arrow-btn" id="prevW" aria-label="Önceki">
      <svg viewBox="0 0 60 40"><path d="M56 20 H10 M26 6 L10 20 L26 34" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="planet-viewport" id="planetViewport">
      <div class="planet-name">${world.name}</div>
      ${visual}
      <div class="planet-sub ${world.unlocked?'':'locked'}">${world.unlocked ? (isDone?'✓ Tamamlandı — tekrar gir':`${cleared}/${MAPS.length} şehir · dokun ve gir`) : '🔒 Sinyal henüz ulaşmadı'}</div>
    </div>
    <button class="arrow-btn" id="nextW" aria-label="Sonraki">
      <svg viewBox="0 0 60 40"><path d="M4 20 H50 M34 6 L50 20 L34 34" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>`);
  sc.appendChild(stage);

  stage.querySelector('#prevW').addEventListener('click',()=>{ worldIdx=(worldIdx-1+WORLDS.length)%WORLDS.length; renderWorldSelect(); });
  stage.querySelector('#nextW').addEventListener('click',()=>{ worldIdx=(worldIdx+1)%WORLDS.length; renderWorldSelect(); });
  stage.querySelector('#planetViewport').addEventListener('click',()=>{
    if(!world.unlocked){ toast('Bu dünyaya sinyal henüz ulaşmadı.'); return; }
    currentWorld=world.id;
    renderMapSelect();
  });

  show('worldScreen');
  if(spriteB64){
    /* sprite gösterilen dünyada 3D gezegen döngüsünü boşuna çalıştırma */
    if(P) P.renderer.setAnimationLoop(null);
  } else {
    initPlanetView();
    if(P) P.resize();
    updatePlanetTexture(world);
  }
}

function terrainDataURL(world){
  /* Cepheler ekranının arka planı artık soyut leke deseni değil, gerçek kıta
     hatlarıyla çizilmiş eski/yıpranmış bir kâğıt dünya haritası — enlem/boylam
     ızgarası ve pusula gülüyle "gerçekten bir haritada geziyormuş" hissi
     veriyor. Oyun yatay (landscape) oynandığı için tuval de geniş (2:1),
     ekvatoral projeksiyon doğal oranında (lon 360° = W, lat 180° = H). */
  const W=1280,H=640;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  const lonx=lon=>(lon+180)/360*W, laty=lat=>(90-lat)/180*H;

  /* deniz zemini — soluk, tozlu bir mavi-yeşil yıkama (eski deniz haritalarında
     sık görülen ton), sepya kâğıt paletiyle uyumlu kalması için doygunluğu düşük */
  ctx.fillStyle='#93a89e'; ctx.fillRect(0,0,W,H);

  /* eskimiş kâğıt lekeleri — hem denizin hem karanın üstünde, kâğıdın kendisi
     eskimiş gibi */
  for(let i=0;i<14;i++){
    const cx=rnd(-40,W+40), cy=rnd(-40,H+40), r=rnd(60,190);
    ctx.globalAlpha=rnd(0.04,0.1);
    ctx.fillStyle='#5a4a2a'; drawBlob(ctx,cx,cy,r,0.5); ctx.fill();
  }
  ctx.globalAlpha=1;

  /* enlem/boylam ızgarası — her 20°'de bir, ince mürekkep çizgisi. Bu tek
     başına bile ekranın "bir harita" olduğunu anlık olarak anlatıyor. */
  ctx.strokeStyle='rgba(58,42,23,.16)'; ctx.lineWidth=1;
  for(let lon=-180;lon<=180;lon+=20){ ctx.beginPath(); ctx.moveTo(lonx(lon),0); ctx.lineTo(lonx(lon),H); ctx.stroke(); }
  for(let lat=-80;lat<=80;lat+=20){ ctx.beginPath(); ctx.moveTo(0,laty(lat)); ctx.lineTo(W,laty(lat)); ctx.stroke(); }
  /* ekvator ve başlangıç meridyeni biraz daha belirgin */
  ctx.strokeStyle='rgba(58,42,23,.28)'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(0,laty(0)); ctx.lineTo(W,laty(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lonx(0),0); ctx.lineTo(lonx(0),H); ctx.stroke();

  /* KITALAR — gerçek kıyı şeridi verisinden dolgu + mürekkep kontur */
  ctx.fillStyle='#d8c48f';
  ctx.strokeStyle='rgba(58,42,23,.65)'; ctx.lineWidth=1.15; ctx.lineJoin='round';
  LAND_RINGS.forEach(ring=>{
    ctx.beginPath();
    ring.forEach(([lon,lat],i)=>{
      const x=lonx(lon), y=laty(lat);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });

  /* dünya üstünde hafif relief taraması (dağ/tepe hissi) — sadece kara üstünde
     kalması için ayrıca kırpma yapmadan, düşük yoğunlukta serpiştiriliyor */
  ctx.strokeStyle='rgba(58,42,23,.18)'; ctx.lineCap='round';
  for(let i=0;i<40;i++){
    ctx.lineWidth=rnd(0.6,1.0);
    const x=rnd(0,W), y=rnd(0,H), len=rnd(6,14), ang=rnd(0,Math.PI*2);
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(ang)*len, y+Math.sin(ang)*len*0.5);
    ctx.stroke();
  }

  /* pusula gülü — sağ üstte, klasik keşif haritası imzası */
  (function drawCompass(cx,cy,r){
    ctx.save(); ctx.translate(cx,cy);
    ctx.strokeStyle='rgba(58,42,23,.55)'; ctx.fillStyle='rgba(58,42,23,.55)';
    ctx.lineWidth=1.4;

    for(let i=0;i<4;i++){

    }

      const a=i*Math.PI/8;
      const rr = i%4===0 ? r*1.3 : r*1.08;

     doğruluk iddiası yok) */
  ctx.strokeStyle='rgba(107,79,44,.5)'; ctx.lineCap='round'; ctx.setLineDash([3,5]);

  ctx.fillStyle=topShade; ctx.fillRect(0,0,W,H);

  return c.toDataURL();

    s+=`<polygon points="${x-0.4},${yTop} ${x+w/2+iso/2},${yTop-rh} ${x2+iso+0.4},${yTop-iso}" fill="${pal.roof}"/>`;
  }
  return s;
}

function drawPathConnector(wrap,svg){
  const nodes=[...wrap.querySelectorAll('.path-node')];
  if(nodes.length<2) return;
  const wrapRect=wrap.getBoundingClientRect();
  /* path-wrap artık kendisi yatay scroll container — getBoundingClientRect
     sadece GÖRÜNEN alanı verir, tüm kaydırılabilir genişliği değil. SVG'nin
     varsayılan overflow:hidden davranışı yüzünden width'i görünen alanla
     sınırlarsak uzaktaki (henüz kaydırılmamış) düğümlere giden çizgi kırpılıp
     kaybolur — scrollWidth kullanmak şart. */
  const fullW = wrap.scrollWidth, fullH = Math.max(wrapRect.height, wrap.scrollHeight);
  svg.setAttribute('width', fullW);
  svg.setAttribute('height', fullH);
  svg.style.width=fullW+'px';
  svg.style.height=fullH+'px';
  const pts=nodes.map(n=>{
    const r=n.querySelector('.node-badge').getBoundingClientRect();
    return { x:r.left+r.width/2-wrapRect.left, y:r.top+r.height/2-wrapRect.top };
  });
  /* elle çizilmiş kâğıt harita hissi için kontrol noktalarına ufak, sabit bir
     "titreme" ekleniyor — düz/mekanik eğri yerine hafif eğri-büğrü bir hat. */
  let d=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const p0=pts[i-1], p1=pts[i];
    const jitter=((i*37)%9-4)*1.6;
    d+=` Q ${p0.x+jitter} ${p1.y-jitter} ${p1.x} ${p1.y}`;
  }
  svg.innerHTML=`<path d="${d}" fill="none" stroke="rgba(58,42,23,.55)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 12"/>`;
}

let R=null;   // renderer bundle
let B=null;   // battle state

function initRenderer(){
  if(R) return;
  const canvas=document.getElementById('glcanvas');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  /* mobilde dolgu oranı en pahalı kısım: 1.6 yerine 1.35 belirgin kazanç sağlıyor,
     görsel fark ise neredeyse yok */
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.35));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;

  const scene=new THREE.Scene();
  /* sis kaldırıldı: kamera artık 50°'nin altına inemiyor, yani ufku zaten hiç
     göremiyoruz — sis görünmeyen bir mesafeyi gizlemek için gereksiz bir maliyetti. */

  /* yakın düzlem 1.0: 0.1'e kıyasla derinlik hassasiyetini ~10 kat artırır.
     Daha büyük seçilmiyor çünkü pan ile kamera uzak bina halkasına yaklaşabiliyor
     ve yakındaki binaların içi görünürdü. */
  const camera=new THREE.PerspectiveCamera(46,1,1.0,200);

  /* sky dome */
  const skyMat=new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{ top:{value:new THREE.Color(PAL.skyTop)}, bot:{value:new THREE.Color(PAL.skyBot)} },
    vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h=normalize(vP).y; float t=clamp(pow(max(h,0.0),0.75),0.0,1.0); gl_FragColor=vec4(mix(bot,top,t),1.0); }',
  });
  const sky=new THREE.Mesh(new THREE.SphereGeometry(80,20,14), skyMat);
  scene.add(sky);

  /* pale sun disc through smoke */
  const sunMat=new THREE.MeshBasicMaterial({color:0xd8d1bd,transparent:true,opacity:0.42,depthWrite:false});
  const sun=new THREE.Mesh(new THREE.CircleGeometry(3.2,24),sunMat);
  sun.position.set(-26,9,-46); sun.lookAt(0,4,0);
  scene.add(sun);
  const halo=new THREE.Mesh(new THREE.CircleGeometry(7.5,24), new THREE.MeshBasicMaterial({color:0xc9c2ae,transparent:true,opacity:0.13,depthWrite:false}));
  halo.position.copy(sun.position); halo.lookAt(0,4,0);
  scene.add(halo);

  /* light */
  const hemi=new THREE.HemisphereLight(0xd4d0ac, 0x33401f, 0.92);
  scene.add(hemi);
  const sunLight=new THREE.DirectionalLight(0xfff0cf, 1.25);
  sunLight.position.set(-22,19,-20);
  sunLight.castShadow=true;
  sunLight.shadow.mapSize.set(1024,1024);   /* 2048 mobilde gereksiz pahalı */
  sunLight.shadow.bias=-0.0006;
  /* normalBias, gölge haritasının texel boyutuna göre seçilmeli. Bu sahnede
     kamera ~35 birimlik alanı 1024 texel'e sığdırıyor, yani 1 texel ≈ 0.034
     birim. Eski değer (0.02) bunun yarısı kadardı ve yuvarlak yüzeylerde kendi
     kendine gölgelenme (akne) engellenemiyordu. ~1.6 texel güvenli aralık. */
  sunLight.shadow.normalBias=0.055;
  const sc2=sunLight.shadow.camera;
  /* sınırlar fitShadowCamera() ile ızgaraya göre güncellenir; buradaki değerler
     yalnızca ilk kurulum içindir */
  sc2.left=-16; sc2.right=16; sc2.top=16; sc2.bottom=-16; sc2.near=1; sc2.far=80;
  scene.add(sunLight);
  const fill=new THREE.DirectionalLight(0x8fa2c2,0.32);
  fill.position.set(6,4,7);
  scene.add(fill);
  const rim=new THREE.DirectionalLight(0xffe0b0,0.4);
  rim.position.set(4,3,-9);
  scene.add(rim);

  /* falling ash */
  const N=420, pos=new Float32Array(N*3), vel=new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]=rnd(-14,14); pos[i*3+1]=rnd(0,13); pos[i*3+2]=rnd(-12,12);
    vel[i]=rnd(0.25,0.7);
  }
  const ashGeo=new THREE.BufferGeometry();
  ashGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const ash=new THREE.Points(ashGeo, new THREE.PointsMaterial({color:0xcfc8b6,size:0.045,transparent:true,opacity:0.55,depthWrite:false}));
  scene.add(ash);

  R={renderer,scene,camera,sky,skyMat,sun,sunMat,halo,haloMat:halo.material,hemi,sunLight,fill,rim,ash,ashVel:vel,clock:new THREE.Clock(),
     ray:new THREE.Raycaster(), ndc:new THREE.Vector2(),
     stage:null, camYaw:0, camDist:15.5, camPitch:0.86, camTarget:new THREE.Vector3(0,0.3,0),
     camMin:9, camMax:24, nightLights:[]};

  window.addEventListener('resize',resizeR);
  setupInput(canvas);
  resizeR();
  renderer.setAnimationLoop(loop);
}
const ENV_PRESETS = {

  winter:{

    sunDisc:0xf3f7fb, sunOpacity:0.5, haloOpacity:0.16,
