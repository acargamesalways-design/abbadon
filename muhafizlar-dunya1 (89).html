/* NOT: buildOutskirtStreets() fonksiyonu buradan tamamen kaldırıldı — rastgele,
   bağlantısız sokak parçaları üretiyordu ve haritada anlamsız duruyordu.
   O bölge artık buildProps() içindeki AĞAÇ HALKASI'na ait. */
/* Savaş ızgarasını 1 kare boşlukla saran kapalı ÇİT çemberi.
   ÖNCEDEN: burada Kenney Modular Road Kit ile bir halka YOL kuruluyordu. Kit'in tek
   düz parçası (road_straightBarrier) bariyerlerini yolun eni boyunca taşıdığı için
   her karoda yolu kesen duvarlar oluşuyordu ve hiçbir dönüş/hizalama ayarı bunu
   düzeltmedi. Kullanıcı isteğiyle yol tamamen kaldırıldı, yerine Quaternius çit
   paneli kondu (fence-panel).
   Geometri: çit dikdörtgeninin köşeleri (±(COLS+1)/2, ±(ROWS+1)/2) noktalarında.
   Kenar uzunlukları tam sayı olduğu için her kenara birim uzunlukta panel tam
   oturuyor, köşelerde uçlar birbirine değiyor — boşluk/bindirme kalmıyor. */
function buildBattleRing(map){
  const occupied = new Set();

  /* dekorun çit hattına girmemesi için halka karelerini işaretle (yol döneminde de
     bu set aynı işi görüyordu) */
  const ringCells=[];
  for(let c=-1;c<=COLS;c++){ ringCells.push([c,-1]); ringCells.push([c,ROWS]); }
  for(let r=0;r<ROWS;r++){ ringCells.push([-1,r]); ringCells.push([COLS,r]); }
  ringCells.forEach(([c,r])=>{
    const wx=(c-(COLS-1)/2)*T, wz=(r-(ROWS-1)/2)*T;
    occupied.add(Math.round(wx)+','+Math.round(wz));
  });

  if(!MODEL_CACHE['fence-panel']) return occupied;

  /* şehir simgesinin oturduğu yerde çit kesilir — anıtın içinden çit geçmesin */
  const lb=B && B.landmarkBox;
  const blockedAt=(wx,wz)=>{
    if(!lb) return false;
    const m=T*0.42;
    return lb.min.x < wx+m && lb.max.x > wx-m && lb.min.z < wz+m && lb.max.z > wz-m;
  };

  const S=T/FENCE_LEN;                 /* bir panel tam bir karo boyu olsun */
  const halfX=(COLS+1)/2*T, halfZ=(ROWS+1)/2*T;

  /* Tek paylaşılan materyal: hem statik geometri birleştirmesi çalışsın hem de
     modelin kendi ayarı düzeltilsin. GLB'de metallic=0.4 geliyor; sahnede ortam
     haritası (envMap) olmadığı için metalik yüzey kapkara okunuyordu. */
  if(!R.fenceMat){
    R.fenceMat=new THREE.MeshStandardMaterial({color:0x3c4250,roughness:0.78,metalness:0.0});
  }

  const place=(wx,wz,rotY)=>{
    if(blockedAt(wx,wz)) return;
    const o=cloneModel('fence-panel');
    if(!o) return;
    o.scale.setScalar(S);
    o.position.set(wx,0,wz);
    o.rotation.y=rotY;
    /* çit ızgaranın dışında; gerçek gölge düşürürse yerleştirme kareleri kararıyor */
    o.traverse(m=>{ if(m.isMesh){ m.material=R.fenceMat; m.castShadow=false; m.receiveShadow=true; } });
    R.stage.add(o);
  };

  /* üst ve alt kenar — panel doğal olarak X boyunca uzanıyor, dönüş gerekmiyor */
  for(let i=0;i<COLS+1;i++){
    const wx=-halfX+(i+0.5)*T;
    place(wx,-halfZ,0);
    place(wx, halfZ,0);
  }
  /* sol ve sağ kenar — 90° döndürülüp Z boyunca dizilir */
  for(let i=0;i<ROWS+1;i++){
    const wz=-halfZ+(i+0.5)*T;
    place(-halfX,wz,Math.PI/2);
    place( halfX,wz,Math.PI/2);
  }

  return occupied;
}

function buildProps(map, pset){
  const kind=map.props;
  const theme = ENV_THEME[kind] || ENV_THEME.suburb;
  /* keep the whole placement plaza clear — decoration only lives past this buffer */
  const plazaX=(COLS-1)/2*T + 0.85, plazaZ=(ROWS-1)/2*T + 0.85;
  /* halka yarıçapları ızgara boyutuna göre kayar; 12x9'da eski değerlerle aynı çıkar */
  /* Dekor artık sonsuza uzanmıyor: kamera açısı 50°'nin altına inemediği için
     görüş ~15-19 birimde bitiyor, dekor da tam orada bitiyor. Eski uzak halka
     (18-34) ve ufuk siluetleri tamamen kaldırıldı — hiçbiri görünmüyordu. */
  const R1=Math.max(9.8, Math.hypot(plazaX,plazaZ)*1.22);   /* yakın çevre dış sınırı */
  /* R2 eskiden doğrudan decorOuter'a (kamera görüş sınırı, performans için 20'de
     sabit) eşitti. Büyük/geniş haritalarda (New York gibi) R1 bu sınırı geçince
     orta bina şeridi (TREE_OUTER..RWALL) kağıt inceliğinde kalıyor, 210 binanın
     çoğu yerleşemeden iptal oluyordu — boş alan buradan geliyordu. R2 artık R1'e
     göre de garanti bir pay bırakıyor; kamera zaten görebildiği kadarını gösterir,
     nesne SAYISI sabit olduğu için performans etkilenmiyor, sadece daha geniş bir
     alana düzgün yayılıyor. */
  const R2=Math.max((R && R.decorOuter) ? R.decorOuter : R1+7, R1+7);
  const RWALL=R2-2.2;                                        /* gökdelen duvarının başladığı yer */
  /* önce sokaklar döşenir; dönen hücreler bina/ağaç yerleşiminde boş bırakılır */
  const ringCells = buildBattleRing(map);
  /* NOT: burada eskiden rastgele, bağlantısız sokak parçaları döşeyen
     buildOutskirtStreets() çağrılıyordu. Kullanıcı geri bildirimiyle kaldırıldı —
     yönü/bağlantısı olmayan sokak parçaları havada kalmış gibi, mantıksız
     duruyordu. O alan artık AĞAÇ HALKASI'na ait; boş bırakılan hücreler
     doğrudan ağaç/çalı yerleşimiyle doluyor. */
  const streetCells = new Set();
  ringCells.forEach(k=>streetCells.add(k));
  const onStreet=(x,z)=>{
    if(!streetCells.size) return false;
    const cx=Math.round(x), cz=Math.round(z);
    /* noktanın bulunduğu karo sokaksa engelle */
    if(streetCells.has(cx+','+cz)) return true;
    /* komşu karo sokaksa, sadece kaldırıma taşan dar bir şerit engellensin */
    for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++){
      if(dx===0&&dz===0) continue;
      if(!streetCells.has((cx+dx)+','+(cz+dz))) continue;
      if(Math.abs(x-(cx+dx))<0.62 && Math.abs(z-(cz+dz))<0.62) return true;
    }
    return false;
  };
  /* Dekorun asla girmeyeceği iç alan artık ÇİT dikdörtgenine göre tanımlı.
     Eskiden burada dairesel bir yarıçap (plaza) kullanılıyordu; çit dikdörtgen
     olduğu için kısa kenarlarda (üst/alt) çitle ağaçlar arasında 4-7 birimlik
     boş bir bant kalıyordu (kullanıcı geri bildirimi). Dikdörtgen sınır bu boşluğu
     tamamen kapatır. */
  const FENCE_HX=(COLS+1)/2*T, FENCE_HZ=(ROWS+1)/2*T;
  const KEEP_X=FENCE_HX+0.85, KEEP_Z=FENCE_HZ+0.85;
  const insideKeep=(x,z)=>Math.abs(x)<KEEP_X && Math.abs(z)<KEEP_Z;

  const outskirt=(maxR)=>{
    let x,z,tries=0;
    do{ x=rnd(-maxR,maxR); z=rnd(-maxR,maxR); tries++; }
    while((insideKeep(x,z) || onStreet(x,z)) && tries<40);
    return [x,z];
  };
  /* Belirli bir halka aralığında nokta üret. rMin=0 verilirse çitin hemen
     dışından başlayan dolu bir "çerçeve" oluşur — dikdörtgen çit ile dairesel
     dış sınır arasındaki tüm alan eşit yoğunlukta dolar. */
  const ringPoint=(rMin,rMax)=>{
    for(let t=0;t<60;t++){
      const a=Math.random()*Math.PI*2;
      const d=Math.sqrt(rnd(rMin*rMin, rMax*rMax));
      const x=Math.cos(a)*d, z=Math.sin(a)*d;
      if(insideKeep(x,z)) continue;
      if(onStreet(x,z)) continue;
      return [x,z];
    }
    return null;
  };

  /* tek paylaşılan materyal — yüzlerce gölge dairesi tek çizim çağrısında birleşsin
     (her birine ayrı materyal verilirse birleştirme çalışmaz) */
  /* NOT: burası eskiden her dekor nesnesinin altına yumuşak bir gölge dairesi
     çiziyordu. Açık yeşil zeminde bu daireler nesneden bağımsız gri lekeler gibi
     okunuyordu ("karaltı" geri bildirimi). Tamamen kapatıldı — fonksiyon duruyor
     ki çağıran onlarca satırı tek tek silmeye gerek kalmasın. */
  const dropShadow=(x,z,r)=>{};
  const dropShadowUnused=(x,z,r)=>{
    const m=new THREE.Mesh(new THREE.CircleGeometry(r,12), SHADOW_MAT);
    m.rotation.x=-Math.PI/2; m.position.set(x,0.001,z);
    R.stage.add(m);
  };

  /* gerçek Kenney modeli yerleştirici — uzaktakiler gölge atmaz (performans) */
  /* Çevre dekorasyonu artık gerçek gölge DÜŞÜRMÜYOR.
     Sebep: savaş alanı kenarındaki binalar/ağaçlar ızgaranın üzerine uzun gölgeler
     atıp yerleştirme karelerinin bir kısmını karartıyordu; oyuncu hangi karenin
     seçilebilir olduğunu okuyamıyordu. Nesneler yere basmış görünsün diye
     altlarına yumuşak gölge dairesi konuyor. Kuleler, düşmanlar ve şehir simgesi
     gerçek gölge düşürmeye devam ediyor. */
  const noCast=(o)=>{ o.traverse(m=>{ if(m.isMesh){ m.castShadow=false; } }); return o; };
  const placeModel=(name,x,z,opts)=>{
    opts=opts||{};
    const o=cloneModel(name);
    if(!o) return null;
    const s=opts.scale!==undefined?opts.scale:1;
    o.scale.setScalar(s);
    o.position.set(x, opts.y||0, z);
    o.rotation.y = opts.rotY!==undefined?opts.rotY:rnd(0,Math.PI*2);
    const far = Math.hypot(x,z) > 11;
    noCast(o);
    if(far) o.traverse(m=>{ if(m.isMesh){ m.receiveShadow=false; } });
    R.stage.add(o);
    if(opts.shadow && !far) dropShadow(x,z,opts.shadow*s);
    return o;
  };
  const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];

  const addRubble=(x,z)=>{
    dropShadow(x,z,0.28);
    const g=new THREE.Group();
    for(let i=0;i<3;i++){
      const s=rnd(0.1,0.22);
      const m=new THREE.Mesh(new THREE.BoxGeometry(s,s*0.7,s), mat(PAL.concrete,0.98));
      m.position.set(rnd(-0.25,0.25), s*0.35, rnd(-0.25,0.25));
      m.rotation.set(rnd(0,1),rnd(0,3),rnd(0,1));
      m.castShadow=false; g.add(m);
    }
    g.position.set(x,0,z); R.stage.add(g);
  };
  const addWreck=(x,z)=>{
    dropShadow(x,z,0.42);
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.2,0.34), mat(PAL.rust,0.95));
    body.position.y=0.14; body.castShadow=false; g.add(body);
    const cab=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.16,0.3), mat(0x4a463c,0.95));
    cab.position.set(-0.04,0.3,0); cab.castShadow=false; g.add(cab);
    g.position.set(x,0,z); g.rotation.y=rnd(0,6);
    R.stage.add(g);
  };
  /* --- ağaç / çalı / kaya: artık gerçek Nature Kit modelleri --- */
  const addTree=(x,z)=>{
    const name=pick(theme.trees);
    if(!placeModel(name,x,z,{scale:rnd(0.75,1.25),shadow:0.4})){
      /* model yoksa basit koni-ağaca düş */
      const g=new THREE.Group();
      const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.08,0.85,7), mat(0x4a3a26,0.95));
      tr.position.y=0.42; g.add(tr);
      const b=new THREE.Mesh(new THREE.SphereGeometry(0.36,9,8), mat(PAL.leaf,0.88));
      b.position.y=0.95; g.add(b);
      g.position.set(x,0,z); R.stage.add(g);
    }
  };
  const addBush=(x,z)=>{
    const name=pick(theme.small);
    placeModel(name,x,z,{scale:rnd(0.8,1.4)});
  };
  const addRock=(x,z)=>{
    const name=pick(theme.rocks||['rock_smallA']);
    placeModel(name,x,z,{scale:rnd(0.7,1.3),shadow:0.3});
  };
  const addPalm=(x,z)=>{
    const palms=theme.trees.filter(n=>n.indexOf('palm')>=0);
    const name=palms.length?pick(palms):pick(theme.trees);
    placeModel(name,x,z,{scale:rnd(0.8,1.3),shadow:0.42});
  };
  const addFence=(x,z)=>{
    placeModel('fence_simple',x,z,{scale:rnd(0.8,1.1),rotY:Math.round(rnd(0,3))*(Math.PI/2)});
  };
  const addStatue=(x,z)=>{
    const name=pick(theme.statues||['statue_column']);
    placeModel(name,x,z,{scale:rnd(0.7,1.1),shadow:0.28});
  };
  const addLamp=(x,z)=>{
    const pick=LIGHT_NAMES[Math.floor(Math.random()*LIGHT_NAMES.length)];
    const l=cloneModel(pick);
    if(l){
      l.scale.setScalar(rnd(0.9,1.2));
      l.position.set(x,0,z);
      l.rotation.y=rnd(0,6);
      R.stage.add(l);
      return;
    }
    const g=new THREE.Group();
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.035,1.5,6), mat(0x413d36,0.85));
    p.position.y=0.75; p.castShadow=false; g.add(p);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.04,0.05), mat(0x413d36,0.85));
    arm.position.set(0.15,1.48,0); g.add(arm);
    g.position.set(x,0,z); R.stage.add(g);
  };
  const addContainer=(x,z)=>{
    const h=rnd(1,2)|0;
    for(let i=0;i<=h;i++){
      const col=[0x5c4a34,0x445043,0x53483f][Math.floor(Math.random()*3)];
      const m=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.42,0.5), mat(col,0.95));
      m.position.set(x, 0.21+i*0.44, z); m.rotation.y=rnd(-0.15,0.15);
      m.castShadow=false; m.receiveShadow=true; R.stage.add(m);
    }
  };
  const addBarrier=(x,z)=>{
    const b=cloneModel('construction-barrier');
    if(b){
      b.scale.setScalar(rnd(1.6,2.4));
      b.position.set(x,0,z); b.rotation.y=rnd(0,6);
      R.stage.add(b);
      return;
    }
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.28,0.16), mat(0x6a6156,0.95));
    m.position.set(x,0.14,z); m.rotation.y=rnd(-0.3,0.3); m.castShadow=false; R.stage.add(m);
  };
  const addPillar=(x,z)=>{
    if(placeModel('statue_column',x,z,{scale:rnd(0.8,1.3),shadow:0.24})) return;
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.19,rnd(0.9,1.6),8), mat(0x6b655a,0.96));
    m.position.set(x,m.geometry.parameters.height/2,z); m.castShadow=false; R.stage.add(m);
  };
  const addStall=(x,z)=>{
    const pick=PARASOL_NAMES[Math.floor(Math.random()*PARASOL_NAMES.length)];
    const p=cloneModel(pick);
    if(p){
      const s=rnd(0.85,1.15);
      p.scale.setScalar(s);
      p.position.set(x,0,z);
      p.rotation.y=rnd(0,6);
      R.stage.add(p);
      dropShadow(x,z,0.3*s);
      return;
    }
    const g=new THREE.Group();
    const col=[0xB5502E,0xC79A63,0x4a8f7a,0xE8C158][Math.floor(Math.random()*4)];
    const roof=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.05,0.5), mat(col,0.8));
    roof.position.y=0.62; g.add(roof);
    for(const sx of [-0.24,0.24]) for(const sz of [-0.2,0.2]){
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.6,5), mat(0x4a3a26,0.9));
      leg.position.set(sx,0.3,sz); g.add(leg);
    }
    const table=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.1,0.35), mat(0x8a7050,0.9));
    table.position.y=0.32; g.add(table);
    g.position.set(x,0,z); g.rotation.y=rnd(0,6); R.stage.add(g);
  };
  const BUILD_PALETTE=[0xE3D4B0,0xC9B896,0xB9A67E,0xD8C4A0,0xA8B0A0,0xC2AF8E];
  /* çevre binası — gerçek Kenney modeli; yüklenmemişse basit kutuya düşer */
  const addAwning=(x,z)=>{
    const pick=BUILDING_NAMES[Math.floor(Math.random()*BUILDING_NAMES.length)];
    const b=cloneModel(pick);
    if(b){
      const s=rnd(0.5,0.78);
      b.scale.setScalar(s);
      b.position.set(x,0,z);
      b.rotation.y=Math.round(rnd(0,3))*(Math.PI/2)+rnd(-0.04,0.04);
      noCast(b);
      R.stage.add(b);
      dropShadow(x,z,s*0.62);
      return;
    }
    const g=new THREE.Group();
    const bodyCol=BUILD_PALETTE[Math.floor(Math.random()*BUILD_PALETTE.length)];
    const w=rnd(0.55,0.75), d=rnd(0.5,0.65), h=rnd(0.85,1.5);
    const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(bodyCol,0.85));
    body.position.y=h/2; body.receiveShadow=true; g.add(body);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.08,0.07,d+0.08), mat(0x5a5348,0.8));
    roof.position.y=h+0.035; g.add(roof);
    g.position.set(x,0,z); g.rotation.y=Math.round(rnd(0,3))*(Math.PI/2);
    R.stage.add(g);
    dropShadow(x,z,Math.max(w,d)*0.7);
  };
  const addBench=(x,z)=>{
    const g=new THREE.Group();
    const seat=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.05,0.16), mat(0x5a4a34,0.9));
    seat.position.y=0.22; g.add(seat);
    const back=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.2,0.03), mat(0x5a4a34,0.9));
    back.position.set(0,0.34,-0.07); g.add(back);
    g.position.set(x,0,z); g.rotation.y=rnd(0,6); R.stage.add(g);
  };
  const addSign=(x,z)=>{
    const g=new THREE.Group();
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.9,5), mat(0x2a2a2a,0.7));
    pole.position.y=0.45; g.add(pole);
    const col=[0xff5a7a,0x5affea,0xffe65a,0xff9a3d][Math.floor(Math.random()*4)];
    const panel=new THREE.Mesh(new THREE.PlaneGeometry(0.4,0.22), new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.9,side:THREE.DoubleSide}));
    panel.position.y=0.85; panel.rotation.y=rnd(0,6); g.add(panel);
    g.position.set(x,0,z); R.stage.add(g);
  };
  const addFireHydrant=(x,z)=>{
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,0.28,8), mat(0xB5502E,0.6));
    body.position.y=0.14; g.add(body);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8), mat(0xB5502E,0.6));
    cap.position.y=0.3; g.add(cap);
    g.position.set(x,0,z); R.stage.add(g);
  };
  const addCanalPost=(x,z)=>{
    const g=new THREE.Group();
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,0.5,6), mat(0x5a4a34,0.9));
    post.position.y=0.25; g.add(post);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8), new THREE.MeshStandardMaterial({color:0xffe6a3,emissive:0xffcf6b,emissiveIntensity:0.6}));
    lamp.position.y=0.54; g.add(lamp);
    g.position.set(x,0,z); R.stage.add(g);
  };

  const addSandbags=(x,z)=>{
    const g=new THREE.Group();
    const rows=Math.floor(rnd(3,6));
    for(let i=0;i<rows;i++){
      const bag=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,0.16,7), mat(0x8a7a52,0.95));
      bag.rotation.z=Math.PI/2;
      bag.position.set((i-rows/2)*0.15+rnd(-0.02,0.02),0.07,rnd(-0.02,0.02));
      bag.castShadow=false; g.add(bag);
    }
    for(let i=0;i<rows-1;i++){
      const bag=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,0.16,7), mat(0x7a6a46,0.95));
      bag.rotation.z=Math.PI/2;
      bag.position.set((i-rows/2)*0.15+0.075,0.16,rnd(-0.02,0.02));
      bag.castShadow=false; g.add(bag);
    }
    g.position.set(x,0,z); g.rotation.y=rnd(0,6); R.stage.add(g);
    dropShadow(x,z,rows*0.09);
  };
  const addBarbedWire=(x,z)=>{
    const g=new THREE.Group();
    const postMat=mat(0x3a3630,0.7);
    const p1=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.025,0.32,5), postMat);
    p1.position.set(-0.32,0.16,0); g.add(p1);
    const p2=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.025,0.32,5), postMat);
    p2.position.set(0.32,0.16,0); g.add(p2);
    for(const y of [0.1,0.2,0.28]){
      const pts=[]; for(let i=0;i<=8;i++){ pts.push(new THREE.Vector3(-0.32+i*0.08, y+Math.sin(i*2)*0.012, Math.cos(i*3)*0.02)); }
      const geo=new THREE.BufferGeometry().setFromPoints(pts);
      g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({color:0x4a463c})));
    }
    g.position.set(x,0,z); g.rotation.y=rnd(0,6); R.stage.add(g);
  };
  const addCrate=(x,z)=>{
    const g=new THREE.Group();
    const s=rnd(0.22,0.34);
    const crate=new THREE.Mesh(new THREE.BoxGeometry(s,s*0.85,s), mat(0x7a5a38,0.9));
    crate.position.y=s*0.42; crate.castShadow=false; g.add(crate);
    const strapMat=mat(0x4a3826,0.85);
    for(const rot of [0,Math.PI/2]){
      const strap=new THREE.Mesh(new THREE.BoxGeometry(s*1.02,0.02,0.03), strapMat);
      strap.position.y=s*0.42; strap.rotation.y=rot; g.add(strap);
    }
    if(Math.random()<0.5){
      const crate2=new THREE.Mesh(new THREE.BoxGeometry(s*0.8,s*0.7,s*0.8), mat(0x8a6a44,0.9));
      crate2.position.set(rnd(-0.1,0.1), s*0.85+s*0.35*0.7, rnd(-0.1,0.1));
      crate2.rotation.y=rnd(-0.3,0.3); crate2.castShadow=false; g.add(crate2);
    }
    g.position.set(x,0,z); g.rotation.y=rnd(0,6); R.stage.add(g);
    dropShadow(x,z,s*0.75);
  };
  const addScorchMark=(x,z)=>{
    const r=rnd(0.35,0.7);
    const m=new THREE.Mesh(new THREE.CircleGeometry(r,12), new THREE.MeshBasicMaterial({color:0x1a1510,transparent:true,opacity:rnd(0.28,0.45),depthWrite:false}));
    m.rotation.x=-Math.PI/2; m.rotation.z=rnd(0,6); m.position.set(x,0.004,z);
    R.stage.add(m);
    for(let i=0;i<3;i++){
      const cr=new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(0.05,0.1),0), mat(0x2a2420,0.95));
      cr.position.set(x+rnd(-r*0.5,r*0.5),0.03,z+rnd(-r*0.5,r*0.5));
      cr.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));
      R.stage.add(cr);
    }
  };
  const addGrassTuft=(x,z)=>{
    if(placeModel(Math.random()<0.5?'grass':'grass_large',x,z,{scale:rnd(0.7,1.2)})) return;
    const g=new THREE.Group();
    const n=Math.floor(rnd(3,5));
    for(let i=0;i<n;i++){
      const h=rnd(0.09,0.16);
      const blade=new THREE.Mesh(new THREE.ConeGeometry(0.018,h,3), mat(Math.random()<0.5?PAL.leaf:PAL.leaf2,0.85));
      blade.position.set(rnd(-0.08,0.08),h/2,rnd(-0.08,0.08));
      blade.rotation.z=rnd(-0.25,0.25); blade.rotation.x=rnd(-0.15,0.15);
      g.add(blade);
    }
    g.position.set(x,0,z); R.stage.add(g);
  };
  const addPebbleCluster=(x,z)=>{
    if(placeModel(Math.random()<0.5?'rock_smallA':'rock_smallC',x,z,{scale:rnd(0.5,0.9)})) return;
    const g=new THREE.Group();
    const n=Math.floor(rnd(2,4));
    for(let i=0;i<n;i++){
      const s=rnd(0.03,0.07);
      const peb=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0), mat(0x8a8375,0.95));
      peb.position.set(rnd(-0.1,0.1),s*0.5,rnd(-0.1,0.1));
      peb.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));
      g.add(peb);
    }
    g.position.set(x,0,z); R.stage.add(g);
  };

  const sets = {
    suburb:    [addTree,addBush,addTree,addLamp,addBush,addTree,addRock,addWreck],
    industrial:[addTree,addContainer,addBush,addTree,addBarrier,addRock,addTree,addRubble],
    highway:   [addTree,addBush,addBarrier,addTree,addRock,addBush,addTree,addWreck],
    oldtown:   [addTree,addPillar,addBush,addTree,addRock,addBush,addTree,addRubble],
    desert:    [addRock,addPalm,addRubble,addAwning,addStall,addPalm,addRock,addPillar],
    southasia: [addStall,addAwning,addBush,addStall,addAwning,addLamp,addBush,addRubble],
    parisian:  [addTree,addAwning,addBench,addLamp,addTree,addAwning,addBush,addTree],
    london:    [addAwning,addLamp,addBench,addTree,addAwning,addBush,addLamp,addTree],
    plaza:     [addAwning,addBench,addRock,addStall,addPillar,addAwning,addBush,addStall],
    skyscraper:[addAwning,addContainer,addBarrier,addSign,addFireHydrant,addAwning,addRock,addContainer],
    tropical:  [addPalm,addBush,addCanalPost,addPalm,addAwning,addStall,addBush,addPalm],
    strait:    [addTree,addAwning,addBench,addLamp,addRock,addTree,addBush,addLamp],
    neon:      [addAwning,addSign,addLamp,addFireHydrant,addAwning,addSign,addBarrier,addLamp],
    metro:     [addAwning,addFireHydrant,addBench,addContainer,addBarrier,addAwning,addSign,addBench],
  };
  const cycle = sets[kind]||sets.suburb;
  /* ağaç halkasında bina modeli (addAwning) çıkmasın — aynı yuvaya ağaç konur,
     çeşitlilik/yoğunluk aynı kalır, sadece "önce ağaç" kuralı bozulmaz */
  const cycleNoBuild = cycle.map(fn=>fn===addAwning?addTree:fn);

  /* ---- Çitin hemen dışından başlayan AĞAÇ HALKASI ----
     Sadece ağaç/çalı/kaya + hafif sokak detayı (lamba, bank, çit, heykel).
     Bina yok — "önce ağaçlar" kuralı burada.
     TREE_INNER=0: iç sınırı artık yarıçap değil, insideKeep() dikdörtgeni
     belirliyor. Böylece çitle ağaçlar arasında kenar boyunca boşluk kalmıyor. */
  const TREE_INNER = 0;
  /* dış sınır: çitin uzun kenarından ~3.6 birim ötesi. Bina halkasına ve duvara
     yer kalsın diye RWALL'a göre ayrıca sınırlanır. */
  let TREE_OUTER = Math.min(KEEP_X+3.6, RWALL-1.2);
  if(TREE_OUTER < KEEP_X+1.0) TREE_OUTER = KEEP_X+1.0;

  const nearCount = kind==='highway' ? 150 : 190;
  for(let i=0;i<nearCount;i++){
    const p=ringPoint(TREE_INNER,TREE_OUTER); if(!p) continue;
    cycleNoBuild[i%cycleNoBuild.length](p[0],p[1]);
  }
  const nearTrees=Math.round(300*theme.treeDensity);
  for(let i=0;i<nearTrees;i++){
    const p=ringPoint(TREE_INNER,TREE_OUTER); if(!p) continue;
    (Math.random()<0.8?addTree:addBush)(p[0],p[1]);
  }
  for(let i=0;i<150;i++){
    const p=ringPoint(TREE_INNER,TREE_OUTER); if(!p) continue;
    (Math.random()<0.5?addBush:addRock)(p[0],p[1]);
  }
  if(theme.fences){
    for(let i=0;i<18;i++){ const p=ringPoint(0,KEEP_X+0.8); if(p) addFence(p[0],p[1]); }
  }
  if(theme.statues){
    for(let i=0;i<6;i++){ const p=ringPoint(0,KEEP_X+1.2); if(p) addStatue(p[0],p[1]); }
  }
  /* ağaç halkasına serpiştirilmiş sokak lambaları */
  for(let i=0;i<20;i++){
    const p=ringPoint(TREE_INNER,TREE_OUTER); if(p) addLamp(p[0],p[1]);
  }

  /* ---- Ağaç halkasının dışından görüş sınırına kadar BİNA HALKASI ----
     Sadece bina/gökdelen — "sonra binalar" kuralı burada. Dışa doğru
     yoğunluk artıp DUVAR bandında (RWALL..R2) en yüksek/en sık hâle gelir. */
  const midBuild=Math.round(210*theme.buildDensity);
  for(let i=0;i<midBuild;i++){
    const p=ringPoint(TREE_OUTER,RWALL); if(!p) continue;
    const name=pick(Math.random()<0.3?SKYSCRAPER_NAMES:BUILDING_NAMES);
    placeModel(name,p[0],p[1],{scale:rnd(0.8,1.55),rotY:Math.round(rnd(0,3))*(Math.PI/2)});
  }
  for(let i=0;i<24;i++){
    const p=ringPoint(TREE_OUTER+0.5,RWALL-0.4); if(p) addLamp(p[0],p[1]);
  }

  /* ---- DUVAR: kuşağın dış kenarında yüksek gökdelen çemberi ----
     Görüşün bittiği yeri kapatır; arkasında boş zemin görünmesin diye
     sık ve yüksek dizilir. Sis de tam burada kapanıyor. */
  const wallCount=Math.round(46*Math.max(0.8,theme.buildDensity));
  for(let i=0;i<wallCount;i++){
    const a=(i/wallCount)*Math.PI*2 + rnd(-0.05,0.05);
    const d=RWALL+rnd(0.2,2.0);
    const x=Math.cos(a)*d, z=Math.sin(a)*d;
    const name=pick(Math.random()<0.6?SKYSCRAPER_NAMES:BUILDING_NAMES);
    const nativeH=BUILDING_HEIGHT[name]||2;
    const o=cloneModel(name);
    if(!o) continue;
    const targetH=rnd(4.5,9.5);
    const foot=rnd(1.1,2.0);
    o.scale.set(foot, targetH/nativeH, foot*rnd(0.8,1.2));
    o.position.set(x,0,z);
    o.rotation.y=a+Math.PI/2+rnd(-0.15,0.15);
    o.traverse(m=>{ if(m.isMesh){ m.castShadow=false; m.receiveShadow=false; } });
    R.stage.add(o);
  }
  /* duvarın önüne birkaç ağaç kümesi (yumuşatma) — asıl ağaçlar artık iç halkada */
  const wallTrees=Math.round(14*theme.treeDensity);
  for(let i=0;i<wallTrees;i++){
    const a=Math.random()*Math.PI*2;
    const d=RWALL+rnd(-0.6,1.0);
    const t=cloneModel(pick(theme.trees));
    if(!t) continue;
    t.scale.setScalar(rnd(1.4,2.4));
    t.position.set(Math.cos(a)*d,0,Math.sin(a)*d);
    t.rotation.y=rnd(0,Math.PI*2);
    t.traverse(m=>{ if(m.isMesh){ m.castShadow=false; m.receiveShadow=false; } });
    R.stage.add(t);
  }

  /* ---- zemin dolgusu: çim/taş/savaş izleri ----
     NOT: addScorchMark (koyu daire + üstünde 3 çakıl) bu setten çıkarıldı —
     haritanın her yerinde tekrar eden koyu "karaltı" lekeleri oluşturuyordu
     (kullanıcı geri bildirimi). */
  const lush=['suburb','highway','parisian','london','tropical','strait','oldtown'].includes(kind);
  const warKit=[addSandbags,addBarbedWire,addCrate];
  for(let i=0;i<240;i++){
    const [x,z]=outskirt(R1+1.7);
    const roll=Math.random();
    if(lush && roll<0.45) addGrassTuft(x,z);
    else if(roll<0.65) addPebbleCluster(x,z);
    else if(roll<0.85) warKit[Math.floor(Math.random()*warKit.length)](x,z);
  }
  for(let i=0;i<150;i++){
    const p=ringPoint(R1+1.7,RWALL); if(!p) continue;
    (Math.random()<0.55&&lush ? addGrassTuft : addPebbleCluster)(p[0],p[1]);
  }
}

const SKYLINE_MATS={};
function buildSkyline(backDir){
  const g=new THREE.Group();
  const invAngle = backDir ? Math.atan2(backDir.x,backDir.z) : null;
  const allNames=[...BUILDING_NAMES, ...SKYSCRAPER_NAMES];
  for(let i=0;i<46;i++){
    const a=(i/46)*Math.PI*2 + rnd(-0.05,0.05);
    const d=rnd(25,33);
    const targetH=rnd(2.6,8.5);
    const name = allNames.length ? allNames[Math.floor(Math.random()*allNames.length)] : null;
    let angDiff = invAngle!==null ? Math.abs(((a-invAngle+Math.PI)%(Math.PI*2))-Math.PI) : Math.PI;
    const inFront = angDiff < 0.9;
    if(name && MODEL_CACHE[name]){
      const b=cloneModel(name);
      const nativeH=BUILDING_HEIGHT[name]||2.2;
      const footScale=rnd(0.55,1.0);
      b.scale.set(footScale, targetH/nativeH, footScale);
      b.position.set(Math.sin(a)*d, -0.1, Math.cos(a)*d);
      b.rotation.y=a+rnd(-0.4,0.4);
      /* önde kalan binaları karartıp siluet hissi ver, geride kalanlar mesafeye göre soluklaşsın */
      const tint = inFront ? 0x2a2620 : (d>17 ? 0xaab0c0 : 0xffffff);
      /* renk tonunu birkaç kovaya yuvarla ve materyali paylaş — her mesh'e ayrı
         materyal klonlanırsa birleştirme çalışmaz, 46 ayrı çizim çağrısı kalır */
      b.traverse(o=>{
        if(o.isMesh){
          const key=o.material.uuid+'_'+tint;
          let mm=SKYLINE_MATS[key];
          if(!mm){
            mm=o.material.clone();
            mm.color = new THREE.Color(tint).multiply(o.material.color);
            if(inFront){ mm.emissive=new THREE.Color(0x000000); }
            SKYLINE_MATS[key]=mm;
          }
          o.material=mm;
          /* ufuk siluetleri gölge düşürmez — hem gereksiz hem savaş alanını karartır */
          o.castShadow=false; o.receiveShadow=false;
        }
      });
      g.add(b);
      if(inFront && Math.random()<0.5){
        const smoke=new THREE.Mesh(new THREE.SphereGeometry(rnd(0.8,1.6),7,7),
          new THREE.MeshStandardMaterial({color:PAL.smoke,transparent:true,opacity:rnd(0.15,0.3),roughness:1,depthWrite:false}));
        smoke.position.set(b.position.x+rnd(-0.5,0.5), targetH+rnd(0.8,2.2), b.position.z+rnd(-0.5,0.5));
        g.add(smoke);
      }
    } else {
      /* GLB henüz yüklenmediyse eski kutu-siluet yöntemine düş */
      const w=rnd(1.2,3.0);
      const col = inFront ? 0x231f1c : (d>17 ? PAL.buildingFar : PAL.building);
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,targetH,w*rnd(0.7,1.2)), mat(col,0.99));
      m.position.set(Math.sin(a)*d, targetH/2-0.1, Math.cos(a)*d);
      m.rotation.y=a+rnd(-0.4,0.4);
      g.add(m);
    }
  }
  R.stage.add(g);
}

/* ---------------- Abbadon elit birimler (detaylı modeller) ---------------- */
/* ---------------- düşman görselleri ----------------
   İki katmanlı sistem:
   1) ENEMIES[key].model bir MONSTER_CACHE anahtarına işaret ediyorsa (b47),
      gerçek rigli/animasyonlu Quaternius canavarı klonlanıp kullanılır —
      hareket klibi MONSTER_MOVE_CLIP'ten, ölüm 'Death' klibinden gelir.
   2) model alanı yoksa (ya da o canavar henüz yüklenmediyse) eski basit
      yer tutucu mesh'e (silindir gövde + parlayan göz) düşülür — oyun
      hiçbir zaman çökmez, sadece görsel eksik kalır. */
const PLACEHOLDER_MATCACHE={};
function placeholderMat(kind){
  if(!PLACEHOLDER_MATCACHE[kind]){
    const palette={ /* ornek:0x6a4b8f, */ };
    PLACEHOLDER_MATCACHE[kind]=new THREE.MeshStandardMaterial({
      color: palette[kind] || 0x6a4b8f, roughness:0.75, metalness:0.1,
      emissive:0x1a0f2a, emissiveIntensity:0.3
    });
  }
  return PLACEHOLDER_MATCACHE[kind];
}
function buildPlaceholderEnemy(def){
  const g=new THREE.Group();
  const s=def.size;
  const bodyMat=placeholderMat(def.kind);
  const glow=new THREE.MeshStandardMaterial({color:PAL.abdGlow,emissive:PAL.abd,emissiveIntensity:1.3,roughness:0.4});
  /* r128'de CapsuleGeometry yok (r142+ ile geldi) — silindir gövde + küre başla
     kapsül görünümü taklit ediliyor. */
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(s*0.42,s*0.42,s*0.85,10), bodyMat);
  torso.position.y=s*0.9; torso.castShadow=true; g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(s*0.42,10,8), bodyMat);
  head.position.y=s*1.42; head.castShadow=true; g.add(head);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(s*0.14,8,8), glow);
  eye.position.set(0, s*1.55, s*0.32);
  g.add(eye);
  if(def.boss){
    const crown=new THREE.Mesh(new THREE.ConeGeometry(s*0.3,s*0.4,6), glow);
    crown.position.set(0, s*2.05, 0);
    g.add(crown);
  }
  if(def.fly) g.userData.flyBob=true;
  return g;
}
function buildEnemyMesh(def){
  const mk = def.model && MONSTER_CACHE[def.model];
  if(mk){
    const g=new THREE.Group();
    const model=cloneSkinnedGLTF(mk.scene);
    model.scale.setScalar(def.size / mk.height);
    g.add(model);
    const mixer=new THREE.AnimationMixer(model);
    const moveClipName = MONSTER_MOVE_CLIP[def.model] || 'Walk';
    const moveClip = mk.anims[moveClipName];
    if(moveClip){
      const action=mixer.clipAction(moveClip);
      action.play();
      g.userData.moveAction=action;
    }
    g.userData.mixer=mixer;
    g.userData.monsterKey=def.model;
    g.userData.yawOffset=0;
    return g;
  }
  /* model tanımlanmamış/yüklenmemiş — yer tutucuya düş */
  return buildPlaceholderEnemy(def);
}

/* Turret Pack'teki tüm modeller tek tip bakır/pas renginde geliyor. Bu fonksiyon
   her mesh'in orijinal AÇIKLIĞINI (HSL'in L'i) koruyup sadece tonunu (H/S)
   sınıfın rengine kaydırıyor — böylece modelin üstündeki ışık/gölge detayı
   (parlak üst yüzey, koyu alt/oluk kısımları) kaybolmadan, sadece rengi değişiyor.
   Malzemeler klonlanmış meshlere yeni birer materyal atadığı için MODEL_CACHE'teki
   orijinali ya da başka yerleştirilmiş kulelerin materyalini etkilemiyor. */
/* Modelin içindeki "namlu/silah" alt parçasını bulur — Quaternius Turret Pack
   düzenli isimlendiriyor: {İsim}_Gun (çoğu sınıf) ya da {İsim}_Top (Teleporter).
   Bulunursa geri tepme ve gatling dönüşü bu parça üstünde uygulanır, tüm model
   değil — namlu tek başına "kıpırdıyor" gibi görünür. */
function findBarrelPart(root){
  let found=null;
  root.traverse(o=>{
    if(found || !o.name) return;
    if(/_Gun$/.test(o.name) || /_Top$/.test(o.name)) found=o;
  });
  return found;
}

/* Her silah sınıfının kendi MERMİ TİPİ ve rengi. shot alanı hangi görselin
   kullanılacağını belirler:
     bullet — dümdüz giden, iz bırakan küçük mermi (hızlı)
     ball   — hafif kavisli, ağır gülle + çarpma patlaması
     bolt   — zikzak yıldırım/kıvılcım, düşmandan düşmana sıçrar
     orb    — yavaşça süzülen, nabız atan enerji küresi + darbe halkası
     flak   — namlusu YUKARI bakan uçaksavar: kavisli çıkıp havada patlar
     lob    — (şu an kullanılmıyor; gerçek dik namlulu havan gerekirse hazır)
     rail   — anlık, kalın, bir süre havada kalan keskin nişancı ışını
   NOT: mermi tipleri modellerin GERÇEK namlu yönü ölçülerek atandı — namlusu
   yatay olan silah düz atar, sadece dikey namlulu olan kavis yapar. */
const WEAPON_FX = {
  gun:        { shot:'bullet', tracer:0xfff3c4, muzzle:0xffe9a8, impact:0xffcf7a, gatling:true },
  cannon:     { shot:'ball',   tracer:0xffb366, muzzle:0xffcf8a, impact:0xff9a4a, shell:0x2e2a26 },
  laser:      { shot:'bolt',   tracer:0x6fe8ff, muzzle:0x9df3ff, impact:0x6fe8ff },
  teleporter: { shot:'orb',    tracer:0xc78bff, muzzle:0xe0baff, impact:0xc78bff },
  upwards:    { shot:'flak',   tracer:0x9fffb0, muzzle:0xd4ffe0, impact:0x9fffb0 },
  bomber:     { shot:'ball',   tracer:0xff8a4a, muzzle:0xffbf8a, impact:0xff8a4a, shell:0x3a2418 },
  gearcannon: { shot:'ball',   tracer:0x9fd6c9, muzzle:0xc9f0e6, impact:0x9fd6c9, shell:0x4a5a52 },
  long:       { shot:'rail',   tracer:0xffffff, muzzle:0xffffff, impact:0xd8e8ff },
};

function tintWeaponModel(root, style){
  const st = (typeof style==='number') ? {color:style} : (style||{});
  const target=new THREE.Color(st.color!==undefined?st.color:0x808080), thsl={};
  target.getHSL(thsl);
  /* 1. geçiş: modelin ortalama açıklığını bul. Quaternius modelleri soluk/gri
     tonlu olduğu için orijinal açıklığı olduğu gibi korumak rengi bastırıyordu —
     bunun yerine açıklığı HEDEF RENGİN açıklığına yeniden merkezliyoruz, gölge
     detayı ise göreli olarak korunuyor (contrast). */
  let sum=0, n=0;
  root.traverse(o=>{ if(o.isMesh&&o.material&&o.material.color){ const h={}; o.material.color.getHSL(h); sum+=h.l; n++; } });
  const meanL = n ? sum/n : 0.5;
  const contrast = st.contrast!==undefined?st.contrast:0.85;
  const lBias = st.lBias!==undefined?st.lBias:-0.06;
  const S = Math.max(thsl.s, st.satMin!==undefined?st.satMin:0.78);
  root.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    const src=o.material;
    const srcColor = src.color ? src.color : new THREE.Color(0xffffff);
    const hsl={}; srcColor.getHSL(hsl);
    const newL = Math.max(0.10, Math.min(0.92, thsl.l + (hsl.l-meanL)*contrast + lBias));
    const newColor=new THREE.Color().setHSL(thsl.h, S, newL);
    o.material=new THREE.MeshStandardMaterial({
      color:newColor,
      roughness: st.rough!==undefined?st.rough:0.5,
      metalness: st.metal!==undefined?st.metal:0.35,
      emissive: new THREE.Color(st.emissive||0x000000),
      emissiveIntensity: st.emissive?0.85:0,
    });
  });
  return root;
}

/* Tüm silah sınıfları TEK bir ortak renkte — gelecekte gelecek kostüm/skin
   sistemi için nötr bir "fabrika çıkışı" tabanı. Sınıfa özgü renk yok artık,
   tek yerden değiştirilebilsin diye tek sabit. */


function buildUnitMesh(key){
  const u=UNITS[key], g=new THREE.Group();
  const td=weaponTierData(key);

  /* ortak taban/kaide — 8 sınıf da aynı mount üstünde durur, görsel bütünlük için
     (Quaternius Turret Pack'in kendi Base.blend'i) */
  const baseModel=cloneModel('weapon-base');
  if(baseModel){
    const _st=WEAPON_STYLE[key]||{color:0x808a96};
    tintWeaponModel(baseModel, {color:_st.color, lBias:-0.20, contrast:0.6, rough:0.62, metal:0.4});
    baseModel.position.set(0,0.0436,0);
    baseModel.scale.setScalar(0.6);
    g.add(baseModel);
  }

  const weaponModel=cloneModel(td.model);
  if(weaponModel){
    tintWeaponModel(weaponModel, WEAPON_STYLE[key] || {color:0x808a96});
    weaponModel.position.set(td.offX,td.offY,td.offZ);
    const holder=new THREE.Group();
    holder.add(weaponModel);
    holder.scale.setScalar(td.scale);
    holder.position.y=0.02;
    g.add(holder);
    g.userData.turret=holder;   /* selectUnit / ileride namlu döndürme için referans */
    const barrel=findBarrelPart(weaponModel);
    if(barrel){
      barrel.userData.baseScale=barrel.scale.clone();
      g.userData.barrel=barrel;   /* geri tepme + gatling dönüşü bu parça üstünde */
      /* ATEŞ ÇIKIŞ NOKTASI: namlu parçasının PIVOT'u (origin) montaj merkezinde
         duruyor — oradan ateş edilirse mermi silahın tepesinden/ortasından
         fırlıyormuş gibi görünür (özellikle çift namlulularda). Bunun yerine
         namlu geometrisinin sınır kutusunu alıp ÖN-ORTA noktasını kullanıyoruz:
         X ve Y'de namlu(lar)ın ortası, Z'de en ileri uç. Kule hedefe +Z ekseniyle
         döndüğü için (stepUnits'teki atan2(dx,dz)) ileri yön = +Z. */
      g.updateMatrixWorld(true);
      const bb=new THREE.Box3().setFromObject(barrel);
      if(isFinite(bb.min.x) && bb.max.z>bb.min.z){
        g.userData.muzzle=new THREE.Vector3(
          (bb.min.x+bb.max.x)/2,
          (bb.min.y+bb.max.y)/2,
          bb.max.z+0.03            /* ağzın hemen önü, geometrinin içinde kalmasın */
        );
      }
    }
  } else {
    /* model henüz yüklenmediyse (yavaş bağlantı) basit bir yer tutucu koy —
       oyun asla boş/görünmez bir mevzi göstermesin */
    const ph=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.28,0.5,8), mat(u.color,0.7,0.15));
    ph.position.y=0.3; ph.castShadow=true; g.add(ph);
  }
  return g;
}

/* ---------------- CANLI SİLAH İKONLARI (b51) ----------------
   Eski sistem: her kademe için Blender'da sabit bir kamerayla tek seferlik
   PNG render edilip assets.js'e gömülmüştü — model boyu/oranı sınıftan sınıfa
   çok değiştiği için sabit kadraj bazılarında namlu/gövdeyi kadraj dışında
   bırakıyordu ("sığmamış" görünüm). Yeni sistem: gerçek modeli (buildUnitMesh
   ile birebir aynı, taban+namlu) küçük bir offscreen sahnede kurup sınırlayıcı
   KÜREYE göre kamerayı otomatik uzaklaştırıyor — hangi kademe/sınıf olursa
   olsun kırpılma matematiksel olarak imkânsız. Sonuç PNG data-url olarak
   ICON_CACHE'te tutulur (kademe değişince anahtar değişir, yeniden üretilir).
   MODEL_CACHE henüz dolmadıysa (ilk birkaç kare) null döner, çağıran taraf
   eski davranışa (renkli daire) düşer — hiçbir zaman çökmez. */
let _iconRenderer=null, _iconCanvas=null;
const ICON_SIZE=160;
function ensureIconRenderer(){
  if(_iconRenderer) return;
  _iconCanvas=document.createElement('canvas');
  _iconCanvas.width=ICON_SIZE; _iconCanvas.height=ICON_SIZE;
  _iconRenderer=new THREE.WebGLRenderer({canvas:_iconCanvas, alpha:true, antialias:true, preserveDrawingBuffer:true});
  _iconRenderer.setPixelRatio(1);
  _iconRenderer.setSize(ICON_SIZE,ICON_SIZE,false);
  _iconRenderer.outputEncoding=THREE.sRGBEncoding;
  _iconRenderer.toneMapping=THREE.ACESFilmicToneMapping;
  _iconRenderer.toneMappingExposure=1.15;
}
const ICON_CACHE={};
function renderUnitIcon(key){
  const cacheKey=key+'_t'+weaponTier(key);
  if(ICON_CACHE[cacheKey]) return ICON_CACHE[cacheKey];
  if(!window.THREE || !MODEL_CACHE['weapon-base'] || !MODEL_CACHE[weaponTierData(key).model]) return null;
  try{
    ensureIconRenderer();
    const scene=new THREE.Scene();
    /* ana sahnedekine benzer sıcak 3 noktalı ışık — ikon oyundaki görünümle tutarlı olsun */
    scene.add(new THREE.HemisphereLight(0xd4d0ac, 0x33401f, 1.05));
    const key1=new THREE.DirectionalLight(0xfff0cf, 1.6); key1.position.set(-2.2,2.6,2.0); scene.add(key1);
    const fill=new THREE.DirectionalLight(0x8fa2c2, 0.5); fill.position.set(1.6,1.0,-1.4); scene.add(fill);

    const group=buildUnitMesh(key);
    scene.add(group);
    group.updateMatrixWorld(true);

    const box=new THREE.Box3().setFromObject(group);
    if(!isFinite(box.min.x)) return null;
    const sphere=box.getBoundingSphere(new THREE.Sphere());
    const fovDeg=30;
    const dist=(sphere.radius / Math.sin((fovDeg/2)*Math.PI/180)) * 1.18; /* %18 pay — kırpılma imkansız */
    const camera=new THREE.PerspectiveCamera(fovDeg, 1, 0.01, dist*4);
    const dir=new THREE.Vector3(0.85,1.05,1.25).normalize();
    camera.position.copy(sphere.center.clone().add(dir.multiplyScalar(dist)));
    camera.lookAt(sphere.center);

    _iconRenderer.setClearColor(0x000000,0);
    _iconRenderer.render(scene, camera);

    ICON_CACHE[cacheKey]=url;

  }catch(err){ console.warn('ikon render hatası:',key,err); return null; }
}

const SOLDIER_ICON_CACHE={};
function renderSoldierIcon(name){
  if(SOLDIER_ICON_CACHE[name]) return SOLDIER_ICON_CACHE[name];
  const mk=SOLDIER_CACHE[name];
  if(!window.THREE || !mk) return null;
  try{
    ensureIconRenderer();
    const scene=new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xd4d0ac, 0x33401f, 1.05));
    const key1=new THREE.DirectionalLight(0xfff0cf, 1.6); key1.position.set(-2.2,2.6,2.0); scene.add(key1);
    const fill=new THREE.DirectionalLight(0x8fa2c2, 0.5); fill.position.set(1.6,1.0,-1.4); scene.add(fill);

    const model=cloneSkinnedGLTF(mk.scene);
    model.scale.setScalar(0.62/mk.height);
    const idle=mk.anims['Idle'];
    if(idle){
      const mixer=new THREE.AnimationMixer(model);
      mixer.clipAction(idle).play();
      mixer.update(0.4); /* durağan bir poz için biraz ileri sar */
    }
    scene.add(model);
    model.updateMatrixWorld(true);

    const box=new THREE.Box3().setFromObject(model);
    if(!isFinite(box.min.x)) return null;
    const sphere=box.getBoundingSphere(new THREE.Sphere());
    const fovDeg=30;
    const dist=(sphere.radius / Math.sin((fovDeg/2)*Math.PI/180)) * 1.18;
    const camera=new THREE.PerspectiveCamera(fovDeg, 1, 0.01, dist*4);
    const dir=new THREE.Vector3(0.85,1.05,1.25).normalize();
    camera.position.copy(sphere.center.clone().add(dir.multiplyScalar(dist)));
    camera.lookAt(sphere.center);

    _iconRenderer.setClearColor(0x000000,0);
    _iconRenderer.render(scene, camera);
    const url=_iconCanvas.toDataURL('image/png');
    SOLDIER_ICON_CACHE[name]=url;
    return url;
  }catch(err){ console.warn('asker ikon render hatası:',name,err); return null; }
}

/* ---------------- battle lifecycle ---------------- */
/* Savaştan her çıkışta MUTLAKA çağrılmalı — aksi halde render döngüsü B=null
   olsa bile arka planda sonsuza kadar çalışmaya devam eder (görünmeyen canvas'ı
   her frame render etmeye devam eder), bu da diğer ekranları (özellikle Cepheler
   sekmesini) fark edilir şekilde yavaşlatır. */
function exitBattle(){
  if(R && R.renderer) R.renderer.setAnimationLoop(null);
  B=null;
}

function startBattle(idx){
  const map=MAPS[idx];
  stopMusic();
  setGrid(map);            /* ızgara boyutunu haritadan al — g2w/expandPath buna bağlı */
  initRenderer();
  /* initRenderer() sadece İLK savaşta setAnimationLoop çağırıyor (if(R) return;
     koruması var). Döngü savaştan çıkışta durdurulduğu için, her yeni savaşta
     burada açıkça yeniden başlatmak gerekiyor — aksi halde ikinci savaş hiç
     render edilmez. */
  R.renderer.setAnimationLoop(loop);
  show('battleScreen');
  resizeR();

  const wayList = map.ways ? map.ways : [map.way];
  B={ map, idx, cells:[], routes:[],
      gold:map.gold, shelter:map.shelter, shelterMax:map.shelter,
      wave:-1, wt:0, queue:[], enemies:[], units:[], shots:[],
      picking:null, selected:null, ring:null, paused:false, speed:1, over:false,
      tiles:[], pathPts:[], pathLen:0, elapsed:0, killed:0,
      squads:[], reinforceUses:REINFORCE.usesPerBattle, deployPicking:false, deployMarkers:[] };

  /* her rota ayrı hesaplanır; hücreler birleşim kümesi olarak toplanır */
  const seen=new Set();
  const addC=(c,r)=>{ const k=c+','+r; if(!seen.has(k)){ seen.add(k); B.cells.push({c,r}); } };
  /* görsel maske varsa o hücreler de yol sayılır (üzerine kule kurulamaz) */
  if(map.mask) map.mask.forEach((line,r)=>{
    for(let c=0;c<line.length;c++) if(line[c]==='#') addC(c,r);
  });
  B.routes = wayList.map(w=>{
    const cells=expandPath(w);
    const pts=cells.map(p=>g2w(p.c,p.r));
    let len=0;
    for(let i=1;i<pts.length;i++) len+=pts[i].distanceTo(pts[i-1]);
    cells.forEach(c=>addC(c.c,c.r));
    return {cells, pts, len};
  });
  /* geriye dönük uyumluluk: tekil rota bekleyen yerler ilk rotayı görür */
  B.pathPts=B.routes[0].pts;
  B.pathLen=B.routes[0].len;

  fitCameraToGrid();
  buildStage(map);
  renderHUD();
  briefing(map, ()=>{ nextWave(); });
}

function briefing(map,onGo){
  const ov=el(`<div class="overlay">
    <div class="sheet">
      <div class="eyebrow">Cephe ${String(B.idx+1).padStart(2,'0')} · Dünya 01</div>
      <h2>${map.name}</h2>
      <p>${map.story}</p>
      <div class="rows">
        <div class="row-i"><span>Başlangıç kaynağı</span><b class="num">${map.gold}</b></div>
        <div class="row-i"><span>Sığınak dayanıklılığı</span><b class="num">${map.shelter}</b></div>
        <div class="row-i"><span>Gelen dalga</span><b class="num">${map.waves.length}</b></div>
      </div>
      ${map.reward?`<div class="reward"><div class="rl">Zafer ödülü</div><div class="rn">${map.reward.title}</div><div class="rd">${map.bossLine||''}</div></div>`:''}
      <div class="acts"><button class="btn quiet" id="back">Geri</button><button class="btn ember" id="go">Mevzilen</button></div>
    </div>
  </div>`);
  ov.querySelector('#go').addEventListener('click',()=>{ ov.remove(); onGo(); });

  document.getElementById('battleScreen').appendChild(ov);
}

function nextWave(){
  B.wave++;
  if(B.wave>=B.map.waves.length){ B.queue=[]; return; }
  const q=[]; let t=1.0;
  B.map.waves[B.wave].forEach(([type,n,gap])=>{
    for(let i=0;i<n;i++){ q.push({type,time:t}); t+=gap; }
  });
  q.sort((a,b)=>a.time-b.time);
  B.queue=q; B.wt=0;
  playSfx('wave_start');
  waveBanner(`Dalga ${B.wave+1} / ${B.map.waves.length}`);
  syncHUD();
}
function waveBanner(txt){
  let t=document.querySelector('.banner');
  if(!t){ t=el(`<div class="banner"></div>`); document.getElementById('battleScreen').appendChild(t); }
  t.textContent=txt; t.classList.add('show');
  clearTimeout(waveBanner._t); waveBanner._t=setTimeout(()=>t.classList.remove('show'),1900);
}

function spawnEnemy(type){
  const def=Object.assign({key:type},ENEMIES[type]);
  const mesh=buildEnemyMesh(def);
  /* rotalar arasında sırayla dağıt — her iki kol da dolu kalsın */
  const routeIdx = B.routes.length>1 ? (B.routeTurn=(B.routeTurn||0)+1)%B.routes.length : 0;
  const p=B.routes[routeIdx].pts[0];
  mesh.position.set(p.x, def.fly?0.95:0, p.z);
  mesh.scale.setScalar(0.01);
  R.stage.add(mesh);
  const bar=makeBar();
  bar.position.y = (mesh.userData.charH ? mesh.userData.charH+0.22 : def.size*2.4) + (def.fly?1.0:0);
  mesh.add(bar);
  /* karadelikten doğuş: düşmanın çıktığı geçit kısa süre parlasın */
  const myGate = (B.gates && B.gates.length)
    ? B.gates.reduce((best,g)=>{
        const d=(g.position.x-p.x)*(g.position.x-p.x)+(g.position.z-p.z)*(g.position.z-p.z);
        return (!best || d<best.d) ? {g,d} : best;
      }, null)
    : null;
  if(myGate && myGate.g.userData.light) myGate.g.userData.light.intensity=5.5;
  B.enemies.push({def,mesh,bar,hp:def.hp,hpMax:def.hp,d:0,dying:0,dead:false,slow:0,birth:0.45,route:routeIdx});
}

function pathPos(d, routeIdx){
  const pts = (B.routes && B.routes[routeIdx||0]) ? B.routes[routeIdx||0].pts : B.pathPts;
  let rem=d;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], L=a.distanceTo(b);
    if(rem<=L){ return {p:new THREE.Vector3().lerpVectors(a,b,L?rem/L:0), dir:new THREE.Vector3().subVectors(b,a).normalize()}; }
    rem-=L;
  }
  const n=pts.length;
  return {p:pts[n-1].clone(), dir:new THREE.Vector3().subVectors(pts[n-1],pts[n-2]).normalize()};
}

function placeUnit(td,key){
  const u=UNITS[key];
  if(B.gold<u.cost){ toast('Yetersiz kaynak.'); return; }
  B.gold-=u.cost;
  const mesh=buildUnitMesh(key);
  const w=g2w(td.c,td.r);
  mesh.position.set(w.x,0,w.z);
  R.stage.add(mesh);
  const unit={key,def:u,mesh,cd:0.35,lvl:weaponTier(key),dmg:unitDmg(key),td,
              range:u.range,angle:0,recoilT:0,target:null};
  td.unit=unit;
  B.units.push(unit);
  B.picking=null;
  updatePlacementMarkers();
  clearSelection();
  renderHUD();
}
function updatePlacementMarkers(){
  if(!B) return;
  if(B.placementMarkers) B.placementMarkers.forEach(m=>R.stage.remove(m));
  B.placementMarkers=[];
  if(!B.picking) return;
  B.tiles.forEach(t=>{
    const d=t.userData;
    if(d.path||d.blocked||d.unit) return;
    const g=new THREE.Group();
    /* eskiden iki dolu (neredeyse opak) kare vardı — düz zeminde sorun değildi
       ama yeni dokulu zeminin üstünü tamamen örtüp bir "yama" gibi göze
       batıyordu (kullanıcı geri bildirimi). Artık hafif bir dolgu + belirgin
       bir çerçeve: doku altından görünmeye devam ediyor, kare yine de net
       okunuyor. */
    const sq=0.84;
    const fill=new THREE.Mesh(new THREE.PlaneGeometry(sq,sq),
      new THREE.MeshBasicMaterial({color:0xFFD166,transparent:true,opacity:0.22,depthWrite:false,side:THREE.DoubleSide}));
    fill.rotation.x=-Math.PI/2;
    g.add(fill);
    const half=sq/2;
    const pts=[
      new THREE.Vector3(-half,0.004,-half), new THREE.Vector3(half,0.004,-half),
      new THREE.Vector3(half,0.004,half),   new THREE.Vector3(-half,0.004,half),
    ];
    const border=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0xFFE9A8,transparent:true,opacity:0.95}));
    g.add(border);
    g.position.set(t.position.x,0.012,t.position.z);
    R.stage.add(g);
    B.placementMarkers.push(g);
  });
}

}

/* ---------------- combat ---------------- */
/* Ateşin çıkacağı DÜNYA noktası: namlu ağzı (buildUnitMesh'te hesaplanan yerel
   nokta) kulenin o anki dönüşüyle birlikte dünyaya çevrilir — kule hedefe
   döndükçe çıkış noktası da namlunun ucunda kalır. */
function muzzleWorld(unit){
  const mz=unit.mesh.userData.muzzle;
  if(mz) return unit.mesh.localToWorld(mz.clone());
  const p=unit.mesh.position.clone(); p.y+=0.5; return p;
}

function fire(unit,target){
  const u=unit.def;
  const fx=WEAPON_FX[unit.key] || WEAPON_FX.gun;
  playSfx('fire_'+unit.key); /* o sınıfın sesi henüz eklenmediyse sessizce atlanır */
  const from=muzzleWorld(unit);
  muzzleFlash(from, fx.muzzle);
  unit.recoilT=0.09;
  const to=target.mesh.position.clone().setY(target.def.fly?1.0:0.35);
  const dist=from.distanceTo(to);

  /* HAVAN: hasarı çarpma anında, alan olarak verir (mevcut denge korunuyor) */
  if(fx.shot==='lob'){
    B.shots.push({type:'lob',from,target,t:0,dur:0.55,dmg:unit.dmg,splash:u.splash,
                  color:fx.shell||0x3a3128, impactColor:fx.impact});
    return;
  }
  /* YILDIRIM: düşmandan düşmana sıçrar, zırhı yok sayar */
  if(fx.shot==='bolt'){
    chainBolt(unit,target,fx.tracer);
    return;
  }
  /* ANLIK IŞIN */
  if(fx.shot==='rail'){
    railBeam(from,to,fx.tracer);
    damage(target, unit.dmg, u.splash);
    return;
  }
  /* Kalan tipler: mermi GÖRSEL olarak uçar, hasar atış anında uygulanır —
     böylece yükseltme sisteminin hasar matematiği birebir korunur, uçuş
     süresi yüzünden sessizce DPS kaybı yaşanmaz. */
  damage(target, unit.dmg, u.splash);
  if(fx.shot==='bullet'){
    B.shots.push({type:'proj',style:'bullet',from,to,t:0,dur:Math.max(0.05,dist/26),
                  color:fx.tracer,impact:fx.impact});
  } else if(fx.shot==='ball'){
    /* namlu yatay (ölçüldü) — gülle kavis yapmadan düz gider. Alan hasarı olan
       sınıflarda (havan/dişli) çarpma patlaması menzile göre büyür. */
    B.shots.push({type:'proj',style:'ball',from,to,t:0,dur:Math.max(0.13,dist/9),
                  color:fx.shell,impact:fx.impact,boom:u.splash>0?u.splash*0.7:0.3});
  } else if(fx.shot==='orb'){
    B.shots.push({type:'proj',style:'orb',from,to,t:0,dur:Math.max(0.16,dist/6.5),
                  color:fx.tracer,impact:fx.impact});
  } else if(fx.shot==='flak'){
    /* GÜDÜMLÜ FÜZE: silahtan ÇOK YAVAŞ çıkar (curSpd düşük başlar), hedefi
       canlı takip ederek döner, sonra yüksek bir ivmeyle (accel) hızlanır.
       Yavaş çıkış küçük bir dönüş yarıçapı sağlıyor — yoksa sabit yüksek
       hızda sınırlı dönüş açısı geniş bir daire çizip "dolanma" hissi
       veriyordu. Hasar diğer tüm tiplerde olduğu gibi ateş anında zaten
       uygulandı; bu tamamen görsel bir takip. */
    B.shots.push({type:'missile', from:from.clone(), target, lastT:to.clone(),
                  pos:from.clone(), vel:new THREE.Vector3(0,1,0.001),
                  curSpd:0.5, maxSpd:8.2+Math.min(3,dist*0.35), accel:13,
                  turn:9.5, life:0, maxLife:2.6,
                  color:fx.tracer, impact:fx.impact, obj:null});
  }
}

/* mermi görselini üretir — her tip belirgin şekilde farklı okunmalı */
function makeProjectile(style,color){
  if(style==='bullet'){
    const g=new THREE.Group();
    const core=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.26,6),
      new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.95,depthWrite:false}));
    core.rotation.x=Math.PI/2;   /* uzun ekseni +Z'ye çevir, lookAt ile yönlensin */
    g.add(core);
    return g;
  }
  if(style==='ball'){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.1,10,10), mat(color||0x2e2a26,0.75,0.3)));
    return g;
  }
  if(style==='orb'){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.085,12,12),
      new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.95,depthWrite:false})));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.17,12,12),
      new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.28,depthWrite:false})));
    return g;
  }
  if(style==='missile'){
    const g=new THREE.Group();
    const bmat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.95,depthWrite:false});
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,0.22,6), bmat);
    body.rotation.x=Math.PI/2;
    g.add(body);
    const nose=new THREE.Mesh(new THREE.ConeGeometry(0.026,0.09,6), bmat);
    nose.rotation.x=Math.PI/2; nose.position.z=0.155;
    g.add(nose);
    return g;
  }
  /* flak */
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.055,8,8),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.95,depthWrite:false})));
  return g;
}

/* --- vuruş efektleri --- */
function sparkFx(pos,color){

function pulseFx(pos,color){
  const m=new THREE.Mesh(new THREE.RingGeometry(0.07,0.17,20),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.95,side:THREE.DoubleSide,depthWrite:false}));
  m.position.copy(pos); m.rotation.x=-Math.PI/2; R.stage.add(m);

    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.8,depthWrite:false}));
  core.position.copy(pos); R.stage.add(core);
  B.shots.push({type:'fx',obj:core,ttl:0.18,max:0.18,grow:true});
}
function burstFx(pos,color){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,10),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.85,depthWrite:false}));

  B.shots.push({type:'fx',obj:m,ttl:0.22,max:0.22,grow:true});
  for(let i=0;i<4;i++){
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.035,6,6),

    p.position.copy(pos);
    p.userData.vel=new THREE.Vector3(rnd(-1,1),rnd(0.2,1),rnd(-1,1)).normalize().multiplyScalar(rnd(1.2,2.4));
    R.stage.add(p);
    B.shots.push({type:'fx',obj:p,ttl:0.26,max:0.26,drift:true});
  }
}
/* zikzak yıldırım — düz çizgi yerine kırık hatlı, titreşen bir kıvılcım */
function lightningFx(a,b,color){
  const segs=9, pts=[];
  const dir=new THREE.Vector3().subVectors(b,a);
  const len=dir.length();
  const side=new THREE.Vector3(-dir.z,0,dir.x).normalize();
  const up=new THREE.Vector3(0,1,0);
  const j=Math.max(0.05,len*0.11);
  for(let i=0;i<=segs;i++){
    const t=i/segs, p=new THREE.Vector3().lerpVectors(a,b,t);
    if(i>0&&i<segs){ p.addScaledVector(side,rnd(-j,j)); p.addScaledVector(up,rnd(-j*0.7,j*0.7)); }
    pts.push(p);
  }
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color,transparent:true,opacity:1}));
  R.stage.add(line);
  B.shots.push({type:'fx',obj:line,ttl:0.17,max:0.17,flicker:true});
  /* birkaç kısa dal — tek çizgi yerine gerçek bir kıvılcım hissi */
  for(let d=0;d<2;d++){
    const i=1+Math.floor(Math.random()*(segs-2));
    const base=pts[i];
    const tip=base.clone().addScaledVector(side,rnd(-j*1.6,j*1.6)).addScaledVector(up,rnd(-j,j*1.4));
    const br=new THREE.Line(new THREE.BufferGeometry().setFromPoints([base,tip]),
      new THREE.LineBasicMaterial({color,transparent:true,opacity:0.8}));
    R.stage.add(br);
    B.shots.push({type:'fx',obj:br,ttl:0.12,max:0.12,flicker:true});
  }
}
/* kalın, bir süre havada kalan keskin nişancı ışını (Line 1px olduğu için silindir) */
function railBeam(a,b,color){
  const dir=new THREE.Vector3().subVectors(b,a);
  const len=dir.length();
  if(len<0.01) return;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.032,len,6),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.95,depthWrite:false}));
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  R.stage.add(m);
  B.shots.push({type:'fx',obj:m,ttl:0.24,max:0.24});
}
function chainBolt(unit,target,color){
  let cur=target, hits=0;
  const seen=new Set();
  let from=muzzleWorld(unit);
  while(cur && hits<3){
    seen.add(cur);
    const to=cur.mesh.position.clone().setY(0.4);
    lightningFx(from, to, color);
    sparkFx(to, color);
    damage(cur, unit.dmg*(1-hits*0.2), 0, true);
    from=to;
    let nxt=null,bd=1.7;
    for(const e of B.enemies){
      if(seen.has(e)||e.dying>0||e.dead) continue;
      const d=e.mesh.position.distanceTo(from);
      if(d<bd){ bd=d; nxt=e; }
    }
    cur=nxt; hits++;
  }
}
function damage(en,dmg,splash,ignoreArmor){
  if(!en||en.dead||en.dying>0) return;
  const arm = ignoreArmor?0:(en.def.armor||0);
  const real=Math.max(1,dmg-arm);
  en.hp-=real;
  if(en.hp<=0){ kill(en); }
  if(splash>0){
    for(const o of B.enemies){
      if(o===en||o.dead||o.dying>0) continue;
      if(o.mesh.position.distanceTo(en.mesh.position)<=splash){
        o.hp-=Math.max(1,dmg*0.55-(o.def.armor||0));
        if(o.hp<=0) kill(o);
      }
    }
  }
}
function kill(en){
  if(en.dying>0||en.dead) return;
  playSfx(en.def.boss ? 'death_boss' : 'death_generic');
  const ud=en.mesh && en.mesh.userData;
  const mk = ud && ud.monsterKey && MONSTER_CACHE[ud.monsterKey];
  const deathClip = mk && mk.anims['Death'];
  if(ud && ud.mixer && deathClip){
    /* gerçek modelde ölüm klibi oynar, süre klibe göre ayarlanır */
    if(ud.moveAction) ud.moveAction.fadeOut(0.1);
    const da=ud.mixer.clipAction(deathClip);
    da.reset(); da.setLoop(THREE.LoopOnce,1); da.clampWhenFinished=true;
    da.fadeIn(0.1).play();
    en.dying=Math.min(1.2, deathClip.duration||0.8);
  } else {
    en.dying=0.3; /* yer tutucu için: küçülüp dönerek yok olma — bkz. stepEnemies */
  }
  B.gold+=en.def.gold; B.killed++;
  syncHUD();
}
function tracer(a,b,color){

  R.stage.add(line);

}
function muzzleFlash(pos,color){

function boomFx(pos,color,size){
