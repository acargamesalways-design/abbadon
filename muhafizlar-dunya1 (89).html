/* ---------------- loop ---------------- */
function loop(){
  if(!R) return;
  const raw=R.clock.getDelta();
  /* ash always drifts */
  const pos=R.ash.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    let y=pos.getY(i)-R.ashVel[i]*raw;
    let x=pos.getX(i)+Math.sin((y+i)*0.6)*0.004;
    if(y<-0.5){ y=13; }
    pos.setY(i,y); pos.setX(i,x);
  }
  pos.needsUpdate=true;

  if(B && B.waterFx){
    const t=performance.now()/1000;
    for(const w of B.waterFx){
      w.mat.opacity = w.base*(0.6+0.4*Math.sin(t*w.speed+w.phase));
    }
  }

  if(B && B.gates && B.gates.length){
    const now=performance.now()/1000;
    for(const gt of B.gates){
      const gu=gt.userData;
      if(!gu.disks) continue;
      gu.disks.forEach(d=>{ d.rotation.z += raw*d.userData.speed; });
      if(gu.photon) gu.photon.rotation.z += raw*0.25;
      if(gu.light) gu.light.intensity = 2.0 + Math.sin(now*2.3)*0.5;
      gt.rotation.y += raw*0.06;
    }
  }

  if(B && !B.over){
    const dt = B.paused?0:raw*B.speed;
    if(dt>0){
      B.elapsed+=dt;
      stepSpawn(dt); stepEnemies(dt); stepUnits(dt); stepSquads(dt); stepShots(dt); stepWeather(dt); checkWave();
    }
  }
  updateCam();
  R.renderer.render(R.scene,R.camera);
}

function stepSpawn(dt){
  B.wt+=dt;
  while(B.queue.length && B.queue[0].time<=B.wt){ spawnEnemy(B.queue.shift().type); }
}

function stepEnemies(dt){
  for(const e of B.enemies){
    if(e.dead) continue;
    if(e.dying>0){
      e.dying-=dt;
      const ud=e.mesh.userData;
      if(ud.mixer){
        /* mixer varsa -- yer tutucuda hiç yok, gerçek modelde her zaman var --
           kill() içinde Death klibi zaten bu mixer'a bağlanmış oluyor */
        ud.mixer.update(dt);
        if(e.dying<=0){ e.dead=true; R.stage.remove(e.mesh); }
      } else {
        const k=Math.max(e.dying/0.3,0);
        e.mesh.scale.setScalar(k);
        e.mesh.rotation.z += dt*4;
        if(e.dying<=0){ e.dead=true; R.stage.remove(e.mesh); }
      }
      continue;
    }
    {
      const blocker=findGarrisonBlocker(e.mesh.position);
      if(blocker){
        /* garnizonun menzilinde durduruldu — d ilerlemiyor, garnizon bu düşmanı
           hedef alsın (henüz başka biriyle meşgul değilse) */
        if(!blocker.engagedEnemy || blocker.engagedEnemy.dead || blocker.engagedEnemy.dying>0) blocker.engagedEnemy=e;
      } else {
        e.d += e.def.speed*dt;
      }
    }
    const rt = B.routes[e.route||0];
    if(e.d>=rt.len){
      B.shelter=Math.max(0,B.shelter-e.def.dmg);
      boomFx(e.mesh.position.clone(), PAL.abd, 0.7);
      e.dead=true; R.stage.remove(e.mesh);
      syncHUD();
      if(B.shelter<=0){ finish(false); return; }
      continue;
    }
    const {p,dir}=pathPos(e.d, e.route||0);
    e.mesh.position.set(p.x, e.def.fly?0.95+Math.sin(B.elapsed*3+e.d)*0.08:0, p.z);
    e.mesh.rotation.y=Math.atan2(dir.x,dir.z) + (e.mesh.userData.yawOffset!==undefined ? e.mesh.userData.yawOffset : -Math.PI/2);
    /* hareket klibi: gerçek zamanlı oynatılır (kat edilen mesafeye değil süreye
       bağlı) — basit ve sağlam, hız farkını timeScale ile kabaca yansıtır. */
    if(e.mesh.userData.mixer){
      if(e.mesh.userData.moveAction) e.mesh.userData.moveAction.setEffectiveTimeScale(Math.max(0.4, e.def.speed/1.2));
      e.mesh.userData.mixer.update(dt);
    }
    /* karadelikten doğuş: sıfırdan büyüyerek ve hafif savrularak çık */
    if(e.birth>0){
      e.birth-=dt;
      const k=Math.max(0,Math.min(1,1-e.birth/0.45));
      const ease=k*k*(3-2*k);
      e.mesh.scale.setScalar(0.01+ease*0.99);
      e.mesh.position.y += (1-ease)*0.55;
      e.mesh.rotation.z = (1-ease)*0.6;
      if(e.birth<=0){ e.mesh.scale.setScalar(1); e.mesh.rotation.z=0; }
    }
    /* idle motion */
    if(e.def.kind==='inf'||e.def.kind==='heavy') e.mesh.position.y += Math.abs(Math.sin(B.elapsed*7+e.d*3))*0.02;
    if(e.mesh.userData.flyBob) e.mesh.rotation.z=Math.sin(B.elapsed*6+e.d)*0.08;
    /* hp bar */
    e.mesh.getWorldQuaternion(_tmpQ);
    e.bar.quaternion.copy(_tmpQ.invert()).multiply(R.camera.quaternion);
    const f=Math.max(0,e.hp/e.hpMax);
    e.bar.userData.fg.scale.x=f;
    e.bar.userData.fg.position.x=-(1-f)*0.24;
    e.bar.visible = f<1;
  }
  B.enemies=B.enemies.filter(e=>!e.dead);
}

function stepUnits(dt){
  for(const u of B.units){
    u.cd-=dt;
    const targets=u.def.targets||'both'; /* 'ground' | 'air' | 'both' — bkz. WEAPON_CLASSES.targets */

    /* önce mevcut kilitli hedefin hâlâ geçerli olup olmadığını kontrol et:
       ölmemiş, menzil içinde ve bu binanın hedefleyebileceği alanda olmalı.
       Geçerliyse odak DEĞİŞMEZ — o düşman ölene/menzilden çıkana kadar bu hedefte kalınır. */
    let best=u.target;
    if(best){
      const edom=best.def.domain||'ground';
      const stillValid = !(best.dying>0||best.dead)
        && (targets==='both'||targets===edom)
        && u.mesh.position.distanceTo(best.mesh.position)<=u.range;
      if(!stillValid) best=null;
    }

    /* kilitli hedef yoksa (yeni bina ya da önceki hedef geçersizleşti):
       base'e en yakın (yolda en çok ilerlemiş) düşmanı seç. */
    if(!best){
      let bestRemain=Infinity;
      for(const e of B.enemies){
        if(e.dying>0||e.dead) continue;
        const edom=e.def.domain||'ground';
        if(targets!=='both' && targets!==edom) continue; /* bu bina bu alanı hedefleyemiyor */
        const d=u.mesh.position.distanceTo(e.mesh.position);
        if(d>u.range) continue;
        const routeLen=(B.routes[e.route||0]||B.routes[0]).len;
        const remain=routeLen-e.d; /* küçük değer = base'e daha yakın */
        if(remain<bestRemain){ bestRemain=remain; best=e; }
      }
    }
    u.target=best;

    if(best){
      const dx=best.mesh.position.x-u.mesh.position.x, dz=best.mesh.position.z-u.mesh.position.z;
      const ang=Math.atan2(dx,dz);
      u.mesh.rotation.y += (ang-u.mesh.rotation.y)*Math.min(1,dt*8);
      if(u.cd<=0){ fire(u,best); u.cd=1/u.def.rate; }
    }
    /* namlu — geri tepme darbesi (rigsiz model için procedural "kick": kısa
       bir sıkışıp geri açılma) + gatling sınıfında ateş ederken sürekli dönüş */
    const barrel=u.mesh.userData.barrel;
    if(barrel){
      if(u.recoilT>0){
        u.recoilT=Math.max(0,u.recoilT-dt);
        const k=u.recoilT/0.09;
        const bs=barrel.userData.baseScale;
        barrel.scale.set(bs.x*(1-0.22*k), bs.y*(1-0.22*k), bs.z*(1-0.22*k));
      }
      if(WEAPON_FX[u.key] && WEAPON_FX[u.key].gatling && best){
        barrel.rotation.z += dt*16;
      }
    }
    if(u.mesh.userData.orb) u.mesh.userData.orb.rotation.y+=dt*3;
    if(u.mesh.userData.wing) u.mesh.userData.wing.rotation.x=Math.sin(B.elapsed*4)*0.18;
  }
}

/* ---------------- TAKVİYE NÖBETÇİSİ: düşüş + sabit göğüs göğüse çarpışma ----------------
   Nöbetçi ARTIK YÜRÜMÜYOR — konuşlandığı noktada sabit durur. findGarrisonBlocker
   dünya konumuna göre çalışır (rota numarasına bakmaz), böylece rotaların ortak
   segment paylaştığı haritalarda (ör. Kahire) "yakınında ama farklı rotada"
   diye dövüşmeme bug'ı artık oluşamaz — sadece mesafeye bakılıyor. */
const REINFORCE_BLOCK_RADIUS=0.42; /* nöbetçinin fiziksel olarak durdurduğu menzil */
const REINFORCE_MELEE_TICK=0.6;    /* göğüs göğüse vuruş aralığı (sn) */
const REINFORCE_MELEE_ANIM=0.32;   /* her vuruşta oynayan hamle animasyonunun süresi (sn) */

function findGarrisonBlocker(pos){
  for(const sq of (B.squads||[])){
    if(sq.dead || sq.dyingActive || sq.phase!=='landed') continue;
    if(sq.mesh.position.distanceTo(pos)<=REINFORCE_BLOCK_RADIUS) return sq;
  }
  return null;
}

function stepSquads(dt){
  if(!B.squads || !B.squads.length) return;
  for(const sq of B.squads){
    if(sq.dead) continue;

    if(sq.phase==='falling'){ stepDropPod(sq,dt); continue; }

    /* ölüm animasyonu oynarken: sadece mixer'ları ilerlet, hiçbir çarpışma
       mantığına girme — süre dolunca mesh sahneden kaldırılır */
    if(sq.dyingActive){
      sq.dyingT-=dt;
      (sq.figures||[]).forEach(fig=>{ if(fig.mixer) fig.mixer.update(dt); });
      if(sq.dyingT<=0){ sq.dead=true; R.stage.remove(sq.mesh); }
      continue;
    }

    if(sq.meleeAnimT>0) sq.meleeAnimT=Math.max(0,sq.meleeAnimT-dt);
    if(sq.hitShakeT>0) sq.hitShakeT=Math.max(0,sq.hitShakeT-dt);

    /* hedef: stepEnemies zaten menzile giren düşmanı sq.engagedEnemy'e
       işaretliyor (rotasına bakmaksızın, sadece dünya mesafesine göre);
       burada sadece hâlâ geçerli mi diye kontrol edip tazeliyoruz */
    let target=sq.engagedEnemy;
    if(target && (target.dead||target.dying>0)) target=null;
    if(!target){
      let bestDist=Infinity;
      for(const e of B.enemies){
        if(e.dying>0||e.dead) continue;
        const dist=e.mesh.position.distanceTo(sq.mesh.position);
        if(dist<=REINFORCE_BLOCK_RADIUS && dist<bestDist){ bestDist=dist; target=e; }
      }
    }
    sq.engagedEnemy=target;

    const engaging=!!target;
    if(engaging){
      sq.mesh.rotation.y=Math.atan2(target.mesh.position.x-sq.mesh.position.x, target.mesh.position.z-sq.mesh.position.z);
      sq.meleeCd=(sq.meleeCd||0)-dt;
      if(sq.meleeCd<=0){
        sq.meleeCd=REINFORCE_MELEE_TICK;
        sq.meleeAnimT=REINFORCE_MELEE_ANIM;
        damage(target, sq.dmg, 0, false);
        sq.hp-=target.def.dmg;
        sq.hitShakeT=0.18;
        playSfx('melee_hit');
        sparkFx(sq.mesh.position.clone(), PAL.ally);
        muzzleFlash(sq.mesh.position.clone().add(new THREE.Vector3(0,0.5,0)), 0xfff0c8);
        /* her tikte ya bir saldırı klibi ya da (küçük ihtimalle) bir "vuruldum"
           tepkisi oynat — göğüs göğüse çarpışmanın karşılıklı olduğu hissi için */
        const roll=Math.random();
        const clipName = roll<0.72 ? REINFORCE_ATTACK_CLIPS[Math.floor(Math.random()*REINFORCE_ATTACK_CLIPS.length)]
                                    : REINFORCE_HIT_CLIPS[Math.floor(Math.random()*REINFORCE_HIT_CLIPS.length)];
        (sq.figures||[]).forEach(fig=>soldierPlay(fig, clipName, false));
        if(sq.hp<=0){ killSquad(sq); continue; }
      }
    } else {
      /* menzilde kimse yoksa bile, haritada YAŞAYAN herhangi bir düşman varsa
         en yakınına dönük kal (tetikte nöbetçi hissi) — sadece savaş alanı
         tamamen temizse varsayılan (kapıya dönük) yöne dön. Bu, bir düşmanı
         öldürüp de eski yöne "geri dönme" tuhaflığını da ortadan kaldırıyor. */
      let watch=null, bestDist=Infinity;
      for(const e of B.enemies){
        if(e.dying>0||e.dead) continue;
        const dist=e.mesh.position.distanceTo(sq.mesh.position);
        if(dist<bestDist){ bestDist=dist; watch=e; }
      }
      sq.mesh.rotation.y = watch
        ? Math.atan2(watch.mesh.position.x-sq.mesh.position.x, watch.mesh.position.z-sq.mesh.position.z)
        : sq.baseFacing;
    }

    let shakeX=0, shakeZ=0;
    if(sq.hitShakeT>0){
      const k=sq.hitShakeT/0.18;
      shakeX=(Math.random()-0.5)*0.05*k; shakeZ=(Math.random()-0.5)*0.03*k;
    }
    (sq.figures||[]).forEach(fig=>{
      if(fig.mixer) fig.mixer.update(dt);
      if(sq.meleeAnimT<=0) soldierPlay(fig, 'Idle', true);
      const t=1-(sq.meleeAnimT/REINFORCE_MELEE_ANIM);
      const lunge=(engaging && sq.meleeAnimT>0) ? Math.sin(Math.min(1,t*1.6)*Math.PI) : 0;
      fig.group.position.set(fig.xBase+shakeX, 0, fig.zBase+lunge*0.10+shakeZ);
    });
    if(sq.bar){
      const f=Math.max(0,sq.hp/sq.hpMax);
      sq.bar.userData.fg.scale.x=f;
      sq.bar.userData.fg.position.x=-(1-f)*0.24;
      sq.bar.quaternion.copy(R.camera.quaternion);
    }
  }
  B.squads=B.squads.filter(s=>!s.dead);
}

/* squad'ı hemen silmek yerine Death klibini oynatıp bitmesini bekler — tıpkı
   düşman kill() fonksiyonundaki dying-süresi mantığı gibi. */
function killSquad(sq){
  if(sq.dead||sq.dyingActive) return;
  sq.dyingActive=true;
  sq.hitShakeT=0;
  let maxDur=0.5;
  (sq.figures||[]).forEach(fig=>{
    soldierPlay(fig,'Death',false);
    const clip=fig.anims && fig.anims['Death'];
    if(clip && clip.duration) maxDur=Math.max(maxDur, clip.duration);
  });
  sq.dyingT=maxDur;
  if(sq.bar) sq.bar.visible=false;
  boomFx(sq.mesh.position.clone(), PAL.ally, 0.4);
}

/* ---------------- TAKVİYE FİGÜRÜ: gerçek Quaternius modeli + animasyon ---------------- */
const REINFORCE_ATTACK_CLIPS=['Punch','Kick','SwordSlash'];
const REINFORCE_HIT_CLIPS=['HitRecieve_1','HitRecieve_2'];
/* Quaternius karakterleri varsayılan olarak +Z'ye bakacak şekilde modellenir
   (canavar paketiyle aynı kural — bkz. buildEnemyMesh/yawOffset). Sahada ters
   göründüğü ortaya çıkarsa bu sabiti Math.PI yap. */
const SOLDIER_YAW_FIX=0;

function soldierPlay(fig, name, loop){
  const clip = fig.anims && fig.anims[name];
  if(!clip || !fig.mixer) return false;
  if(loop && fig.current===name) return true; /* zaten aynı döngüsel klip çalıyor */
  const action = fig.actions[name] || (fig.actions[name]=fig.mixer.clipAction(clip));
  action.reset();
  action.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce, loop?Infinity:1);
  action.clampWhenFinished=!loop;
  if(fig.activeAction && fig.activeAction!==action) fig.activeAction.fadeOut(0.15);
  action.fadeIn(0.15).play();
  fig.activeAction=action;
  fig.current=name;
  return true;
}

function buildPlaceholderSoldierFigure(){
  const s=0.24;
  const bodyMat=new THREE.MeshStandardMaterial({color:PAL.ally, roughness:0.6, metalness:0.15});
  const headMat=new THREE.MeshStandardMaterial({color:0xe8c99a, roughness:0.7, metalness:0.05});
  const g=new THREE.Group();
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(s*0.42,s*0.5,s*0.85,8), bodyMat);
  torso.position.y=s*0.9; torso.castShadow=true; g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(s*0.32,8,8), headMat);
  head.position.y=s*1.45; head.castShadow=true; g.add(head);
  return g;
}
/* tek bir asker figürü — gerçek model yüklenmişse (SOLDIER_CACHE) klonlanmış
   iskeletli mesh + kendi AnimationMixer'ı; henüz yüklenmemişse (nadiren, örn.
   ilk saniyelerde) eski primitif yer tutucuya düşer, oyun asla çökmez. */
function buildSoldierFigure(modelName){
  const mk=SOLDIER_CACHE[modelName];
  const g=new THREE.Group();
  if(mk){
    const model=cloneSkinnedGLTF(mk.scene);
    const targetH=1.15; /* b72: tek asker, haritada net görünsün diye büyütüldü */
    model.scale.setScalar(targetH/mk.height);
    model.rotation.y=SOLDIER_YAW_FIX;
    g.add(model);
    const mixer=new THREE.AnimationMixer(model);
    return { group:g, mixer, anims:mk.anims, actions:{}, activeAction:null, current:null, xBase:0, zBase:0 };
  }
  g.add(buildPlaceholderSoldierFigure());
  return { group:g, mixer:null, anims:null, actions:{}, activeAction:null, current:null, xBase:0, zBase:0 };
}
function buildSoldierSquadMesh(modelName, count){
  const g=new THREE.Group();
  const n=Math.max(1,count);
  const figures=[];
  for(let i=0;i<n;i++){
    const fig=buildSoldierFigure(modelName);
    const off=(i-(n-1)/2)*0.26, zb=(i%2)*0.05;
    fig.group.position.set(off,0,zb);
    fig.xBase=off; fig.zBase=zb;
    g.add(fig.group);
    figures.push(fig);
  }
  g.userData.figures=figures;
  return g;
}

/* ---------------- TAKVİYE: konuşlandırma noktası seçimi ---------------- */
function startReinforce(){
  if(!B || B.over) return;
  if(B.deployPicking){ cancelDeployPicking(); return; }
  if(B.reinforceUses<=0){ toast('Takviye tükendi.'); return; }
  enterDeployPicking();
}
function enterDeployPicking(){
  B.deployPicking=true;
  B.wasPausedBeforePick=B.paused;
  B.paused=true;
  const pb=document.getElementById('bPause');
  if(pb){ pb.textContent='▶'; pb.classList.add('on'); }
  toast('Konuşlandırmak için patika üzerinde bir noktaya dokun.');
  showDeployMarkers();
}
function cancelDeployPicking(){
  if(!B.deployPicking) return;
  B.deployPicking=false;
  clearDeployMarkers();
  B.paused=B.wasPausedBeforePick||false;
  const pb=document.getElementById('bPause');
  if(pb){ pb.textContent=B.paused?'▶':'❚❚'; pb.classList.toggle('on',B.paused); }
}
/* haritadaki TÜM rotaların birleşim kümesindeki her benzersiz patika hücresine
   bir işaret koyar — hangi rotaya ait olduğu artık önemli değil, çünkü
   konuşlandıktan sonra nöbetçi menzilindeki her düşmanla (rotasına bakmaksızın,
   dünya konumuna göre) dövüşüyor. Bu, eski "rota numarası eşleşmiyor" bug'ını
   da kökten çözüyor. */
function showDeployMarkers(){
  clearDeployMarkers();
  const seen=new Set();
  B.routes.forEach(rt=>{
    rt.cells.forEach((cell,ci)=>{
      const key=cell.c+','+cell.r;
      if(seen.has(key)) return;
      seen.add(key);
      const pt=rt.pts[ci];
      const a=rt.pts[Math.max(0,ci-1)], b=rt.pts[Math.min(rt.pts.length-1,ci+1)];
      /* kapıya (tehdidin geldiği yöne) baksın diye TERS yön — b.x-a.x değil a.x-b.x */
      const facing=Math.atan2(a.x-b.x, a.z-b.z);
      const spr=makeDeployMarkerSprite();
      spr.position.set(pt.x, 0.42, pt.z);
      spr.userData.deployPos=pt.clone();
      spr.userData.deployFacing=facing;
      R.stage.add(spr);
      B.deployMarkers.push(spr);
    });
  });
}
function clearDeployMarkers(){
  (B.deployMarkers||[]).forEach(m=>R.stage.remove(m));
  B.deployMarkers=[];
}
function makeDeployMarkerSprite(){
  const cv=document.createElement('canvas'); cv.width=96; cv.height=96;
  const ctx=cv.getContext('2d');
  ctx.beginPath(); ctx.arc(48,48,38,0,Math.PI*2);
  ctx.fillStyle='rgba(196,178,108,0.55)'; ctx.fill();
  ctx.lineWidth=5; ctx.strokeStyle='rgba(255,240,200,0.95)'; ctx.stroke();
  ctx.strokeStyle='#241a0a'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(48,28); ctx.lineTo(48,64); ctx.moveTo(34,50); ctx.lineTo(48,64); ctx.lineTo(62,50); ctx.stroke();
  const tex=new THREE.CanvasTexture(cv);
  const mat=new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true});
  const spr=new THREE.Sprite(mat);
  spr.scale.set(0.5,0.5,0.5);
  spr.renderOrder=60;
  return spr;
}
/* aynı rotada olsun ya da olmasın, seçilen noktaya belirli bir yarıçapta
   yaklaşan HER düşmanı fiziksel olarak durduran, sabit tek bir nöbetçi
   konuşlandırır — önce gökten bir düşüş kapsülüyle iner (bkz. stepDropPod). */
function dispatchReinforcement(pos, facing){
  if(!B || B.reinforceUses<=0) return;
  B.reinforceUses--;
  const hp=reinforceHp(), dmg=reinforceDmg(), modelName=reinforceTierData().model;
  const squad={
    mesh:new THREE.Group(), bar:null, figures:null, modelName,
    hp, hpMax:hp, dmg,
    dead:false, dyingActive:false, dyingT:0,
    phase:'falling', fallT:0, fallDur:0.8, fallStartY:6, pod:null,
    baseFacing:facing||0, meleeCd:0, meleeAnimT:0, hitShakeT:0, engagedEnemy:null,
  };
  squad.mesh.position.set(pos.x,0,pos.z);
  squad.mesh.rotation.y=facing||0;
  R.stage.add(squad.mesh);
  squad.pod=buildDropPod();
  squad.pod.position.y=squad.fallStartY;
  squad.mesh.add(squad.pod);
  playSfx('drop_fall');
  B.squads.push(squad);
  toast('Takviye iniyor!');
  syncHUD();
}
/* r128'de CapsuleGeometry yok — silindir gövde + koni burun + parlayan halka
   ile basit ama okunaklı bir "düşüş kapsülü" siluetı. */
function buildDropPod(){
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color:0xd8d2c0, roughness:0.35, metalness:0.55});
  const trimMat=new THREE.MeshStandardMaterial({color:PAL.ally, roughness:0.3, metalness:0.4, emissive:PAL.ally, emissiveIntensity:0.85});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.5,10), bodyMat);
  g.add(body);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.26,10), bodyMat);
  nose.position.y=-0.38; g.add(nose);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.19,0.03,6,16), trimMat);
  ring.rotation.x=Math.PI/2; ring.position.y=0.16; g.add(ring);
  const glow=new THREE.PointLight(0x9fd4ff, 1.5, 3.2);
  g.add(glow);
  return g;
}
function stepDropPod(sq,dt){
  sq.fallT=Math.min(sq.fallDur, sq.fallT+dt);
  const t=sq.fallT/sq.fallDur, eased=t*t;
  sq.pod.position.y=sq.fallStartY*(1-eased);
  sq.pod.rotation.y+=dt*9;
  if(t>=1) landReinforcement(sq);
}
function landReinforcement(sq){
  sq.mesh.remove(sq.pod);
  sq.pod=null;
  boomFx(sq.mesh.position.clone(), PAL.ally, 0.55);
  sparkFx(sq.mesh.position.clone(), 0xfff0c8);
  const inner=buildSoldierSquadMesh(sq.modelName, 1);
  sq.mesh.add(inner);
  sq.figures=inner.userData.figures;
  sq.figures.forEach(fig=>soldierPlay(fig,'Idle',true));
  sq.bar=makeBar();
  sq.bar.position.y=1.45;
  sq.mesh.add(sq.bar);
  sq.phase='landed';
  syncHUD();
}

function stepShots(dt){
  for(const s of B.shots){
    if(s.type==='fx'){
      s.ttl-=dt;
      const k=Math.max(s.ttl/s.max,0);
      if(s.obj.material){
        /* flicker: yıldırım sabit sönmez, titreyerek kaybolur */
        s.obj.material.opacity = s.flicker ? k*(0.5+0.5*Math.random()) : k*0.9;
      }
      if(s.grow) s.obj.scale.setScalar(1+(1-k)*1.6);
      if(s.drift && s.obj.userData.vel){
        s.obj.position.addScaledVector(s.obj.userData.vel, dt);
        s.obj.userData.vel.y -= dt*3.2;   /* hafif yerçekimi */
      }
      if(s.ttl<=0){ R.stage.remove(s.obj); s.done=true; }
    } else if(s.type==='proj'){
      s.t+=dt;
      const k=Math.min(s.t/s.dur,1);
      if(!s.obj){ s.obj=makeProjectile(s.style,s.color); R.stage.add(s.obj); }
      const x=s.from.x+(s.to.x-s.from.x)*k;
      const z=s.from.z+(s.to.z-s.from.z)*k;
      let y=s.from.y+(s.to.y-s.from.y)*k;
      if(s.arc) y += Math.sin(k*Math.PI)*s.arc;
      s.obj.position.set(x,y,z);
      if(s.style==='bullet') s.obj.lookAt(s.to.x,s.to.y,s.to.z);
      if(s.style==='ball') s.obj.rotation.x += dt*9;
      if(s.style==='orb'){
        const p=1+Math.sin(B.elapsed*22)*0.14;
        s.obj.scale.setScalar(p);
      }
      if(k>=1){
        R.stage.remove(s.obj);
        const hit=new THREE.Vector3(x,y,z);
        if(s.style==='ball')       boomFx(hit, s.impact, s.boom||0.3);
        else if(s.style==='orb')   pulseFx(hit, s.impact);
        else                       sparkFx(hit, s.impact);
        s.done=true;
      }
    } else if(s.type==='lob'){
      s.t+=dt;
      const k=Math.min(s.t/s.dur,1);
      if(!s.obj){
        s.obj=new THREE.Mesh(new THREE.SphereGeometry(0.075,8,8), mat(s.color||0x3a3128,0.8));
        R.stage.add(s.obj);
      }
      const tp = (s.target&&!s.target.dead)? s.target.mesh.position : s.lastT || s.from;
      s.lastT=tp.clone();
      const x=s.from.x+(tp.x-s.from.x)*k, z=s.from.z+(tp.z-s.from.z)*k;
      const y=s.from.y+(0.3-s.from.y)*k + Math.sin(k*Math.PI)*1.3;
      s.obj.position.set(x,y,z);
      if(k>=1){
        R.stage.remove(s.obj);
        boomFx(new THREE.Vector3(x,0.25,z), s.impactColor||PAL.rust, s.splash*0.7);
        /* area damage at impact */
        for(const e of B.enemies){
          if(e.dying>0||e.dead) continue;
          if(e.mesh.position.distanceTo(new THREE.Vector3(x,e.mesh.position.y,z))<=s.splash){
            damage(e, s.dmg, 0);
          }
        }
        s.done=true;
      }
    } else if(s.type==='missile'){
      s.life+=dt;
      if(!s.obj){ s.obj=makeProjectile('missile', s.color); R.stage.add(s.obj); }
      const targetOk = s.target && !s.target.dead && !(s.target.dying>0);
      const tp = targetOk ? s.target.mesh.position : s.lastT;
      s.lastT=tp.clone();
      const toTarget=new THREE.Vector3().subVectors(tp, s.pos);
      const dist=toTarget.length();
      if(dist>0.001) toTarget.normalize();
      /* mevcut yön ile hedef yönü arasında SINIRLI bir dönüş hızıyla döner —
         aniden hedefe kilitlenmez, kavis çizerek yönelir, gerçek güdümlü füze
         hissi verir. */
      const curDir=s.vel.clone().normalize();
      const dot=Math.max(-1,Math.min(1,curDir.dot(toTarget)));
      const angleBetween=Math.acos(dot);
      const maxTurn=s.turn*dt;
      let newDir;
      if(!isFinite(angleBetween) || angleBetween<=maxTurn){
        newDir=toTarget;
      } else {
        const axis=new THREE.Vector3().crossVectors(curDir,toTarget);
        if(axis.lengthSq()<1e-6) newDir=toTarget;
        else{ axis.normalize(); newDir=curDir.clone().applyAxisAngle(axis,maxTurn).normalize(); }
      }
      s.vel.copy(newDir).multiplyScalar(s.curSpd);
      s.curSpd=Math.min(s.maxSpd, s.curSpd+s.accel*dt);
      s.pos.addScaledVector(s.vel, dt);
      s.obj.position.copy(s.pos);
      s.obj.lookAt(s.pos.clone().add(newDir));
      s.trailT=(s.trailT||0)-dt;
      if(s.trailT<=0){ s.trailT=0.045; sparkFx(s.pos.clone(), s.color); }

      if(dist<=0.28 || s.life>=s.maxLife){
        R.stage.remove(s.obj);
        burstFx(s.pos.clone(), s.impact);
        s.done=true;
      }
    }
  }
  B.shots=B.shots.filter(s=>!s.done);
}

function checkWave(){
  if(B.queue.length===0 && B.enemies.length===0){
    if(B.wave>=B.map.waves.length-1) finish(true);
    else nextWave();
  }
}

function finish(won){
  B.over=true;
  playSfx(won?'victory':'defeat');
  stopMusic();
  clearSelection();
  if(won){
    const frac=B.shelter/B.shelterMax;
    const stars = frac>0.8?3:(frac>0.4?2:1);
    const prev=meta.stars[B.map.id]||0;
    if(stars>prev) meta.stars[B.map.id]=stars;
    const goldWon = 60+stars*35+B.killed*2;
    meta.gold+=goldWon;
    meta.shards+=6+stars*4;
    if(B.idx===MAPS.length-1) meta.done=true;
    saveMeta();
    resultPop(true,stars,goldWon,null);
  } else {
    resultPop(false,0,0,null);
  }
}

function resultPop(won,stars,goldWon,unlockedNow){
  const ov=el(`<div class="overlay">
    <div class="sheet">
      <div class="eyebrow" style="${won?'':'color:var(--void);'}">${won?'Cephe temizlendi':'Sığınak düştü'}</div>
      <h2>${won?B.map.name:'Geri çekiliyoruz'}</h2>
      ${won?`<div class="rankbig">${[1,2,3].map(n=>`<i class="${n<=stars?'on':''}"></i>`).join('')}</div>`:''}
      ${won?`<div class="rows">
        <div class="row-i"><span>Kalan sığınak</span><b class="num">${B.shelter}/${B.shelterMax}</b></div>
        <div class="row-i"><span>Etkisiz hale getirilen</span><b class="num">${B.killed}</b></div>
        <div class="row-i"><span>Kazanılan altın</span><b class="num">+${goldWon}</b></div>
      </div>`:`<p>Abbadon hattı aştı. Mevzileri yeniden düşün — düşmanın dizilimini artık biliyorsun.</p>`}
      ${unlockedNow?`<div class="reward">
        <div class="rl">Halkın armağanı</div>
        <div class="rn">${unlockedNow.title}</div>
        <div class="rd">${UNITS[unlockedNow.unit].desc} Artık ordunda.</div>
      </div>`:''}
      <div class="acts">
        ${won?'':'<button class="btn quiet" id="again">Tekrar dene</button>'}
        <button class="btn ember" id="toMaps">Cephe haritası</button>
      </div>
    </div>
  </div>`);
  ov.querySelector('#toMaps').addEventListener('click',()=>{
    ov.remove();
    if(meta.done && B.idx===MAPS.length-1){ exitBattle(); renderStory('outro',()=>renderWorldSelect()); }
    else { exitBattle(); renderMapSelect(); }
  });
  const ag=ov.querySelector('#again');
  if(ag) ag.addEventListener('click',()=>{ const i=B.idx; ov.remove(); startBattle(i); });
  document.getElementById('battleScreen').appendChild(ov);
}

/* ---------------- HUD ---------------- */
function renderHUD(){
  const host=document.getElementById('battleScreen');
  host.querySelectorAll('.hud-top,.dock').forEach(n=>n.remove());

  const top=el(`<div class="hud-top">
    <div class="gpill"><span class="ico coin"></span><span class="num" id="hGold">${B.gold}</span></div>
    <div class="gpill grow">
      <div class="shwrap">
        <div class="lbl">Sığınak</div>
        <div class="shtrack"><i id="hHp" style="width:${B.shelter/B.shelterMax*100}%"></i></div>
      </div>
    </div>
    <div class="gpill"><span class="lbl">Dalga</span><span class="num" id="hWave">${Math.max(B.wave+1,1)}/${B.map.waves.length}</span></div>
    <button class="iconbtn" id="bReinforce">🪖<span class="num" id="hReinforce">${B.reinforceUses}</span></button>
    <button class="iconbtn" id="bMute">${isMuted()?'🔇':'🔊'}</button>
    <button class="iconbtn" id="bPause">❚❚</button>
    <button class="iconbtn" id="bSpeed">1×</button>
    <button class="iconbtn" id="bExit">✕</button>
  </div>`);
  top.querySelector('#bReinforce').addEventListener('click',()=>startReinforce());
  top.querySelector('#bMute').addEventListener('click',e=>{
    const m=toggleMute();
    e.currentTarget.textContent=m?'🔇':'🔊';
  });
  top.querySelector('#bPause').addEventListener('click',e=>{
    if(B.deployPicking){ cancelDeployPicking(); return; }
    B.paused=!B.paused;
    e.currentTarget.textContent=B.paused?'▶':'❚❚';
    e.currentTarget.classList.toggle('on',B.paused);
  });
  top.querySelector('#bSpeed').addEventListener('click',e=>{
    B.speed=B.speed===1?2:1;
    e.currentTarget.textContent=B.speed+'×';
    e.currentTarget.classList.toggle('on',B.speed===2);
  });
  top.querySelector('#bExit').addEventListener('click',()=>{ exitBattle(); renderMapSelect(); });
  host.appendChild(top);

  const dock=el(`<div class="dock"><div class="dock-scroll" id="tray"></div></div>`);
  const tray=dock.querySelector('#tray');
  Object.entries(UNITS).forEach(([k,u])=>{
    const col='#'+u.color.toString(16).padStart(6,'0');
    const icon=weaponIconSrc(k);
    const domLabel = u.targets==='air'?'HAVA':(u.targets==='ground'?'KARA':'H+K');
    const domClass = u.targets==='air'?'air':(u.targets==='ground'?'ground':'both');
    const card=el(`<div class="ucard" data-k="${k}">
      <span class="domtag ${domClass}">${domLabel}</span>
      ${icon?`<img class="sw icon" src="${icon}" alt="">`:`<div class="sw" style="background:${col}"></div>`}
      <div class="foot">
        <div class="nm">${u.name}</div>
        <div class="cost"><span class="ico coin"></span><span class="num">${u.cost}</span></div>
      </div>
    </div>`);
    card.addEventListener('click',()=>{
      if(B.gold<u.cost){ toast('Yetersiz kaynak.'); return; }
      B.picking = B.picking===k?null:k;
      clearSelection();
      updatePlacementMarkers();
      document.querySelectorAll('.ucard').forEach(c=>c.classList.toggle('sel', c.dataset.k===B.picking));
      if(B.picking) toast('Aydınlanan bir kareye dokun.');
    });
    tray.appendChild(card);
  });
  host.appendChild(dock);
  syncHUD();
}
function syncHUD(){
  if(!B) return;
  const g=document.getElementById('hGold'); if(g) g.textContent=B.gold;
  const h=document.getElementById('hHp'); if(h) h.style.width=(B.shelter/B.shelterMax*100)+'%';
  const w=document.getElementById('hWave'); if(w) w.textContent=`${Math.max(B.wave+1,1)}/${B.map.waves.length}`;
  const rc=document.getElementById('hReinforce'); if(rc) rc.textContent=B.reinforceUses;
  const rb=document.getElementById('bReinforce'); if(rb) rb.classList.toggle('no', B.reinforceUses<=0);
  document.querySelectorAll('.ucard').forEach(c=>{
    const u=UNITS[c.dataset.k];
    c.classList.toggle('no', B.gold<u.cost);
  });
}

/* ---------------- BOOT ---------------- */
(async function(){
  const bar=document.getElementById('assetLoadingBar');
  const overlay=document.getElementById('assetLoading');
  if(typeof ASSET_B64==='undefined'){
    console.warn('muhafizlar-assets.js bulunamadı — bina/silah/gökyüzü asetleri eksik olacak.');
  } else {
    try{ await preloadKenneyAssets(bar); }
    catch(err){ console.warn('varlık ön-yükleme hatası:',err); }
  }
  if(overlay) overlay.remove();
  await loadMeta();
  if(!meta.seenIntro){
    renderStory('intro', async ()=>{ meta.seenIntro=true; await saveMeta(); renderWorldSelect(); });
  } else {
    renderWorldSelect();
  }
})();
